<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P&amp;L Calendar — bpleone</title>
<meta name="description" content="Daily brain P&L on a calendar heatmap. See your streaks, bad days, and weekly rhythm at a glance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v191">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.month-nav { display:flex;justify-content:space-between;align-items:center;margin-bottom:18px; }
.month-nav h2 { margin:0;font-size:22px;font-weight:800; }
.month-nav button { padding:8px 16px;background:rgba(120,140,160,0.12);color:var(--text);border:1px solid rgba(255,255,255,0.1);border-radius:6px;font-weight:700;cursor:pointer; }
.cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:6px; }
.cal-cell { aspect-ratio:1;border-radius:8px;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;font-family:var(--font-mono);background:rgba(255,255,255,0.03);position:relative;overflow:hidden;cursor:default; }
.cal-cell .day { font-size:11px;color:var(--text-muted);font-weight:700; }
.cal-cell .pnl { font-size:13px;font-weight:800;text-align:right; }
.cal-cell.empty { background:transparent; }
.cal-cell.gain { background:rgba(16,185,129,calc(var(--intensity,0.1) * 1));border:1px solid rgba(16,185,129,0.3); }
.cal-cell.loss { background:rgba(220,38,38,calc(var(--intensity,0.1) * 1));border:1px solid rgba(220,38,38,0.3); }
.cal-cell.zero { background:rgba(120,140,160,0.06); }
.cal-cell.today { outline:2px solid var(--accent);outline-offset:1px; }
.cal-cell .pnl.gain-text { color:var(--green); }
.cal-cell .pnl.loss-text { color:var(--red); }
.dow-row { display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px; }
.dow-row div { text-align:center;font-size:10px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:1px; }
.tile { padding:18px;background:var(--bg-elevated);border-radius:10px; }
.tile .lbl { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:700; }
.tile .val { font-family:var(--font-mono);font-size:22px;font-weight:800;margin-top:6px;color:var(--accent); }
.tile.gain .val { color:var(--green); }
.tile.loss .val { color:var(--red); }
.legend { display:flex;gap:14px;align-items:center;margin-top:14px;font-size:11px;color:var(--text-muted); }
.legend-box { display:inline-block;width:18px;height:18px;border-radius:4px;margin-right:4px;vertical-align:middle; }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">📆 Daily P&amp;L Calendar</div>
      <div class="page-subtitle">Brain's daily simulated $ P&amp;L on a heat-map calendar. Pattern recognition for your trading rhythm.</div>
    </div>
  </div>

  <div class="grid grid-4 mb-24" id="kpi-grid"></div>

  <div class="card mb-24">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">← Prev</button>
      <h2 id="month-title">—</h2>
      <button onclick="changeMonth(1)">Next →</button>
    </div>
    <div class="dow-row"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="legend">
      <span><span class="legend-box" style="background:rgba(16,185,129,0.7);"></span>Big win</span>
      <span><span class="legend-box" style="background:rgba(16,185,129,0.3);"></span>Small win</span>
      <span><span class="legend-box" style="background:rgba(120,140,160,0.1);"></span>Flat</span>
      <span><span class="legend-box" style="background:rgba(220,38,38,0.3);"></span>Small loss</span>
      <span><span class="legend-box" style="background:rgba(220,38,38,0.7);"></span>Big loss</span>
    </div>
  </div>

  <div class="card mb-24">
    <div class="card-header"><div class="card-title">📊 Day-of-week breakdown (lifetime)</div></div>
    <div id="dow-breakdown" style="font-family:var(--font-mono);font-size:13px;line-height:2;color:var(--text-secondary);"></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title">🔗 Related</div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <a href="money-made.html" style="text-decoration:none;display:inline-block;background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;">💵 Money Made</a>
      <a href="brain-vs-spy-live.html" style="text-decoration:none;display:inline-block;background:rgba(120,140,160,0.12);color:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;">⚖️ vs SPY</a>
      <a href="brain-daily-card.html" style="text-decoration:none;display:inline-block;background:rgba(120,140,160,0.12);color:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;">📰 Daily Card</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v191"></script>
<script src="js/ai-client.js?v=v191"></script>
<script src="js/app.js?v=v191"></script>
<script src="js/notify.js?v=v191"></script>
<script src="js/live.js?v=v191"></script>
<script src="js/money-tracker.js?v=v191"></script>
<script src="js/demo-data.js?v=v191"></script>
<script src="js/demo-fab.js?v=v191"></script>
<script>buildNav('pnl-calendar');</script>
<script>
let viewMonth = new Date();
viewMonth.setDate(1); viewMonth.setHours(0,0,0,0);

function fmt$(v) {
  if (!isFinite(v) || v === 0) return '';
  const sign = v < 0 ? '-' : '+';
  const abs = Math.abs(v);
  if (abs >= 1000) return sign + '$' + (abs / 1000).toFixed(1) + 'k';
  return sign + '$' + abs.toFixed(0);
}
function changeMonth(d) {
  viewMonth.setMonth(viewMonth.getMonth() + d);
  render();
}
function buildDailyPnL() {
  if (!window.MoneyTracker) return null;
  const s = window.MoneyTracker.summary();
  if (s.empty || !s.windows || !s.windows.lifetime) return null;
  const trades = s.windows.lifetime.trades || [];
  const byDay = {};
  for (const t of trades) {
    const d = new Date(t.ts);
    d.setHours(0, 0, 0, 0);
    const k = d.getTime();
    if (!byDay[k]) byDay[k] = 0;
    byDay[k] += t.pnl;
  }
  return byDay;
}

function render() {
  if (!window.MoneyTracker) { setTimeout(render, 500); return; }
  const byDay = buildDailyPnL();
  const title = viewMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  document.getElementById('month-title').textContent = title;

  // Build calendar grid
  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const lastOfMonth = new Date(year, month + 1, 0);
  const startDow = firstOfMonth.getDay();
  const daysInMonth = lastOfMonth.getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);

  // Find max |pnl| for color intensity normalization
  let maxAbsPnL = 0;
  if (byDay) {
    for (let d = 1; d <= daysInMonth; d++) {
      const ts = new Date(year, month, d).getTime();
      const v = Math.abs(byDay[ts] || 0);
      if (v > maxAbsPnL) maxAbsPnL = v;
    }
  }

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div class="cal-cell empty"></div>');
  for (let d = 1; d <= daysInMonth; d++) {
    const day = new Date(year, month, d);
    const ts = day.getTime();
    const pnl = byDay ? (byDay[ts] || 0) : 0;
    let cls = 'cal-cell ';
    let intensity = 0.1;
    if (pnl > 0) {
      cls += 'gain ';
      intensity = maxAbsPnL > 0 ? Math.max(0.15, Math.min(0.85, pnl / maxAbsPnL)) : 0.3;
    } else if (pnl < 0) {
      cls += 'loss ';
      intensity = maxAbsPnL > 0 ? Math.max(0.15, Math.min(0.85, Math.abs(pnl) / maxAbsPnL)) : 0.3;
    } else {
      cls += 'zero ';
    }
    if (day.getTime() === today.getTime()) cls += 'today ';
    const pnlText = pnl === 0 ? '' : fmt$(pnl);
    const textCls = pnl > 0 ? 'gain-text' : (pnl < 0 ? 'loss-text' : '');
    cells.push('<div class="' + cls + '" style="--intensity:' + intensity + ';" title="' + day.toLocaleDateString() + ' · ' + fmt$(pnl) + '"><div class="day">' + d + '</div><div class="pnl ' + textCls + '">' + pnlText + '</div></div>');
  }
  document.getElementById('cal-grid').innerHTML = cells.join('');

  // KPIs: this month
  let monthPnL = 0, monthDays = 0, winDays = 0, lossDays = 0, bestDay = 0, worstDay = 0;
  if (byDay) {
    for (let d = 1; d <= daysInMonth; d++) {
      const ts = new Date(year, month, d).getTime();
      const p = byDay[ts] || 0;
      monthPnL += p;
      if (p !== 0) monthDays++;
      if (p > 0) { winDays++; if (p > bestDay) bestDay = p; }
      if (p < 0) { lossDays++; if (p < worstDay) worstDay = p; }
    }
  }
  document.getElementById('kpi-grid').innerHTML =
    '<div class="tile ' + (monthPnL >= 0 ? 'gain' : 'loss') + '"><div class="lbl">Month P&L</div><div class="val">' + (monthPnL >= 0 ? '+' : '') + (monthPnL.toFixed ? fmt$(monthPnL) : '$0') + '</div></div>' +
    '<div class="tile"><div class="lbl">Trading days</div><div class="val">' + monthDays + '</div></div>' +
    '<div class="tile gain"><div class="lbl">Best day</div><div class="val">' + fmt$(bestDay) + '</div></div>' +
    '<div class="tile loss"><div class="lbl">Worst day</div><div class="val">' + fmt$(worstDay) + '</div></div>';

  // Day-of-week breakdown (lifetime)
  if (byDay) {
    const dowNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const dowTotals = [0, 0, 0, 0, 0, 0, 0];
    const dowCounts = [0, 0, 0, 0, 0, 0, 0];
    for (const ts in byDay) {
      const d = new Date(parseInt(ts));
      dowTotals[d.getDay()] += byDay[ts];
      dowCounts[d.getDay()]++;
    }
    document.getElementById('dow-breakdown').innerHTML = dowNames.map((n, i) => {
      const t = dowTotals[i]; const c = dowCounts[i];
      const avg = c > 0 ? t / c : 0;
      const color = t >= 0 ? 'var(--green)' : 'var(--red)';
      return '<div><strong>' + n + '</strong>: <span style="color:' + color + ';font-weight:700;">' + fmt$(t) + '</span> total · avg ' + fmt$(avg) + ' (' + c + ' days)</div>';
    }).join('');
  }
}
setTimeout(render, 500);
setInterval(render, 12000);
</script>
</body>
</html>
