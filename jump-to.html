let selIdx = 0;
let activeCat = 'all';
let filtered = PAGES;

function score(p, q) {
  if (!q) return 1;
  const blob = (p.name + ' ' + p.desc + ' ' + p.tags + ' ' + p.url).toLowerCase();
  const qLow = q.toLowerCase();
  let s = 0;
  if (blob.includes(qLow)) s = 100;
  if (p.name.toLowerCase().includes(qLow)) s += 50;
  if (p.name.toLowerCase().startsWith(qLow)) s += 100;
  // Per-word boost
  qLow.split(/\s+/).forEach(w => { if (blob.includes(w)) s += 5; });
  return s;
}

function render() {
  const q = document.getElementById('q').value.trim();
  filtered = PAGES.filter(p => activeCat === 'all' || p.cat === activeCat);
  if (q) filtered = filtered.map(p => ({ p, s: score(p, q) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).map(x => x.p);
  filtered = filtered.slice(0, 30);
  selIdx = Math.min(selIdx, filtered.length - 1);
  if (selIdx < 0) selIdx = 0;

  const wrap = document.getElementById('results');
  if (filtered.length === 0) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);font-size:13px;">No matches. Try a different query.</div>';
    return;
  }
  wrap.innerHTML = filtered.map((p, i) =>
    '<a href="' + p.url + '" class="result' + (i === selIdx ? ' sel' : '') + '" data-i="' + i + '">'
    + '<div><div class="name">' + p.name + '</div><div class="desc">' + p.desc + '</div></div>'
    + '<div>' + (p.badge ? '<span class="badge">' + p.badge + '</span>' : '') + '</div>'
    + '</a>'
  ).join('');
}

document.getElementById('q').addEventListener('input', () => { selIdx = 0; render(); });
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); selIdx = Math.min(filtered.length - 1, selIdx + 1); render(); }
  if (e.key === 'ArrowUp')   { e.preventDefault(); selIdx = Math.max(0, selIdx - 1); render(); }
  if (e.key === 'Enter')     { if (filtered[selIdx]) window.location.href = filtered[selIdx].url; }
});

document.querySelectorAll('.tag-chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.tag-chip').forEach(x => x.classList.remove('on'));
  c.classList.add('on');
  activeCat = c.dataset.cat;
  selIdx = 0;
  render();
}));

render();
