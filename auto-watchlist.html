<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto-Watchlist — bpleone</title>
<meta name="description" content="Symbols the brain has alerted on. Promote winners, dismiss noise, build a curated tier-1 watchlist.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v194">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.tile { padding:18px;background:var(--bg-elevated);border-radius:10px; }
.tile .lbl { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:700; }
.tile .val { font-family:var(--font-mono);font-size:22px;font-weight:800;margin-top:6px;color:var(--accent); }
.tab-row { display:flex;gap:4px;margin-bottom:18px;border-bottom:2px solid var(--bg-elevated); }
.tab-row button { background:none;border:none;color:var(--text-muted);padding:10px 18px;font-weight:700;cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-2px; }
.tab-row button.active { color:var(--accent);border-bottom-color:var(--accent); }
.entry-card { padding:14px 18px;background:var(--bg-elevated);border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-left:4px solid transparent; }
.entry-card.watching { border-left-color:var(--accent); }
.entry-card.promoted { border-left-color:var(--green);background:rgba(16,185,129,0.05); }
.entry-card.dismissed { border-left-color:rgba(120,140,160,0.5);opacity:0.6; }
.entry-card .left { display:flex;align-items:center;gap:14px;flex-wrap:wrap; }
.entry-card .sym { font-family:var(--font-mono);font-size:22px;font-weight:900; }
.entry-card .meta { font-size:11px;color:var(--text-muted);font-family:var(--font-mono); }
.entry-card .actions { display:flex;gap:6px; }
.entry-card .actions button { padding:6px 12px;border:none;border-radius:5px;font-weight:700;cursor:pointer;font-size:11px; }
.btn-promote { background:rgba(16,185,129,0.18);color:var(--green); }
.btn-dismiss { background:rgba(220,38,38,0.18);color:var(--red); }
.btn-revive { background:rgba(0,212,255,0.18);color:var(--accent); }
.btn-del { background:rgba(120,140,160,0.12);color:var(--text-muted); }
.pill-dir { padding:2px 8px;border-radius:5px;font-size:10px;font-weight:800; }
.pill-LONG { background:rgba(16,185,129,0.18);color:var(--green); }
.pill-SHORT { background:rgba(220,38,38,0.18);color:var(--red); }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">⭐ Auto-Watchlist</div>
      <div class="page-subtitle">Symbols the brain has alerted on. Promote your winners to a curated tier-1 list. Dismiss noise.</div>
    </div>
  </div>

  <div class="grid grid-4 mb-24" id="kpi-grid"></div>

  <div class="tab-row" id="tabs">
    <button data-t="all" class="active">All</button>
    <button data-t="watching">Watching</button>
    <button data-t="promoted">⭐ Promoted</button>
    <button data-t="dismissed">Dismissed</button>
  </div>

  <div id="entries-list"></div>

  <div class="card mt-24">
    <div class="card-header"><div class="card-title">🔗 Related</div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <a href="high-conviction-alerts.html" style="text-decoration:none;display:inline-block;background:linear-gradient(135deg,#a884ff,#7c3aed);color:#fff;padding:10px 18px;border-radius:8px;font-weight:700;">🔔 Alerts feed</a>
      <a href="watchlists.html" style="text-decoration:none;display:inline-block;background:rgba(120,140,160,0.12);color:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;">📋 All watchlists</a>
      <a href="auto-trade.html" style="text-decoration:none;display:inline-block;background:rgba(120,140,160,0.12);color:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;">🤖 Auto-Trade</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v194"></script>
<script src="js/ai-client.js?v=v194"></script>
<script src="js/app.js?v=v194"></script>
<script src="js/notify.js?v=v194"></script>
<script src="js/live.js?v=v194"></script>
<script src="js/auto-watchlist.js?v=v194"></script>
<script>buildNav('auto-watchlist');</script>
<script>
let currentTab = 'all';
function fmtAgo(t) { if (!t) return '—'; const ms = Date.now() - t; if (ms < 60000) return Math.round(ms/1000) + 's'; if (ms < 3600000) return Math.round(ms/60000) + 'm'; if (ms < 86400000) return Math.round(ms/3600000) + 'h'; return Math.round(ms/86400000) + 'd'; }

function render() {
  if (!window.AutoWatchlist) { setTimeout(render, 500); return; }
  // Tick once on first render
  if (!window._awWasTicked) { window._awWasTicked = true; try { window.AutoWatchlist.tick(); } catch (e) {} }
  const all = window.AutoWatchlist.list();
  const counts = { all: all.length, watching: 0, promoted: 0, dismissed: 0 };
  all.forEach(e => { counts[e.status] = (counts[e.status] || 0) + 1; });
  document.getElementById('kpi-grid').innerHTML =
    '<div class="tile"><div class="lbl">Total</div><div class="val">' + counts.all + '</div></div>' +
    '<div class="tile"><div class="lbl">Watching</div><div class="val">' + counts.watching + '</div></div>' +
    '<div class="tile" style="background:rgba(16,185,129,0.06);"><div class="lbl">⭐ Promoted</div><div class="val" style="color:var(--green);">' + counts.promoted + '</div></div>' +
    '<div class="tile"><div class="lbl">Dismissed</div><div class="val" style="color:var(--text-muted);">' + counts.dismissed + '</div></div>';
  const filtered = currentTab === 'all' ? all : all.filter(e => e.status === currentTab);
  const list = document.getElementById('entries-list');
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:32px;">No entries in this view. Auto-Watchlist populates as the brain fires high-conviction alerts.</div>';
    return;
  }
  list.innerHTML = filtered.map(e => {
    let actions = '';
    if (e.status === 'watching') {
      actions = '<button onclick="promote(\'' + e.sym + '\')" class="btn-promote">⭐ Promote</button>' +
        '<button onclick="dismiss(\'' + e.sym + '\')" class="btn-dismiss">🔇 Dismiss</button>';
    } else if (e.status === 'promoted') {
      actions = '<button onclick="dismiss(\'' + e.sym + '\')" class="btn-dismiss">🔇 Dismiss</button>';
    } else if (e.status === 'dismissed') {
      actions = '<button onclick="revive(\'' + e.sym + '\')" class="btn-revive">↩ Revive</button>';
    }
    actions += '<button onclick="del(\'' + e.sym + '\')" class="btn-del">🗑</button>';
    return '<div class="entry-card ' + e.status + '">' +
      '<div class="left">' +
        '<div class="sym">' + e.sym + '</div>' +
        '<div class="meta">First alert: <strong>' + fmtAgo(e.firstAlertTs) + ' ago</strong> · Last: ' + fmtAgo(e.lastAlertTs) + ' ago · <strong>' + e.alertCount + '</strong> alerts</div>' +
        '<span class="pill-dir pill-' + e.lastDirection + '">' + e.lastDirection + ' ' + Math.round((e.lastConviction || 0) * 100) + '%</span>' +
      '</div>' +
      '<div class="actions">' + actions + '</div>' +
    '</div>';
  }).join('');
}
function promote(s) { window.AutoWatchlist.promote(s); render(); }
function dismiss(s) { window.AutoWatchlist.dismiss(s); render(); }
function revive(s) { window.AutoWatchlist.revive(s); render(); }
function del(s) { if (!confirm('Remove ' + s + ' completely? Future alerts will re-add it.')) return; window.AutoWatchlist.remove(s); render(); }
document.querySelectorAll('#tabs button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentTab = b.getAttribute('data-t');
    render();
  });
});
setTimeout(render, 500);
setInterval(render, 7000);
</script>
</body>
</html>
