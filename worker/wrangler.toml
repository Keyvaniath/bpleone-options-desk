name = "bpleone-brain-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# Pass 186: explicit workers_dev=true so wrangler doesn't emit a warning
# that PowerShell's strict-mode treats as a fatal error.
workers_dev = true

# Cron trigger — fires every minute. The handler decides what to do.
[triggers]
crons = ["* * * * *"]

# KV namespace for brain state (journal, model, calibrators).
# Create with: wrangler kv:namespace create BRAIN_KV
# Then put the returned ID below.
[[kv_namespaces]]
binding = "BRAIN_KV"
id = "d29cc2f5e49e44599df0f5750e88f9ff"

# Secrets — set with `wrangler secret put FINNHUB_API_KEY`
# DO NOT put the actual key here.

# Free plan: 100k requests/day, 10ms CPU per request. More than enough
# for 60 cron ticks/hour × 24h = 1,440 ticks/day + ~10k browser reads.

[observability]
enabled = true
