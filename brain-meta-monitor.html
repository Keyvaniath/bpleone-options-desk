<script>buildNav('brain-meta-monitor');</script>
<script>
let chart = null;
function loadResolved() {
  try {
    const j = JSON.parse(localStorage.getItem('bpleone_pred_journal_v1') || '[]');
    return j.filter(e => e.outcome && (e.outcome === 'correct' || e.outcome === 'wrong'));
  } catch (e) { return []; }
}
function weeklyTrend() {
  const entries = loadResolved();
  if (entries.length === 0) return [];
  // Group by ISO week
  const buckets = {};
  for (const e of entries) {
    const d = new Date(e.ts);
    const year = d.getFullYear();
    const startOfYear = new Date(year, 0, 1);
    const days = Math.floor((d - startOfYear) / 86400000);
    const week = Math.floor(days / 7);
    const k = year + '-W' + (week < 10 ? '0' + week : week);
    if (!buckets[k]) buckets[k] = { wins: 0, total: 0, ts: d.getTime() };
    buckets[k].total++;
    if (e.outcome === 'correct') buckets[k].wins++;
  }
  return Object.entries(buckets).map(([k, b]) => ({ week: k, wins: b.wins, total: b.total, wr: b.wins / b.total, ts: b.ts })).sort((a, b) => a.ts - b.ts);
}

function render() {
  const trend = weeklyTrend();
  // KPIs
  const all = loadResolved();
  const totalWins = all.filter(e => e.outcome === 'correct').length;
  const totalLosses = all.filter(e => e.outcome === 'wrong').length;
  const overallWR = (totalWins + totalLosses) > 0 ? totalWins / (totalWins + totalLosses) : null;
  // Recent vs historical
  const recent20 = all.slice(-20);
  const recentWR = recent20.filter(e => e.outcome === 'correct').length / Math.max(1, recent20.length);
  const older20 = all.slice(-40, -20);
  const olderWR = older20.length > 0 ? older20.filter(e => e.outcome === 'correct').length / older20.length : null;
  let verdict = 'steady', verdictText = 'STEADY', verdictMsg = 'Brain hit rate is stable over time.';
  if (olderWR != null && recentWR != null) {
    const delta = recentWR - olderWR;
    if (delta > 0.05) { verdict = 'improving'; verdictText = '📈 IMPROVING'; verdictMsg = 'Recent 20 trades win ' + (delta * 100).toFixed(0) + '% more than prior 20. Brain is learning.'; }
    else if (delta < -0.05) { verdict = 'degrading'; verdictText = '📉 DEGRADING'; verdictMsg = 'Recent 20 trades win ' + (Math.abs(delta) * 100).toFixed(0) + '% less than prior 20. Investigate.'; }
  } else if (all.length === 0) { verdictText = '⏳ NO DATA'; verdictMsg = 'Need resolved trades to assess.'; }
  const v = document.getElementById('verdict');
  v.className = 'verdict ' + verdict;
  v.innerHTML = '<div class="big">' + verdictText + '</div><div style="color:var(--text-secondary);font-size:14px;margin-top:10px;">' + verdictMsg + '</div>';
  document.getElementById('kpi-grid').innerHTML =
    '<div class="tile"><div class="lbl">Total resolved</div><div class="val">' + all.length + '</div></div>' +
    '<div class="tile"><div class="lbl">Overall WR</div><div class="val">' + (overallWR != null ? (overallWR * 100).toFixed(0) + '%' : '—') + '</div></div>' +
    '<div class="tile"><div class="lbl">Recent 20 WR</div><div class="val">' + (recent20.length > 0 ? (recentWR * 100).toFixed(0) + '%' : '—') + '</div></div>' +
    '<div class="tile"><div class="lbl">Prior 20 WR</div><div class="val">' + (olderWR != null ? (olderWR * 100).toFixed(0) + '%' : '—') + '</div></div>';
  // Chart
  if (trend.length > 0 && typeof Chart !== 'undefined') {
    const labels = trend.map(t => t.week);
    const wrs = trend.map(t => +(t.wr * 100).toFixed(1));
    if (chart) chart.destroy();
    chart = new Chart(document.getElementById('chart'), {
      type: 'line',
      data: { labels, datasets: [{ label: 'Win rate %', data: wrs, borderColor: '#00d4ff', backgroundColor: 'rgba(0,212,255,0.12)', fill: true, tension: 0.3, borderWidth: 2.5, pointRadius: 4, pointBackgroundColor: wrs.map(w => w >= 50 ? '#10b981' : '#dc2626') }] },
      options: { responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { min: 0, max: 100, ticks: { color: 'rgba(255,255,255,0.5)', callback: v => v + '%' } }, x: { ticks: { color: 'rgba(255,255,255,0.5)' } } } }
    });
  }
  // Compare
  const compare = [];
  if (overallWR != null && recentWR != null) compare.push('Overall WR: <strong>' + (overallWR * 100).toFixed(0) + '%</strong>');
  if (recentWR != null) compare.push('Recent 20: <strong>' + (recentWR * 100).toFixed(0) + '%</strong>');
  if (olderWR != null) compare.push('Prior 20: <strong>' + (olderWR * 100).toFixed(0) + '%</strong>');
  if (trend.length >= 2) compare.push('Weeks tracked: <strong>' + trend.length + '</strong>');
  document.getElementById('compare-list').innerHTML = compare.length ? compare.map(c => '<div>' + c + '</div>').join('') : '<div style="color:var(--text-muted);">No data yet.</div>';
}
setTimeout(render, 500);
setInterval(render, 12000);
</script>
