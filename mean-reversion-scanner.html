.mr-row { display:grid; grid-template-columns: 30px 70px 80px 80px 80px 80px 90px 70px 1fr; gap:8px; padding:11px 12px; border-bottom:1px solid var(--border); font-family:var(--font-mono); font-size:11px; align-items:center; cursor:pointer; }
.mr-row:hover { background:var(--bg-elevated); }
.mr-row.long { border-left:3px solid var(--green); }
.mr-row.short { border-left:3px solid var(--red); }

<body data-needs="live">
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🔄 Mean Reversion Scanner</div>
      <div class="page-subtitle">RSI + Z-score + ATR distance from 20-MA · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8"><button class="btn btn-secondary" id="refreshBtn">🔄</button></div>
  </div>

  <div class="grid grid-4 mb-24">
    <div class="card"><div class="card-header"><div class="card-title">Oversold Bounce Setups</div></div><div class="mono green-text" style="font-size:26px;font-weight:700;" id="kpiBounce">--</div></div>
    <div class="card"><div class="card-header"><div class="card-title">Overbought Fades</div></div><div class="mono red-text" style="font-size:26px;font-weight:700;" id="kpiFade">--</div></div>
    <div class="card"><div class="card-header"><div class="card-title">Most Stretched</div></div><div class="mono" style="font-size:18px;font-weight:700;color:var(--yellow);" id="kpiTop">--</div><div class="mono" style="font-size:11px;color:var(--text-muted);" id="kpiTopBody">--</div></div>
    <div class="card"><div class="card-header"><div class="card-title">Avg Z-Score</div></div><div class="mono" style="font-size:26px;font-weight:700;" id="kpiAvg">--</div></div>
  </div>

  <div class="card mb-12" style="padding:10px 14px;">
    <div class="flex gap-8">
      <button class="btn btn-ghost btn-active" data-flt="all" style="padding:4px 10px;font-size:11px;">ALL</button>
      <button class="btn btn-ghost" data-flt="long" style="padding:4px 10px;font-size:11px;">LONG (oversold)</button>
      <button class="btn btn-ghost" data-flt="short" style="padding:4px 10px;font-size:11px;">SHORT (overbought)</button>
    </div>
  </div>

  <div class="card" style="padding:0;">
    <div class="mr-row" style="background:var(--bg-elevated);font-size:9px;color:var(--text-muted);font-weight:800;letter-spacing:0.5px;">
      <div>#</div><div>SYM</div><div>NOW</div><div>20-MA</div><div>Z-SCORE</div><div>ATR DIST</div><div>RSI(14)</div><div>BIAS</div><div>STOP / TARGET</div>
    </div>
    <div id="mrBody"></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v223"></script>
<script src="js/ai-client.js?v=v223"></script>
<script src="js/app.js?v=v223"></script>
<script src="js/notify.js?v=v223"></script>
<script src="js/live.js?v=v223"></script>
<script>
buildNav('mean-reversion-scanner');

// Worker-tracked symbols only - every one has /brain/bars history (the prior
// small-cap list had no bars and would render as silently-missing rows).
const UNIVERSE = ['SPY','QQQ','IWM','DIA','AAPL','NVDA','TSLA','MSFT','META','AMZN','GOOGL','AMD','AVGO','MU','NFLX','ORCL','CRM','SMCI','PLTR','COIN','MARA','RIVN','UBER','SHOP','BABA','JPM','BAC','GS','GLD','USO','XLE','XLF','XLK','XLV','XLY','XLI'];

const WORKER = (window.WorkerBridge && WorkerBridge.getUrl && WorkerBridge.getUrl()) || 'https://bpleone-brain-worker.brandonpleone.workers.dev';

// Real indicators from daily OHLC - no fabrication.
function smaLast(a, n) { if (a.length < n) return null; const s = a.slice(-n); return s.reduce((x, y) => x + y, 0) / n; }
function stdevLast(a, n) { if (a.length < n) return null; const s = a.slice(-n); const m = s.reduce((x, y) => x + y, 0) / n; return Math.sqrt(s.reduce((x, y) => x + (y - m) ** 2, 0) / n); }
function atrWilder(bars, n) {
  if (bars.length < n + 1) return null;
  let atr = 0;
  for (let i = 1; i <= n; i++) { const h = bars[i].h, l = bars[i].l, pc = bars[i - 1].c; atr += Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)); }
  atr /= n;
  for (let i = n + 1; i < bars.length; i++) { const h = bars[i].h, l = bars[i].l, pc = bars[i - 1].c; const t = Math.max(h - l, Math.abs(h - pc), Math.abs(l - pc)); atr = (atr * (n - 1) + t) / n; }
  return atr;
}
function rsiWilder(closes, n) {
  if (closes.length < n + 1) return null;
  let ag = 0, al = 0;
  for (let i = 1; i <= n; i++) { const d = closes[i] - closes[i - 1]; if (d > 0) ag += d; else al -= d; }
  ag /= n; al /= n;
  for (let i = n + 1; i < closes.length; i++) { const d = closes[i] - closes[i - 1]; ag = (ag * (n - 1) + (d > 0 ? d : 0)) / n; al = (al * (n - 1) + (d < 0 ? -d : 0)) / n; }
  if (al === 0) return 100;
  return 100 - 100 / (1 + ag / al);
}

let data = [];
let flt = 'all';
let loading = true;

async function loadData() {
  const res = await fetch(WORKER + '/brain/bars?syms=' + encodeURIComponent(UNIVERSE.join(',')) + '&days=40', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null);
  const allBars = (res && res.bars) || {};
  data = UNIVERSE.map(sym => {
    const bars = (allBars[sym] || []).filter(b => b && b.c > 0 && b.ts).sort((a, b) => a.ts - b.ts);
    if (bars.length < 21) return null;
    const closes = bars.map(b => b.c);
    const px = closes[closes.length - 1];
    const ma20 = smaLast(closes, 20), sd20 = stdevLast(closes, 20), atr = atrWilder(bars, 14), rsiV = rsiWilder(closes, 14);
    if (ma20 == null || !(sd20 > 0) || !(atr > 0)) return null;
    const z = +((px - ma20) / sd20).toFixed(2);
    const distance = +((px - ma20) / atr).toFixed(2);
    return { sym, px, ma20: +ma20.toFixed(2), atr, distance, z, rsi: rsiV != null ? Math.round(rsiV) : null };
  }).filter(Boolean);
  loading = false;
  paint();
}

function paint() {
  const body = document.getElementById('mrBody');
  if (loading) { body.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:12px;">Loading daily bars…</div>'; return; }
  if (!data.length) {
    body.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:12px;">Daily OHLC bars not available yet - the worker <a href="worker-setup.html" style="color:var(--accent);">/brain/bars</a> feed is not deployed. Z-score, RSI and the 20-day mean compute from real bars once it is live.</div>';
    ['kpiBounce', 'kpiFade', 'kpiTop', 'kpiAvg'].forEach(id => { const e = document.getElementById(id); if (e) e.textContent = '—'; });
    const tb = document.getElementById('kpiTopBody'); if (tb) tb.textContent = '';
    return;
  }
  let rows = data.slice().filter(d => Math.abs(d.z) >= 1.5).sort((a, b) => Math.abs(b.z) - Math.abs(a.z));
  if (flt === 'long') rows = rows.filter(d => d.z < 0);
  else if (flt === 'short') rows = rows.filter(d => d.z > 0);

  body.innerHTML = '';
  rows.slice(0, 24).forEach((r, i) => {
    const long = r.z < 0;
    const cls = long ? 'long' : 'short';
    const biasCol = long ? 'var(--green)' : 'var(--red)';
    const bias = long ? 'LONG' : 'SHORT';
    const stop = long ? +(r.px - r.atr).toFixed(2) : +(r.px + r.atr).toFixed(2);
    const target = +r.ma20.toFixed(2);
    const row = document.createElement('div');
    row.className = 'mr-row ' + cls;
    row.innerHTML = '<div>' + (i + 1) + '</div>'
      + '<div><strong>' + r.sym + '</strong></div>'
      + '<div>$' + r.px.toFixed(2) + '</div>'
      + '<div>$' + r.ma20.toFixed(2) + '</div>'
      + '<div style="color:' + (Math.abs(r.z) > 2.5 ? 'var(--yellow)' : 'var(--accent)') + ';font-weight:700;">' + (r.z >= 0 ? '+' : '') + r.z + 'σ</div>'
      + '<div>' + (r.distance >= 0 ? '+' : '') + r.distance + ' ATR</div>'
      + '<div style="color:' + (r.rsi == null ? 'var(--text-muted)' : r.rsi < 30 ? 'var(--green)' : r.rsi > 70 ? 'var(--red)' : 'var(--text-muted)') + ';">' + (r.rsi != null ? r.rsi : '—') + '</div>'
      + '<div style="color:' + biasCol + ';font-weight:700;">' + bias + '</div>'
      + '<div style="color:var(--text-muted);font-family:Inter;font-size:11px;">Stop $' + stop + ' → T $' + target + '</div>';
    row.onclick = () => { window.location.href = 'trade-coach.html?sym=' + r.sym; };
    body.appendChild(row);
  });

  document.getElementById('kpiBounce').textContent = data.filter(d => d.z < -1.5).length;
  document.getElementById('kpiFade').textContent = data.filter(d => d.z > 1.5).length;
  const top = data.slice().sort((a, b) => Math.abs(b.z) - Math.abs(a.z))[0];
  if (top) { document.getElementById('kpiTop').textContent = top.sym; document.getElementById('kpiTopBody').textContent = (top.z >= 0 ? '+' : '') + top.z + 'σ'; }
  document.getElementById('kpiAvg').textContent = data.length ? (data.reduce((s, d) => s + Math.abs(d.z), 0) / data.length).toFixed(2) : '—';
}
paint();
loadData();
document.querySelectorAll('[data-flt]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-flt]').forEach(x => x.classList.remove('btn-active'));
  b.classList.add('btn-active');
  flt = b.dataset.flt;
  paint();
}));
document.getElementById('refreshBtn').addEventListener('click', () => { loading = true; paint(); loadData(); });
setInterval(loadData, 60000);
</script>
</body>
</html>
