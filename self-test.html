.test-row { padding:10px 14px;border-radius:8px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;font-family:var(--font-mono);font-size:12px;gap:14px; }
.test-row.pass { background:rgba(16,185,129,0.06);border-left:3px solid var(--green); }
.test-row.fail { background:rgba(220,38,38,0.10);border-left:3px solid var(--red); }
.test-row.warn { background:rgba(245,158,11,0.08);border-left:3px solid var(--yellow); }
.test-row.skip { background:rgba(120,140,160,0.06);border-left:3px solid rgba(120,140,160,0.4); opacity:0.7; }
.test-row .name { font-weight:700;flex:1; }
.test-row .detail { color:var(--text-muted);font-size:11px;text-align:right;max-width:50%; }
.tile { padding:18px;background:var(--bg-elevated);border-radius:10px; }
.tile .lbl { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:700; }
.tile .val { font-family:var(--font-mono);font-size:28px;font-weight:900;margin-top:6px; }
.tile.green .val { color:var(--green); }
.tile.red .val { color:var(--red); }
.tile.yellow .val { color:var(--yellow); }
.section-head { font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin:18px 0 8px;padding-left:8px; }
.run-btn { padding:14px 28px;border-radius:10px;border:none;font-weight:800;cursor:pointer;font-size:15px;background:linear-gradient(135deg,#00d4ff,#0094c7);color:#000;letter-spacing:0.5px; }

<script>
const tests = [];
function t(name, fn) { tests.push({ name, fn }); }

// ===== MODULE PRESENCE =====
t('window.QUOTES populated', () => {
  if (typeof QUOTES === 'undefined') throw 'QUOTES not defined';
  const n = Object.keys(QUOTES).length;
  if (n < 30) throw `Only ${n} symbols (expected 50+)`;
  return `${n} symbols`;
});
t('window.DataProvider', () => {
  if (typeof DataProvider === 'undefined') throw 'DataProvider not defined';
  if (typeof DataProvider.init !== 'function') throw 'init() missing';
  return 'init/connect/saveConfig available';
});
t('window.DataReliability', () => {
  if (!window.DataReliability) throw 'undefined';
  if (typeof DataReliability.validate !== 'function') throw 'validate() missing';
  const r = DataReliability.validate('TEST', 100, 'unit-test', Date.now());
  if (!r || typeof r.ok === 'undefined') throw 'validate() bad return';
  return 'validate/recordFetch/symbolHealth';
});
t('window.SourcePreference', () => {
  if (!window.SourcePreference) throw 'undefined';
  const r = SourcePreference.rank('finnhub');
  if (typeof r !== 'number') throw 'rank() not number';
  if (r < 0 || r > 1) throw `rank out of [0,1]: ${r}`;
  return `finnhub rank=${(r * 100).toFixed(0)}%`;
});
t('window.MoneyTracker', () => {
  if (!window.MoneyTracker) throw 'undefined';
  const s = MoneyTracker.summary();
  if (typeof s !== 'object') throw 'summary() bad';
  return s.empty ? 'empty journal (expected)' : `${s.resolvedShortCount} resolved`;
});
t('window.ConfidenceKelly', () => {
  if (!window.ConfidenceKelly) throw 'undefined';
  const r = ConfidenceKelly.size({ prob: 0.75, winR: 0.025, lossR: 0.01, bankroll: 10000, entryPx: 100 });
  if (!r) throw 'size() returned null';
  if (r.adjKelly < 0 || r.adjKelly > 0.05) throw `adjKelly out of bounds: ${r.adjKelly}`;
  return `0.75 conv -> ${(r.adjKelly * 100).toFixed(2)}% Kelly`;
});
t('window.PortfolioAllocator', () => {
  if (!window.PortfolioAllocator) throw 'undefined';
  if (typeof PortfolioAllocator.allocate !== 'function') throw 'allocate() missing';
  return 'allocate/correlate available';
});
t('window.AutoTrade', () => {
  if (!window.AutoTrade) throw 'undefined';
  const cfg = AutoTrade.getConfig();
  if (!cfg.bankroll) throw 'config has no bankroll';
  return `bankroll=$${cfg.bankroll} conv≥${cfg.minConviction}`;
});
t('window.HighConvictionAlerts', () => {
  if (!window.HighConvictionAlerts) throw 'undefined';
  const f = HighConvictionAlerts.feed(5);
  return Array.isArray(f) ? `feed=${f.length}` : 'feed not array';
});
t('window.BrainVsSpy', () => {
  if (!window.BrainVsSpy) throw 'undefined';
  return 'compare/alpha available';
});
t('window.RiskMonteCarlo', () => {
  if (!window.RiskMonteCarlo) throw 'undefined';
  const r = RiskMonteCarlo.run({ sims: 100, tradesPerSim: 50 });
  if (!r || typeof r.pRuin !== 'number') throw 'run() returned bad shape';
  return `100 sims: P(Ruin)=${(r.pRuin * 100).toFixed(1)}%`;
});
t('window.PatternRecall', () => {
  if (!window.PatternRecall) throw 'undefined';
  return 'findSimilar/summarize available';
});
t('window.StreakTracker', () => {
  if (!window.StreakTracker) throw 'undefined';
  const s = StreakTracker.snapshot();
  return s.empty ? 'empty (expected)' : `streak=${s.currentStreak}`;
});
t('window.EarningsAwareness', () => {
  if (!window.EarningsAwareness) throw 'undefined';
  const e = EarningsAwareness.nextEarnings('NVDA');
  if (!e || !e.date) throw 'NVDA earnings unknown';
  return `NVDA next ~${e.daysOut.toFixed(0)}d`;
});
t('window.LossCooloff', () => {
  if (!window.LossCooloff) throw 'undefined';
  const s = LossCooloff.status();
  return `${s.currentConsec} consec losses (trigger ${s.triggerAt})`;
});
t('window.EquityProtector', () => {
  if (!window.EquityProtector) throw 'undefined';
  return 'tick/status available';
});
t('window.PreTradeChecklist', () => {
  if (!window.PreTradeChecklist) throw 'undefined';
  const r = PreTradeChecklist.evaluate({ sym: 'TEST', predProb: 0.80 });
  if (!r || !Array.isArray(r.items)) throw 'evaluate() bad shape';
  return `${r.items.length} gates checked`;
});
t('window.CalibrationView', () => {
  if (!window.CalibrationView) throw 'undefined';
  return 'compute/brierScore/ece available';
});
t('window.TradeQuality', () => {
  if (!window.TradeQuality) throw 'undefined';
  return 'scoreTrade/summary available';
});
t('window.SeedDetector', () => {
  if (!window.SeedDetector) throw 'undefined';
  const sum = SeedDetector.summary();
  return `${sum.realtime + sum.delayed} live, ${sum.seed} seed, ${sum.total} total`;
});
t('window.DemoData', () => {
  if (!window.DemoData) throw 'undefined';
  return 'generate/clear/hasDemoData available';
});
t('window.VoiceCoach', () => {
  if (!window.VoiceCoach) throw 'undefined';
  return VoiceCoach.supported() ? 'speechSynthesis OK' : 'speechSynthesis NOT supported';
});
t('window.SoundSynth', () => {
  if (!window.SoundSynth) throw 'undefined';
  return 'playBeep/playLong/playShort available';
});
t('window.StateBackup', () => {
  if (!window.StateBackup) throw 'undefined';
  const list = StateBackup.keyList();
  return `${list.length} bpleone_ keys in localStorage`;
});

// ===== INTEGRATION TESTS =====
t('DataReliability rejects negative price', () => {
  const r = DataReliability.validate('TEST', -5, 'unit-test', Date.now());
  if (r.ok) throw 'rejected negative as ok!';
  return 'reject reason: ' + r.reason;
});
t('DataReliability rejects huge price jump', () => {
  DataReliability.validate('JUMPTEST', 100, 'unit-test', Date.now());
  const r = DataReliability.validate('JUMPTEST', 150, 'unit-test', Date.now()); // 50% jump
  if (r.ok) throw 'allowed 50% jump';
  return 'reject reason: ' + r.reason;
});
t('SourcePreference: finnhub > stooq', () => {
  const fnh = SourcePreference.rank('finnhub');
  const stq = SourcePreference.rank('stooq');
  if (fnh <= stq) throw `finnhub=${fnh} stooq=${stq}`;
  return `${(fnh*100).toFixed(0)}% > ${(stq*100).toFixed(0)}%`;
});
t('ConfidenceKelly: higher conviction -> more size', () => {
  const a = ConfidenceKelly.size({ prob: 0.55, winR: 0.025, lossR: 0.01, bankroll: 10000, entryPx: 100 });
  const b = ConfidenceKelly.size({ prob: 0.85, winR: 0.025, lossR: 0.01, bankroll: 10000, entryPx: 100 });
  if (b.adjKelly <= a.adjKelly) throw `0.85 (${b.adjKelly}) not > 0.55 (${a.adjKelly})`;
  return `0.55=>${(a.adjKelly*100).toFixed(2)}% < 0.85=>${(b.adjKelly*100).toFixed(2)}%`;
});
t('RiskMonteCarlo: bigger risk -> higher ruin', () => {
  const safe = RiskMonteCarlo.run({ sims: 100, tradesPerSim: 100, riskPct: 0.01, winRate: 0.55 });
  const reckless = RiskMonteCarlo.run({ sims: 100, tradesPerSim: 100, riskPct: 0.20, winRate: 0.55 });
  if (reckless.pRuin <= safe.pRuin) throw `safe=${safe.pRuin} reckless=${reckless.pRuin}`;
  return `1% risk=${(safe.pRuin*100).toFixed(0)}% < 20%=${(reckless.pRuin*100).toFixed(0)}%`;
});
t('PreTradeChecklist: high-conv signal passes most gates', () => {
  const r = PreTradeChecklist.evaluate({ sym: 'NVDA', predProb: 0.85, features: new Array(22).fill(0.5) });
  if (r.passing < 5) throw `only ${r.passing}/${r.total} passing`;
  return `${r.passing}/${r.total} (${r.verdict})`;
});
t('DemoData generates valid feature vectors', () => {
  // Get journal
  const j = JSON.parse(localStorage.getItem('bpleone_pred_journal_v1') || '[]');
  if (j.length === 0) return 'no journal — try generating demo first';
  const sample = j[j.length - 1];
  if (!sample.features) return 'last entry has no features';
  if (sample.features.length !== 22) throw `features.length=${sample.features.length} (expected 22)`;
  return `last entry has 22-dim features`;
});

// ===== DATA FLOW =====
t('QUOTES.SPY exists', () => {
  if (!QUOTES.SPY) throw 'SPY missing';
  if (!QUOTES.SPY.last) throw 'SPY.last not set';
  return `SPY=$${QUOTES.SPY.last.toFixed(2)} src=${QUOTES.SPY.priceSource || 'seed'}`;
});
t('QUOTES.BTC exists', () => {
  if (!QUOTES.BTC) throw 'BTC missing';
  return `BTC=$${QUOTES.BTC.last.toFixed(0)} src=${QUOTES.BTC.priceSource || 'seed'}`;
});
t('UUP now in QUOTES + STOOQ_MAP (audit-fix verification)', () => {
  if (!QUOTES.UUP) throw 'UUP not in QUOTES';
  if (typeof DataProvider.getStooqStatus !== 'function') throw 'getStooqStatus missing';
  return 'UUP present, Stooq polling enabled';
});
t('Journal age-trim retention', () => {
  const j = JSON.parse(localStorage.getItem('bpleone_pred_journal_v1') || '[]');
  if (j.length === 0) return 'empty journal — N/A';
  const oldest = Math.min(...j.map(e => e.ts || Date.now()));
  const days = (Date.now() - oldest) / 86400000;
  return `${j.length} entries, oldest ${days.toFixed(1)}d ago`;
});

// ===== RUNNER =====
function fmtErr(e) { return typeof e === 'string' ? e : (e && e.message) || String(e); }

async function runTests() {
  document.getElementById('results').innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);">⏳ Running ' + tests.length + ' tests…</div>';
  await new Promise(r => setTimeout(r, 100));
  const groups = {
    'Module presence': [],
    'Integration tests': [],
    'Data flow': []
  };
  const results = [];
  let pass = 0, fail = 0, warn = 0;
  for (let i = 0; i < tests.length; i++) {
    const t = tests[i];
    let status = 'pass', detail = '';
    try {
      const r = await t.fn();
      detail = r || 'ok';
    } catch (e) {
      status = 'fail';
      detail = fmtErr(e);
    }
    // Heuristic: 'NOT supported' = warn
    if (detail && detail.indexOf('NOT supported') !== -1) status = 'warn';
    if (detail && detail.indexOf('try generating demo first') !== -1) status = 'skip';
    if (status === 'pass') pass++;
    else if (status === 'fail') fail++;
    else if (status === 'warn') warn++;
    let grp = 'Module presence';
    if (i >= 25 && i < 32) grp = 'Integration tests';
    else if (i >= 32) grp = 'Data flow';
    groups[grp].push({ name: t.name, status, detail });
  }
  document.getElementById('kpi-run').textContent = tests.length;
  document.getElementById('kpi-pass').textContent = pass;
  document.getElementById('kpi-fail').textContent = fail;
  document.getElementById('kpi-warn').textContent = warn;
  let html = '';
  for (const grp in groups) {
    if (groups[grp].length === 0) continue;
    html += '<div class="section-head">' + grp + ' (' + groups[grp].length + ')</div>';
    for (const r of groups[grp]) {
      html += '<div class="test-row ' + r.status + '"><div class="name">' + r.name + '</div><div class="detail">' + (r.detail || '') + '</div></div>';
    }
  }
  document.getElementById('results').innerHTML = html;
}
setTimeout(runTests, 1500);
</script>
