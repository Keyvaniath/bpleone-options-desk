<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feature Store — bpleone / trade</title>
<meta name="description" content="Browse every labeled training row · raw feature vectors · export CSV.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v195">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.row-card { padding:12px 14px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; margin-bottom:8px; }
.row-card.hit { border-left:3px solid var(--green); }
.row-card.miss { border-left:3px solid var(--red); }
.feat-mini { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:6px; font-family:var(--font-mono); font-size:10px; margin-top:8px; }
.feat-mini .f { padding:4px 6px; background:var(--bg); border-radius:4px; display:flex; justify-content:space-between; }
.feat-mini .f .n { color:var(--text-muted); }
.feat-mini .f .v { color:var(--text-primary); font-weight:600; }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">📦 Feature Store</div>
      <div class="page-subtitle">Every labeled training row · raw feature vectors · CSV export · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-secondary" id="exportBtn">📥 Export CSV</button>
      <button class="btn btn-secondary" id="exportJSONBtn">📥 Export JSON</button>
      <button class="btn btn-secondary" id="clearBtn" style="color:var(--red);">🗑 Clear All</button>
    </div>
  </div>

  <div class="grid grid-4 mb-24">
    <div class="card"><div class="card-header"><div class="card-title">Total Rows</div></div><div class="mono" style="font-size:26px;font-weight:700;" id="kTotal">--</div></div>
    <div class="card"><div class="card-header"><div class="card-title">Hits (1)</div></div><div class="mono green-text" style="font-size:26px;font-weight:700;" id="kHit">--</div></div>
    <div class="card"><div class="card-header"><div class="card-title">Misses (0)</div></div><div class="mono red-text" style="font-size:26px;font-weight:700;" id="kMiss">--</div></div>
    <div class="card"><div class="card-header"><div class="card-title">Hit Rate</div></div><div class="mono" style="font-size:26px;font-weight:700;" id="kHR">--</div></div>
  </div>

  <div class="card mb-12" style="padding:10px 14px;">
    <div class="flex gap-8">
      <button class="btn btn-ghost btn-active" data-flt="all" style="padding:4px 10px;font-size:11px;">ALL</button>
      <button class="btn btn-ghost" data-flt="hit" style="padding:4px 10px;font-size:11px;">HITS</button>
      <button class="btn btn-ghost" data-flt="miss" style="padding:4px 10px;font-size:11px;">MISSES</button>
      <input type="text" id="symFlt" placeholder="Symbol filter..." style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:6px;padding:4px 10px;color:var(--text-primary);font-family:var(--font-mono);text-transform:uppercase;width:140px;margin-left:auto;">
    </div>
  </div>

  <div id="rowsBody"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v195"></script>
<script src="js/ai-client.js?v=v195"></script>
<script src="js/app.js?v=v195"></script>
<script src="js/notify.js?v=v195"></script>
<script src="js/live.js?v=v195"></script>
<script src="js/model.js?v=v195"></script>
<script>
buildNav('feature-store');

let flt = 'all';
let symFlt = '';

function paint() {
  const rows = ModelStore.getTrainingData();
  const hits = rows.filter(r => r.label === 1).length;
  const misses = rows.filter(r => r.label === 0).length;
  document.getElementById('kTotal').textContent = rows.length;
  document.getElementById('kHit').textContent = hits;
  document.getElementById('kMiss').textContent = misses;
  document.getElementById('kHR').textContent = rows.length > 0 ? Math.round((hits / rows.length) * 100) + '%' : '—';

  let filtered = rows;
  if (flt === 'hit') filtered = rows.filter(r => r.label === 1);
  else if (flt === 'miss') filtered = rows.filter(r => r.label === 0);
  if (symFlt) filtered = filtered.filter(r => r.meta && r.meta.sym === symFlt);

  const body = document.getElementById('rowsBody');
  body.innerHTML = '';
  if (filtered.length === 0) {
    body.innerHTML = '<div class="card" style="padding:30px;text-align:center;color:var(--text-muted);font-size:13px;">No training rows match filter. Brain needs to fire findings and rate outcomes to populate.</div>';
    return;
  }
  filtered.slice(0, 100).forEach(r => {
    const cls = r.label === 1 ? 'hit' : 'miss';
    const card = document.createElement('div');
    card.className = 'row-card ' + cls;
    const time = new Date(r.ts).toLocaleString();
    const sym = r.meta && r.meta.sym ? r.meta.sym : '?';
    const setup = r.meta && r.meta.setup ? r.meta.setup : '?';
    let featHtml = '<div class="feat-mini">';
    FEATURES.forEach((f, i) => {
      featHtml += '<div class="f"><span class="n">' + f + '</span><span class="v">' + (r.features[i] || 0).toFixed(3) + '</span></div>';
    });
    featHtml += '</div>';
    card.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">'
      + '<div><strong>' + sym + '</strong> · ' + setup + ' · <span style="color:var(--text-muted);font-size:11px;">' + time + '</span></div>'
      + '<div style="color:' + (r.label === 1 ? 'var(--green)' : 'var(--red)') + ';font-weight:700;font-size:13px;">' + (r.label === 1 ? '✓ HIT' : '✗ MISS') + '</div></div>'
      + featHtml;
    body.appendChild(card);
  });
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const rows = ModelStore.getTrainingData();
  const csv = ['ts,sym,setup,label,' + FEATURES.join(',')];
  rows.forEach(r => {
    csv.push([
      new Date(r.ts).toISOString(),
      (r.meta && r.meta.sym) || '',
      (r.meta && r.meta.setup) || '',
      r.label,
      r.features.join(',')
    ].join(','));
  });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv.join('\n')], { type: 'text/csv' }));
  a.download = 'bpleone-training-data-' + Date.now() + '.csv';
  a.click();
});

document.getElementById('exportJSONBtn').addEventListener('click', () => {
  const rows = ModelStore.getTrainingData();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ features: FEATURES, rows }, null, 2)], { type: 'application/json' }));
  a.download = 'bpleone-training-data-' + Date.now() + '.json';
  a.click();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Clear ALL training data? Cannot be undone. (Model weights are preserved.)')) return;
  ModelStore.clearTrainingData();
  paint();
});

document.querySelectorAll('[data-flt]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-flt]').forEach(x => x.classList.remove('btn-active'));
  b.classList.add('btn-active');
  flt = b.dataset.flt;
  paint();
}));
document.getElementById('symFlt').addEventListener('input', e => { symFlt = e.target.value.toUpperCase(); paint(); });
paint();
setInterval(paint, 15000);
</script>
</body>
</html>
