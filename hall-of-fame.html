<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall of Fame — bpleone / trade</title>
<meta name="description" content="Best calls + worst mistakes ever. Learn from your highlights AND your lowlights.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=v239">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.tab-row { display:flex;gap:10px;margin-bottom:18px; }
.tab { padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary); }
.tab.on { background:var(--accent);color:#000;border-color:var(--accent); }
.legend-card { padding:24px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;position:relative;overflow:hidden; }
.legend-card.win { border-left:5px solid var(--green);background:linear-gradient(135deg,rgba(16,185,129,0.06),var(--bg-elevated)); }
.legend-card.loss { border-left:5px solid var(--red);background:linear-gradient(135deg,rgba(239,68,68,0.06),var(--bg-elevated)); }
.legend-card .crown { position:absolute;top:12px;right:14px;font-size:24px; }
.legend-card .rank { font-family:var(--font-mono);font-size:32px;font-weight:800;color:var(--text-muted);min-width:60px; }
.legend-card .row { display:grid;grid-template-columns:60px 1fr 140px 100px;gap:18px;align-items:center; }
.legend-card h3 { font-size:18px;font-weight:700; }
.legend-card .meta { font-size:12px;color:var(--text-muted);margin-top:4px;line-height:1.6; }
.legend-card .pnl-big { font-family:var(--font-mono);font-size:32px;font-weight:800;text-align:right; }
.legend-card .meta-line { font-size:11px;color:var(--text-secondary);font-family:var(--font-mono);text-align:right;margin-top:4px; }
.summary-card { padding:18px;background:linear-gradient(135deg,rgba(0,212,255,0.05),transparent);border-radius:12px;margin-bottom:18px;font-size:14px;color:var(--text-primary);line-height:1.7; }
</style>
  <link rel="canonical" href="https://options.bpleone.com/hall-of-fame.html">
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🏆 Hall of Fame</div>
      <div class="page-subtitle">Best calls + worst mistakes ever · learn from both · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <select id="metric" class="btn btn-secondary" style="background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:8px 14px;">
        <option value="pnl">Sort: $ (journal) / % (model)</option>
        <option value="r" selected>Sort: R multiple</option>
        <option value="ml">Sort: Model confidence at capture</option>
      </select>
    </div>
  </div>

  <div class="tab-row">
    <div class="tab on" data-tab="best">🏅 Top 10 best calls</div>
    <div class="tab" data-tab="worst">🤕 Top 10 worst mistakes</div>
    <div class="tab" data-tab="overconf">⚠ Most overconfident misses</div>
    <div class="tab" data-tab="underconf">🌟 Right at low confidence</div>
  </div>

  <div id="summary"></div>
  <div id="legends"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v239"></script>
<script src="js/ai-client.js?v=v239"></script>
<script src="js/app.js?v=v239"></script>
<script src="js/notify.js?v=v239"></script>
<script src="js/live.js?v=v239"></script>
<script src="js/train-rows.js?v=v239"></script>
<script src="js/model.js?v=v239"></script>
<script>
buildNav('hall-of-fame');

let activeTab = 'best';

function loadJournal() { try { return JSON.parse(localStorage.getItem('bpleone_journal_pro_v1') || '[]'); } catch(e) { return []; } }
function loadTrain() { return window.TrainRows ? TrainRows.load() : []; }   // pass 344: graded calls (js/train-rows.js); 'bpleone_train_v1' was never written

// Pass 344: model rows come from js/train-rows.js (the old key was never written). They are graded CALLS, not trades:
// shown in % (realized 5-day move in the called direction), never as dollars, and with no assumed +1.5R / -1R payoff.
function getAllTrades() {
  const journal = loadJournal().filter(t => t.exit != null).map(t => ({
    sym: t.sym, ts: t.ts, pnl: t.pnl, entry: t.entry, exit: t.exit, qty: t.qty,
    isWin: t.pnl > 0,
    r: t.entry && t.stop && t.entry !== t.stop ? (t.pnl > 0 ? 1 : -1) * Math.abs(t.exit - t.entry) / Math.abs(t.entry - t.stop) : null,
    pnlPct: null, mlProb: null,
    source: 'journal'
  }));
  const train = loadTrain().map(t => ({
    sym: t.meta?.sym, ts: t.ts, pnl: null, r: null,
    pnlPct: typeof t.pnl === 'number' ? t.pnl : null,
    isWin: t.y === 1,
    mlProb: typeof t.predProb === 'number' ? Math.max(t.predProb, 1 - t.predProb) : null,
    source: 'model', meta: t.meta
  }));
  return [...journal, ...train];
}

// Real journal trades first (in $ or R), then the model's graded calls (in %); each group sorted by the metric.
function sortVal(t, metric) {
  if (metric === 'ml') return t.mlProb;
  if (t.source === 'journal') return metric === 'r' ? t.r : t.pnl;
  return t.pnlPct;
}
function sortRows(rows, metric, desc) {
  return rows.sort((a, b) => {
    if (a.source !== b.source) return a.source === 'journal' ? -1 : 1;
    const va = sortVal(a, metric), vb = sortVal(b, metric);
    if (va == null && vb == null) return b.ts - a.ts;
    if (va == null) return 1;
    if (vb == null) return -1;
    return desc ? vb - va : va - vb;
  });
}

function render() {
  const metric = document.getElementById('metric').value;
  const trades = getAllTrades();

  let filtered, summaryTxt;
  if (activeTab === 'best') {
    filtered = sortRows(trades.filter(t => t.isWin), metric, true);
    summaryTxt = '<strong>The calls that worked best:</strong> your closed journal trades, then the browser model\'s graded calls. A few good calls are not a pattern; check the sample before reading anything into them.';
  } else if (activeTab === 'worst') {
    filtered = sortRows(trades.filter(t => !t.isWin), metric, metric === 'ml');
    summaryTxt = '<strong>The calls that cost the most:</strong> closed journal trades, then the model\'s wrong calls.';
  } else if (activeTab === 'overconf') {
    filtered = trades.filter(t => !t.isWin && t.mlProb != null && t.mlProb >= 0.7).sort((a,b) => (b.mlProb||0) - (a.mlProb||0));
    summaryTxt = '<strong>Wrong at 70%+ confidence.</strong> Calls the browser model made with high confidence (at capture) that went the other way.';
  } else {
    filtered = trades.filter(t => t.isWin && t.mlProb != null && t.mlProb < 0.55).sort((a,b) => (b.pnlPct||0) - (a.pnlPct||0));
    summaryTxt = '<strong>Right at low confidence.</strong> Calls the browser model got right while under 55% confident.';
  }
  filtered = filtered.slice(0, 10);

  document.getElementById('summary').innerHTML = '<div class="summary-card">' + summaryTxt + '</div>';

  const wrap = document.getElementById('legends');
  if (filtered.length === 0) {
    wrap.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);font-size:13px;">' + (trades.length ? 'Nothing matches this category yet.' : 'No closed journal trades and ' + TrainRows.EMPTY_HTML.charAt(0).toLowerCase() + TrainRows.EMPTY_HTML.slice(1)) + '</div>';
    return;
  }
  const esc = TrainRows.esc;
  wrap.innerHTML = filtered.map((t, i) => {
    const cls = t.isWin ? 'win' : 'loss';
    const crown = i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
    return '<div class="legend-card ' + cls + '">'
      + '<div class="crown">' + crown + '</div>'
      + '<div class="row">'
        + '<div class="rank">#' + (i + 1) + '</div>'
        + '<div><h3>' + esc(t.sym || '—') + '</h3>'
          + '<div class="meta">' + new Date(t.ts).toLocaleDateString('en-US', { timeZone: 'America/New_York' }) + ' · ' + (t.source === 'journal' ? 'Your journal trade' : 'Browser-model call (5-day)') + (t.mlProb != null ? ' · model was <strong>' + (t.mlProb*100).toFixed(0) + '%</strong> confident' : '') + '</div></div>'
        + '<div class="meta-line">'
          + (t.entry ? '$' + t.entry.toFixed(2) + ' → $' + (t.exit||0).toFixed(2) : '')
          + (t.qty ? '<br>' + t.qty + ' shares' : '')
        + '</div>'
        + (t.source === 'journal'
          ? '<div><div class="pnl-big" style="color:' + (t.pnl > 0 ? 'var(--green)' : 'var(--red)') + ';">' + (t.pnl >= 0 ? '+' : '-') + '$' + Math.abs(t.pnl).toFixed(0) + '</div><div class="meta-line">' + (t.r != null ? (t.r >= 0 ? '+' : '') + t.r.toFixed(2) + 'R' : 'no stop logged') + '</div></div>'
          : '<div><div class="pnl-big" style="color:' + (t.isWin ? 'var(--green)' : 'var(--red)') + ';">' + (t.pnlPct != null ? (t.pnlPct >= 0 ? '+' : '') + t.pnlPct.toFixed(2) + '%' : (t.isWin ? 'RIGHT' : 'WRONG')) + '</div><div class="meta-line">' + (t.isWin ? 'right' : 'wrong') + ' · move in the called direction</div></div>')
      + '</div></div>';
  }).join('');
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
  t.classList.add('on');
  activeTab = t.dataset.tab;
  render();
}));
document.getElementById('metric').addEventListener('change', render);

render();
</script>
</body>
</html>
