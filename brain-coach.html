<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Coach — bpleone / trade</title>
<meta name="description" content="Live narrative coach — brain narrates what's happening + what to do, updates every minute.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v188">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.coach-msg { padding:18px 22px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;border-left:4px solid var(--accent); }
.coach-msg .time { font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;font-weight:700;margin-bottom:6px; }
.coach-msg .body { font-size:15px;line-height:1.7;color:var(--text-secondary); }
.coach-msg.green { border-left-color:var(--green);background:linear-gradient(90deg,rgba(16,185,129,0.05),transparent); }
.coach-msg.yellow { border-left-color:var(--yellow);background:linear-gradient(90deg,rgba(245,158,11,0.05),transparent); }
.coach-msg.red { border-left-color:var(--red);background:linear-gradient(90deg,rgba(239,68,68,0.05),transparent); }
.coach-msg.alert { border-left-color:#a78bfa;background:linear-gradient(90deg,rgba(124,58,237,0.06),transparent);font-weight:600; }
.pulse { display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:8px;animation:bpulse 2s infinite; }
@keyframes bpulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
</style>
</head>
<body data-needs="live">
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🎙 Brain Coach</div>
      <div class="page-subtitle"><span class="pulse"></span> Live narration · brain talks you through the day · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-secondary" id="clearBtn">🗑 Clear log</button>
      <button class="btn btn-secondary" id="muteBtn">🔇 Mute speak-aloud</button>
    </div>
  </div>

  <!-- WHAT THE BRAIN IS DOING NOW -->
  <div class="card mb-24" style="background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(124,58,237,0.04));border:1px solid rgba(0,212,255,0.3);">
    <div style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;">🧠 RIGHT NOW</div>
    <div id="nowText" style="font-size:18px;font-weight:600;margin-top:8px;line-height:1.5;">The brain is loading...</div>
    <div id="nowAdvice" style="font-size:13px;color:var(--text-muted);margin-top:8px;">Wait for analysis...</div>
  </div>

  <!-- COACH LOG -->
  <div id="coachLog"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v188"></script>
<script src="js/ai-client.js?v=v188"></script>
<script src="js/app.js?v=v188"></script>
<script src="js/notify.js?v=v188"></script>
<script src="js/live.js?v=v188"></script>
<script src="js/model.js?v=v188"></script>
<script>
buildNav('brain-coach');

let messages = [];
let muted = false;

function getQ(s) { return (typeof QUOTES !== 'undefined' && QUOTES[s]) ? QUOTES[s] : { last: 0, changePct: 0 }; }

function addMsg(body, cls) {
  cls = cls || '';
  messages.unshift({ ts: Date.now(), body, cls });
  if (messages.length > 30) messages.length = 30;
  paintLog();
  if (!muted && cls === 'alert' && 'speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(body.replace(/[^\w\s.,!?-]/g, '').slice(0, 150));
      u.rate = 1.05; u.pitch = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
}

function paintLog() {
  const log = document.getElementById('coachLog');
  log.innerHTML = '';
  messages.forEach(m => {
    const time = new Date(m.ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    log.innerHTML += '<div class="coach-msg ' + m.cls + '"><div class="time">' + time + '</div><div class="body">' + m.body + '</div></div>';
  });
}

function generateNarrative() {
  const findings = (function () { try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch (e) { return []; } })();
  const recent = findings.filter(f => (Date.now() - f.ts) < 30 * 60 * 1000);
  const state = (function () { try { return JSON.parse(localStorage.getItem('bpleone_brain_loop_state_v1') || '{}'); } catch (e) { return {}; } })();
  const model = window.ModelStore ? window.ModelStore.load() : null;

  const spy = getQ('SPY');
  const vxx = getQ('VXX');
  const regime = state.regimeScore || 50;
  const regimeLabel = regime >= 65 ? 'RISK-ON' : regime >= 45 ? 'NEUTRAL' : regime >= 30 ? 'CAUTION' : 'RISK-OFF';

  // What's happening now
  const highConf = recent.filter(f => typeof f.modelProb === 'number' && f.modelProb >= 0.70 && (f.severity === 'high' || f.severity === 3));
  let nowText, nowAdvice;
  if (highConf.length > 0) {
    const top = highConf[0];
    const sym = top.meta && top.meta.sym;
    nowText = '🎯 ' + sym + ' is a HIGH-CONFIDENCE setup right now (' + (top.modelProb * 100).toFixed(0) + '%). Setup: ' + ((top.meta && top.meta.setup) || top.type);
    nowAdvice = 'Open Trade Coach for ' + sym + ' → review the plan → consider taking it.';
  } else if (recent.length > 0) {
    nowText = 'Brain is scanning · ' + recent.length + ' findings in last 30min · no high-confidence ML pick yet';
    nowAdvice = 'Patient discipline beats forced entries. Check back in 10-15 min.';
  } else {
    nowText = 'Quiet tape · brain idle';
    nowAdvice = 'Possibly a good moment to review Daily Report or work on the Journal.';
  }
  document.getElementById('nowText').textContent = nowText;
  document.getElementById('nowAdvice').textContent = nowAdvice;

  // Auto-generate periodic insights
  return { spy, vxx, regime, regimeLabel, recent, highConf, model };
}

// Periodic check — generate new insight every minute
let lastTick = 0;
function tick() {
  const data = generateNarrative();
  // Only post new messages if conditions changed
  const last = messages[0];
  const lastBody = last ? last.body : '';

  // Market state insight (once per 5 min)
  if (Date.now() - (lastTick || 0) > 5 * 60 * 1000) {
    lastTick = Date.now();
    const dayChg = data.spy.changePct || 0;
    if (Math.abs(dayChg) > 0.5) {
      const verb = dayChg > 0 ? 'green' : 'red';
      addMsg('Market is ' + verb + '. SPY ' + (dayChg >= 0 ? '+' : '') + dayChg.toFixed(2) + '%. Regime: ' + data.regimeLabel + '. ' + (data.regimeLabel === 'RISK-ON' ? 'Lean long.' : data.regimeLabel === 'RISK-OFF' ? 'Reduce risk · hedges work.' : 'Mixed signals · trade smaller.'), dayChg > 0 ? 'green' : 'red');
    }
  }

  // Model performance check
  if (data.model && data.model.n_trained > 0 && Math.random() < 0.1) {
    const acc = data.model.rollingAccuracy();
    if (acc > 0.6) addMsg('Model is hot — rolling accuracy ' + (acc * 100).toFixed(0) + '% on last 100 predictions. Trust the high-conviction calls more.', 'green');
    else if (acc < 0.45) addMsg('Model is cold — rolling accuracy only ' + (acc * 100).toFixed(0) + '%. Reduce size on its picks until accuracy recovers.', 'yellow');
  }
}

// React to brain findings
window.addEventListener('bpleone:brain-finding', e => {
  const f = e.detail;
  if (!f) return;
  const sym = (f.meta && f.meta.sym) || 'MKT';
  if (typeof f.modelProb === 'number' && f.modelProb >= 0.80 && (f.severity === 'high' || f.severity === 3)) {
    addMsg('🚨 HIGH-CONFIDENCE FIRE: ' + sym + ' · model ' + (f.modelProb * 100).toFixed(0) + '%. Setup: ' + ((f.meta && f.meta.setup) || f.type) + '. Consider taking the trade.', 'alert');
  } else if ((f.severity === 'high' || f.severity === 3) && f.type !== 'ml-feedback' && f.type !== 'hourly-digest') {
    addMsg('⭐ Major signal: ' + sym + ' · ' + ((f.meta && f.meta.setup) || f.type) + '. ' + (f.title || ''), 'alert');
  } else if (f.type === 'regime-shift') {
    addMsg('🌐 REGIME SHIFT: ' + f.body, 'alert');
  } else if (f.type === 'drift-alert') {
    addMsg('⚠ Model drift detected. ' + f.body, 'yellow');
  }
});

window.addEventListener('bpleone:model-trained', e => {
  const d = e.detail;
  if (d && d.batchSize > 5 && Math.random() < 0.3) {
    addMsg('🧬 Model trained on ' + d.batchSize + ' new outcomes. Avg loss ' + (d.avgLoss || 0).toFixed(3) + '. Getting smarter.', '');
  }
});

document.getElementById('clearBtn').addEventListener('click', () => { messages = []; paintLog(); });
document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔊 Unmute speak-aloud' : '🔇 Mute speak-aloud';
});

// Seed welcome message
addMsg('🎙 Brain Coach is listening. I will narrate market events, alert you to high-conviction setups, and report when the model trains. Keep this tab open during the trading day.', 'alert');
tick();
setInterval(tick, 60 * 1000);
</script>
</body>
</html>
