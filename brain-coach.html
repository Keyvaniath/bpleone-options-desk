<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Coach — bpleone / trade</title>
<meta name="description" content="Live narrative coach — narrates the tape from real worker data, honest about the brain's lack of proven timing edge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v215">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.coach-msg { padding:18px 22px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;border-left:4px solid var(--accent); }
.coach-msg .time { font-family:var(--font-mono);font-size:10px;color:var(--text-muted);letter-spacing:0.5px;font-weight:700;margin-bottom:6px; }
.coach-msg .body { font-size:15px;line-height:1.7;color:var(--text-secondary); }
.coach-msg.green { border-left-color:var(--green);background:linear-gradient(90deg,rgba(16,185,129,0.05),transparent); }
.coach-msg.yellow { border-left-color:var(--yellow);background:linear-gradient(90deg,rgba(245,158,11,0.05),transparent); }
.coach-msg.red { border-left-color:var(--red);background:linear-gradient(90deg,rgba(239,68,68,0.05),transparent); }
.coach-msg.alert { border-left-color:#a78bfa;background:linear-gradient(90deg,rgba(124,58,237,0.06),transparent);font-weight:600; }
.pulse { display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green);margin-right:8px;animation:bpulse 2s infinite; }
@keyframes bpulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🎙 Brain Coach</div>
      <div class="page-subtitle"><span class="pulse"></span> Live narration · brain talks you through the day · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-secondary" id="clearBtn">🗑 Clear log</button>
      <button class="btn btn-secondary" id="muteBtn">🔇 Mute speak-aloud</button>
    </div>
  </div>

  <!-- WHAT THE BRAIN IS DOING NOW -->
  <div class="card mb-24" style="background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(124,58,237,0.04));border:1px solid rgba(0,212,255,0.3);">
    <div style="font-size:11px;color:var(--accent);font-weight:700;letter-spacing:1px;">🧠 RIGHT NOW</div>
    <div id="nowText" style="font-size:18px;font-weight:600;margin-top:8px;line-height:1.5;">The brain is loading...</div>
    <div id="nowAdvice" style="font-size:13px;color:var(--text-muted);margin-top:8px;">Wait for analysis...</div>
  </div>

  <!-- COACH LOG -->
  <div id="coachLog"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v215"></script>
<script src="js/ai-client.js?v=v215"></script>
<script src="js/app.js?v=v215"></script>
<script src="js/notify.js?v=v215"></script>
<script src="js/live.js?v=v215"></script>
<script src="js/model.js?v=v215"></script>
<script>
buildNav('brain-coach');

let messages = [];
let muted = false;
const WORKER = (window.WorkerBridge && WorkerBridge.getUrl && WorkerBridge.getUrl()) || 'https://bpleone-brain-worker.brandonpleone.workers.dev';
let SNAP = { spy: null, qqq: null, vix: null, regime: 'unknown', meanProb: null, signals: [], metrics: null };

function addMsg(body, cls) {
  cls = cls || '';
  messages.unshift({ ts: Date.now(), body, cls });
  if (messages.length > 30) messages.length = 30;
  paintLog();
  if (!muted && cls === 'alert' && 'speechSynthesis' in window) {
    try {
      const u = new SpeechSynthesisUtterance(body.replace(/[^\w\s.,!?-]/g, '').slice(0, 150));
      u.rate = 1.05; u.pitch = 0.9;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }
}

function paintLog() {
  const log = document.getElementById('coachLog');
  log.innerHTML = '';
  messages.forEach(m => {
    const time = new Date(m.ts).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
    log.innerHTML += '<div class="coach-msg ' + m.cls + '"><div class="time">' + time + '</div><div class="body">' + m.body + '</div></div>';
  });
}

async function loadSnap() {
  const [qr, sr, mr] = await Promise.all([
    fetch(WORKER + '/brain/quotes?syms=SPY,QQQ,VIX', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(WORKER + '/brain/signals', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null),
    fetch(WORKER + '/brain/metrics', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).catch(() => null)
  ]);
  const q = (qr && qr.quotes) || {};
  SNAP.spy = q.SPY || null; SNAP.qqq = q.QQQ || null; SNAP.vix = q.VIX || null;
  SNAP.regime = (sr && sr.regime) || 'unknown';
  SNAP.meanProb = (sr && typeof sr.universe_mean_prob === 'number') ? sr.universe_mean_prob : null;
  SNAP.signals = (sr && Array.isArray(sr.signals)) ? sr.signals : [];
  SNAP.metrics = mr || null;
}

function vixRead(v) {
  if (!(v > 0)) return null;
  if (v < 16) return 'calm';
  if (v < 22) return 'normal';
  if (v < 28) return 'elevated';
  return 'stress';
}

// "Right now" — real SPY/VIX + real cross-sectional relative-strength leader.
function paintNow() {
  const spy = SNAP.spy, vix = SNAP.vix;
  let nowText, nowAdvice;
  if (!spy || !(spy.last > 0)) {
    nowText = 'Waiting for live market data from the brain worker...';
    nowAdvice = 'If this persists, the worker may be warming up - refresh in a moment.';
  } else {
    const spyChg = spy.changePct || 0;
    const vr = vix && vix.last > 0 ? vixRead(vix.last) : null;
    const vixTxt = vr ? ', VIX ' + vix.last.toFixed(1) + ' (' + vr + ')' : '';
    const regimeTxt = SNAP.regime !== 'unknown' ? SNAP.regime : 'forming';
    const buys = SNAP.signals.filter(s => s && (s.signal === 'BUY' || s.signal === 'LEAN BUY'));
    if (buys.length) {
      const top = buys[0];
      const p = typeof top.predProb === 'number' ? Math.round(top.predProb * 100) : null;
      nowText = 'Strongest name in the tracked universe: ' + top.sym + (top.reason ? ' - ' + top.reason : '') + (p != null ? '. Brain P(up, 5d) ' + p + '%.' : '.');
      nowAdvice = 'Cross-sectional relative strength, not a promise it rises. Tape: SPY ' + (spyChg >= 0 ? '+' : '') + spyChg.toFixed(2) + '%' + vixTxt + ', brain regime ' + regimeTxt + '. The desk has no proven timing edge - size small.';
    } else {
      nowText = 'No standout long flagged right now. SPY ' + (spyChg >= 0 ? '+' : '') + spyChg.toFixed(2) + '%' + vixTxt + ', brain regime ' + regimeTxt + '.';
      nowAdvice = 'Patience beats forced entries - no high-relative-strength setup is on the board.';
    }
  }
  document.getElementById('nowText').textContent = nowText;
  document.getElementById('nowAdvice').textContent = nowAdvice;
}

let lastTick = 0, lastModelMsg = 0;
async function tick() {
  await loadSnap();
  paintNow();

  // Market-state insight, at most once per 5 min, only on a real move.
  if (SNAP.spy && SNAP.spy.last > 0 && Date.now() - (lastTick || 0) > 5 * 60 * 1000) {
    lastTick = Date.now();
    const dayChg = SNAP.spy.changePct || 0;
    if (Math.abs(dayChg) > 0.5) {
      const reg = SNAP.regime;
      const lean = reg === 'bullish' ? 'Breadth leans long.' : reg === 'bearish' ? 'Breadth leans defensive.' : 'Mixed breadth - trade smaller.';
      addMsg('SPY ' + (dayChg >= 0 ? '+' : '') + dayChg.toFixed(2) + '%' + (SNAP.vix && SNAP.vix.last > 0 ? ', VIX ' + SNAP.vix.last.toFixed(1) : '') + '. Brain regime: ' + reg + '. ' + lean, dayChg > 0 ? 'green' : 'red');
    }
  }

  // Honest model-quality note, at most once per 15 min, from REAL backtest metrics.
  const wf = SNAP.metrics && SNAP.metrics.walk_forward_test;
  if (wf && typeof wf.accuracy === 'number' && typeof wf.base_rate === 'number' && Date.now() - (lastModelMsg || 0) > 15 * 60 * 1000) {
    lastModelMsg = Date.now();
    const acc = (wf.accuracy * 100).toFixed(1), base = (wf.base_rate * 100).toFixed(1);
    const skillNum = (wf.accuracy - wf.base_rate) * 100;
    const skill = (skillNum >= 0 ? '+' : '') + skillNum.toFixed(1);
    if (wf.beats_base_rate_95) {
      addMsg('Reality check: 5-day directional accuracy ' + acc + '% vs market drift ' + base + '% - skill ' + skill + 'pp, statistically significant (n=' + (wf.n || '?') + '). Rare; still size with discipline.', 'green');
    } else {
      addMsg('Reality check: 5-day accuracy ' + acc + '% but market drift alone is ' + base + '% - real timing skill is only ' + skill + 'pp and NOT statistically significant. Treat picks as ideas, not edge.', 'yellow');
    }
  }
}

// React to LOCAL browser-brain regime/drift events if that brain is also running.
window.addEventListener('bpleone:brain-finding', e => {
  const f = e.detail;
  if (!f) return;
  if (f.type === 'regime-shift') addMsg('Regime shift: ' + (f.body || ''), 'alert');
  else if (f.type === 'drift-alert') addMsg('Model drift detected. ' + (f.body || ''), 'yellow');
});

document.getElementById('clearBtn').addEventListener('click', () => { messages = []; paintLog(); });
document.getElementById('muteBtn').addEventListener('click', () => {
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔊 Unmute speak-aloud' : '🔇 Mute speak-aloud';
});

// Seed welcome message
addMsg('Brain Coach is live. I narrate the tape from real worker data - SPY/VIX, the relative-strength scanner, and honest backtest metrics. I will not pretend the desk has timing edge it has not proven.', 'alert');
tick();
setInterval(tick, 60 * 1000);
</script>
</body>
</html>
