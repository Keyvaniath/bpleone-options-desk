<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Pulse — bpleone / trade</title>
<meta name="description" content="Always-on mini dashboard. Optimized for second-screen / TV / phone. The brain's heartbeat at a glance.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=v239">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
body { background:#000; }
.pulse-grid { display:grid;grid-template-columns:repeat(3, 1fr);grid-template-rows:repeat(3, 1fr);gap:14px;height:calc(100vh - 160px);padding:14px; }
.pulse-tile { background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden; }
.pulse-tile.big { grid-column:span 2;grid-row:span 2; }
.pulse-tile .lbl { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1.2px;font-weight:700; }
.pulse-tile .val { font-family:var(--font-mono);font-size:48px;font-weight:800;line-height:1; }
.pulse-tile.big .val { font-size:88px; }
.pulse-tile .sub { font-size:12px;color:var(--text-secondary); }
.pulse-tile.live::before { content:'';position:absolute;top:14px;right:14px;width:10px;height:10px;background:var(--green);border-radius:50%;animation:pulse 1.6s infinite; }
@keyframes pulse { 0%, 100% { opacity:1; transform:scale(1); } 50% { opacity:0.3; transform:scale(0.85); } }
.heart { font-size:14px;color:var(--green);animation:beat 1.4s infinite; }
@keyframes beat { 0%,100%{transform:scale(1);}25%{transform:scale(1.2);}50%{transform:scale(1);} }
</style>
  <link rel="canonical" href="https://options.bpleone.com/brain-pulse.html">
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">💓 Brain Pulse</div>
      <div class="page-subtitle"><span class="heart">●</span> Always-on monitor · second-screen friendly · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-ghost" id="fullscreenBtn">⛶ Fullscreen</button>
    </div>
  </div>

  <div class="pulse-grid">
    <div class="pulse-tile big live">
      <div class="lbl">🎯 Top ML pick</div>
      <div id="topPick"></div>
    </div>
    <div class="pulse-tile">
      <div class="lbl">Skill vs drift</div>
      <div class="val" id="grade">--</div>
      <div class="sub" id="gradeNote">--</div>
    </div>
    <div class="pulse-tile">
      <div class="lbl">Hit rate (graded 5-day calls)</div>
      <div class="val" id="hit">--</div>
      <div class="sub" id="hitSub">--</div>
    </div>
    <div class="pulse-tile">
      <div class="lbl">Signals (1h)</div>
      <div class="val" id="sig">--</div>
      <div class="sub">live throughput</div>
    </div>
    <div class="pulse-tile">
      <div class="lbl">High conf today</div>
      <div class="val" id="highConf" style="color:var(--accent);">--</div>
      <div class="sub">≥ 70% browser model (raw)</div>
    </div>
    <div class="pulse-tile">
      <div class="lbl">Open positions</div>
      <div class="val" id="positions">--</div>
      <div class="sub" id="posSub">--</div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v239"></script>
<script src="js/ai-client.js?v=v239"></script>
<script src="js/app.js?v=v239"></script>
<script src="js/notify.js?v=v239"></script>
<script src="js/live.js?v=v239"></script>
<script src="js/train-rows.js?v=v239"></script>
<script src="js/no-play-gate.js?v=v239" defer></script>
<script src="js/model.js?v=v239"></script>
<script>
buildNav('brain-pulse');

function loadFindings() { try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch(e) { return []; } }
function loadTrain() { return window.TrainRows ? TrainRows.load() : []; }   // pass 344: graded calls (js/train-rows.js); 'bpleone_train_v1' was never written
function loadPositions() { try { return JSON.parse(localStorage.getItem('bpleone_positions_live_v1') || '[]'); } catch(e) { return []; } }

function render() {
  const findings = loadFindings();
  const train = loadTrain();
  const positions = loadPositions();
  const now = Date.now();
  const weekAgo = now - 7 * 86400000;
  const hourAgo = now - 3600 * 1000;
  const today0 = new Date(); today0.setHours(0,0,0,0);

  // Top pick
  // Pass 344: only findings about a symbol can be a pick (regime/market findings have no meta.sym: "undefined").
  const esc = window.TrainRows ? TrainRows.esc : (x => String(x == null ? '' : x));
  const todayF = findings.filter(f => f.ts >= today0.getTime() && f.meta && f.meta.sym);
  const ranked = todayF.map(f => {
    let prob = null; try { if (window.predictForFinding) { const p = window.predictForFinding(f); prob = p ? p.prob : null; } } catch(e) {}
    return { ...f, prob };
  }).filter(f => f.prob != null).sort((a,b) => b.prob - a.prob);
  const top = ranked[0];
  if (top) {
    const q0 = (typeof QUOTES !== 'undefined') ? QUOTES[top.meta.sym] : null;
    const q = q0 && q0.last > 0 && ['stale-seed', 'mock', 'demo-sim'].indexOf(q0.priceSource) < 0 && isFinite(q0.changePct) ? q0 : null;
    document.getElementById('topPick').innerHTML =
      '<div class="val" style="color:var(--accent);text-align:center;font-size:120px;">' + esc(top.meta.sym) + '</div>'
      + '<div style="text-align:center;margin-top:14px;">'
        + '<div style="font-size:18px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">' + esc(top.meta.setup || 'signal') + '</div>'
        + '<div style="font-family:var(--font-mono);font-size:48px;font-weight:800;color:var(--green);margin-top:6px;">' + (top.prob*100).toFixed(0) + '%</div>'
        + (q ? '<div style="font-family:var(--font-mono);font-size:18px;color:var(--text-secondary);margin-top:4px;">$' + q.last.toFixed(2) + ' · <span style="color:' + (q.changePct >= 0 ? 'var(--green)' : 'var(--red)') + ';">' + (q.changePct >= 0 ? '+' : '') + q.changePct.toFixed(2) + '%</span></div>' : '')
      + '</div>';
  } else {
    document.getElementById('topPick').innerHTML = '<div style="text-align:center;padding:40px;font-size:20px;color:var(--text-muted);">No symbol finding scored today in this browser yet.</div>';
  }

  // Pass 344: graded against the drift rate, never a 50% coin flip or A-F cutoffs (pass 299). Zero calls = "—".
  const g = window.TrainRows ? TrainRows.grade(train) : { n: 0 };
  const gEl = document.getElementById('grade'), hEl = document.getElementById('hit');
  if (!g.n) {
    gEl.textContent = '—'; gEl.style.color = 'var(--text-muted)';
    document.getElementById('gradeNote').innerHTML = 'No graded calls in this browser yet · <a href="edge-scorecard.html" style="color:var(--accent);">live record</a>';
    hEl.textContent = '—'; hEl.style.color = 'var(--text-muted)';
    document.getElementById('hitSub').textContent = '0 graded calls';
  } else {
    const wins = train.filter(t => t.y === 1).length;
    hEl.textContent = (g.hit * 100).toFixed(0) + '%';
    hEl.style.color = 'var(--text-primary)';
    document.getElementById('hitSub').textContent = wins + '/' + g.n + ' right · drift ' + (g.drift != null ? (g.drift * 100).toFixed(0) + '%' : '~52%');
    if (!g.enough) {
      gEl.textContent = '—'; gEl.style.color = 'var(--text-muted)';
      document.getElementById('gradeNote').textContent = 'n=' + g.n + ': too few to grade (needs ' + TrainRows.MIN_N + '+)';
    } else {
      gEl.textContent = (g.skillPp >= 0 ? '+' : '') + g.skillPp.toFixed(1) + ' pp';
      gEl.style.color = g.skillPp > 0 ? 'var(--green)' : 'var(--red)';
      document.getElementById('gradeNote').textContent = 'hit rate minus drift (n=' + g.n + ')';
    }
  }

  // Signals
  document.getElementById('sig').textContent = findings.filter(f => f.ts >= hourAgo).length;

  // High conf today
  document.getElementById('highConf').textContent = ranked.filter(f => f.prob >= 0.7).length;

  // Positions
  document.getElementById('positions').textContent = positions.length;
  let totalExp = 0;
  positions.forEach(p => {
    const q = (typeof QUOTES !== 'undefined' && QUOTES[p.sym]) ? QUOTES[p.sym] : null;
    if (q) totalExp += q.last * p.qty;
  });
  document.getElementById('posSub').textContent = '$' + totalExp.toFixed(0) + ' exposure';
}

document.getElementById('fullscreenBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen();
});

render();
setInterval(render, 3000);
</script>
</body>
</html>
