name: Deploy Brain Worker

# Auto-deploy the Cloudflare Worker whenever the worker/ folder changes,
# OR manually via "Run workflow" button in GitHub Actions tab.
#
# REQUIRED GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Cloudflare API token with Workers:Edit + KV:Edit
#                           (https://dash.cloudflare.com/profile/api-tokens)
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account ID
#                           (right sidebar on dash.cloudflare.com)
#   FINNHUB_API_KEY       — your Finnhub key (same one you use in settings.html)
#   ADMIN_TOKEN           — make up a long random string for /brain/bootstrap auth

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:  # manual trigger button

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # so the workflow can commit the KV id back to wrangler.toml

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check secrets present
        id: secrets_check
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "GitHub secrets CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID not set."
            echo "Skipping worker deploy. Use local 'wrangler deploy' instead."
            echo "secrets_set=false" >> $GITHUB_OUTPUT
          else
            echo "secrets_set=true" >> $GITHUB_OUTPUT
          fi

      - name: Install Wrangler
        if: steps.secrets_check.outputs.secrets_set == 'true'
        run: npm install -g wrangler@latest

      - name: Ensure KV namespace exists
        if: steps.secrets_check.outputs.secrets_set == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # If wrangler.toml still has the placeholder, create the KV namespace
          # and patch the id in.
          if grep -q "REPLACE_WITH_KV_ID_FROM_WRANGLER_OUTPUT" wrangler.toml; then
            echo "Creating new KV namespace..."
            OUTPUT=$(wrangler kv namespace create BRAIN_KV 2>&1)
            echo "$OUTPUT"
            # Extract id (wrangler output format varies — try both patterns)
            KV_ID=$(echo "$OUTPUT" | grep -oE 'id\s*=\s*"[a-f0-9]+"' | grep -oE '"[a-f0-9]+"' | tr -d '"' | head -1)
            if [ -z "$KV_ID" ]; then
              echo "Failed to parse KV ID from wrangler output"
              exit 1
            fi
            echo "KV namespace ID: $KV_ID"
            # Replace placeholder
            sed -i "s/REPLACE_WITH_KV_ID_FROM_WRANGLER_OUTPUT/$KV_ID/" wrangler.toml
            # Commit the change back so we don't recreate next time
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml
            git commit -m "Auto-patch KV namespace id from first deploy [skip ci]"
            git push
          else
            echo "KV namespace id already set in wrangler.toml — skipping create"
          fi

      - name: Upload secrets to worker
        if: steps.secrets_check.outputs.secrets_set == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.FINNHUB_API_KEY }}" | wrangler secret put FINNHUB_API_KEY
          echo "${{ secrets.ADMIN_TOKEN }}" | wrangler secret put ADMIN_TOKEN

      - name: Deploy worker
        if: steps.secrets_check.outputs.secrets_set == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Wait for cron + verify health
        if: steps.secrets_check.outputs.secrets_set == 'true'
        run: |
          # Wait 75s for first cron tick to fire
          sleep 75
          # Health check — replace URL pattern with what the deploy output will give us
          # (worker URL is bpleone-brain-worker.<your-subdomain>.workers.dev)
          # GitHub doesn't know your subdomain so we skip the curl and trust the deploy.
          echo "Deploy complete. Cron fires every minute. Verify at:"
          echo "  https://bpleone-brain-worker.<YOUR-SUBDOMAIN>.workers.dev/brain/health"
