<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Notes — bpleone</title>
<meta name="description" content="Quick-write trade journal: thesis on entry, retrospective on exit. Build self-awareness over time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v189">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.note-card { padding:18px 22px;background:var(--bg-elevated);border-radius:12px;margin-bottom:10px;border-left:4px solid var(--accent); }
.note-card.win { border-left-color:var(--green); }
.note-card.loss { border-left-color:var(--red); }
.note-card .head { display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap; }
.note-card .sym { font-family:var(--font-mono);font-size:16px;font-weight:900; }
.note-card .body { font-size:14px;line-height:1.6;color:var(--text-secondary); }
.note-card .retro { padding:10px 14px;background:rgba(0,0,0,0.18);border-radius:8px;margin-top:10px;font-size:13px;color:var(--text-secondary); }
.note-card .actions { display:flex;gap:6px;margin-top:10px; }
.note-card .actions button { padding:6px 10px;border-radius:5px;border:none;font-size:11px;font-weight:700;cursor:pointer; }
.btn-retro { background:rgba(0,212,255,0.18);color:var(--accent); }
.btn-del { background:rgba(220,38,38,0.18);color:var(--red); }
.tile { padding:18px;background:var(--bg-elevated);border-radius:10px; }
.tile .lbl { font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;font-weight:700; }
.tile .val { font-family:var(--font-mono);font-size:22px;font-weight:800;margin-top:6px;color:var(--accent); }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">📓 Trade Notes</div>
      <div class="page-subtitle">Quick-write thesis on entry. Retro after exit. Build self-awareness in 30 seconds per trade.</div>
    </div>
  </div>

  <div class="grid grid-3 mb-24" id="kpi-grid"></div>

  <div class="card mb-24">
    <div class="card-header"><div class="card-title">✍ Add new note</div></div>
    <div style="display:grid;gap:10px;">
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <input id="new-sym" type="text" placeholder="Symbol (NVDA)" style="width:140px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font-mono);text-transform:uppercase;">
        <select id="new-dir" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font-mono);">
          <option value="LONG">LONG</option>
          <option value="SHORT">SHORT</option>
        </select>
        <select id="new-outcome" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:8px 12px;color:var(--text);font-family:var(--font-mono);">
          <option value="open">Open (pending)</option>
          <option value="win">Win</option>
          <option value="loss">Loss</option>
        </select>
      </div>
      <textarea id="new-thesis" placeholder="Why I'm taking this trade (1-3 sentences)..." style="width:100%;min-height:80px;background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:10px 14px;color:var(--text);font-size:14px;font-family:Inter,sans-serif;line-height:1.5;"></textarea>
      <div>
        <button onclick="addNote()" style="padding:10px 22px;background:linear-gradient(135deg,#00d4ff,#0094c7);color:#000;border:none;border-radius:6px;font-weight:700;cursor:pointer;">💾 Add note</button>
      </div>
    </div>
  </div>

  <div class="card mb-24">
    <div class="card-header"><div class="card-title">📜 All notes (most recent first)</div></div>
    <div id="notes-list"></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title">🔗 Related</div></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <a href="journal.html" style="text-decoration:none;display:inline-block;background:linear-gradient(135deg,#00d4ff,#0094c7);color:#000;padding:10px 18px;border-radius:8px;font-weight:700;">📔 Full Journal</a>
      <a href="post-trade-debrief.html" style="text-decoration:none;display:inline-block;background:rgba(120,140,160,0.12);color:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;">🔎 Debrief</a>
      <a href="trade-blotter.html" style="text-decoration:none;display:inline-block;background:rgba(120,140,160,0.12);color:var(--accent);padding:10px 18px;border-radius:8px;font-weight:700;">📋 Blotter</a>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v189"></script>
<script src="js/ai-client.js?v=v189"></script>
<script src="js/app.js?v=v189"></script>
<script src="js/notify.js?v=v189"></script>
<script src="js/live.js?v=v189"></script>
<script>buildNav('trade-notes');</script>
<script>
const KEY = 'bpleone_trade_notes_v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
function save(n) { try { localStorage.setItem(KEY, JSON.stringify(n.slice(-500))); } catch (e) {} }
function fmtAgo(t) { if (!t) return '—'; const ms = Date.now() - t; if (ms < 60000) return Math.round(ms/1000) + 's'; if (ms < 3600000) return Math.round(ms/60000) + 'm'; if (ms < 86400000) return Math.round(ms/3600000) + 'h'; return Math.round(ms/86400000) + 'd'; }
function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>'); }

function addNote() {
  const sym = document.getElementById('new-sym').value.toUpperCase().trim();
  const dir = document.getElementById('new-dir').value;
  const outcome = document.getElementById('new-outcome').value;
  const thesis = document.getElementById('new-thesis').value.trim();
  if (!sym || !thesis) { alert('Symbol + thesis required.'); return; }
  const notes = load();
  notes.push({ id: 'n-' + Date.now(), ts: Date.now(), sym, dir, outcome, thesis, retro: '' });
  save(notes);
  document.getElementById('new-sym').value = '';
  document.getElementById('new-thesis').value = '';
  document.getElementById('new-outcome').value = 'open';
  render();
}
function addRetro(id) {
  const retro = prompt('Retrospective (what happened? what did you learn?):');
  if (!retro) return;
  const notes = load();
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.retro = retro;
  n.retroTs = Date.now();
  save(notes);
  render();
}
function delNote(id) {
  if (!confirm('Delete note?')) return;
  const notes = load().filter(x => x.id !== id);
  save(notes);
  render();
}
function setOutcome(id, val) {
  const notes = load();
  const n = notes.find(x => x.id === id);
  if (!n) return;
  n.outcome = val;
  save(notes);
  render();
}
function render() {
  const notes = load().slice().reverse();
  const wins = notes.filter(n => n.outcome === 'win').length;
  const losses = notes.filter(n => n.outcome === 'loss').length;
  const opens = notes.filter(n => n.outcome === 'open').length;
  document.getElementById('kpi-grid').innerHTML =
    '<div class="tile"><div class="lbl">Total notes</div><div class="val">' + notes.length + '</div></div>' +
    '<div class="tile" style="background:rgba(16,185,129,0.06);"><div class="lbl">Wins</div><div class="val" style="color:var(--green);">' + wins + '</div></div>' +
    '<div class="tile" style="background:rgba(220,38,38,0.06);"><div class="lbl">Losses</div><div class="val" style="color:var(--red);">' + losses + '</div></div>';
  const list = document.getElementById('notes-list');
  if (notes.length === 0) {
    list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px;">No notes yet. Start by capturing one above.</div>';
    return;
  }
  list.innerHTML = notes.map(n => {
    const cls = n.outcome === 'win' ? 'win' : n.outcome === 'loss' ? 'loss' : '';
    const dirColor = n.dir === 'LONG' ? 'var(--green)' : 'var(--red)';
    return '<div class="note-card ' + cls + '">' +
      '<div class="head"><div><span class="sym">' + n.sym + '</span> · <span style="color:' + dirColor + ';font-weight:800;">' + n.dir + '</span> <select onchange="setOutcome(\'' + n.id + '\', this.value)" style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.1);border-radius:5px;padding:3px 8px;color:var(--text);font-size:11px;margin-left:8px;"><option value="open"' + (n.outcome === 'open' ? ' selected' : '') + '>OPEN</option><option value="win"' + (n.outcome === 'win' ? ' selected' : '') + '>WIN</option><option value="loss"' + (n.outcome === 'loss' ? ' selected' : '') + '>LOSS</option></select></div><div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono);">' + fmtAgo(n.ts) + ' ago</div></div>' +
      '<div class="body">' + escapeHtml(n.thesis) + '</div>' +
      (n.retro ? '<div class="retro"><strong>Retro:</strong> ' + escapeHtml(n.retro) + ' <span style="color:var(--text-muted);font-size:10px;">(' + fmtAgo(n.retroTs) + ' ago)</span></div>' : '') +
      '<div class="actions">' +
        (n.retro ? '' : '<button onclick="addRetro(\'' + n.id + '\')" class="btn-retro">+ Retro</button>') +
        '<button onclick="delNote(\'' + n.id + '\')" class="btn-del">🗑</button>' +
      '</div>' +
    '</div>';
  }).join('');
}
setTimeout(render, 400);
</script>
</body>
</html>
