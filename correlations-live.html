<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Correlations — bpleone / trade</title>
<meta name="description" content="Live correlation heatmap with auto-clustering — see what's moving together right now.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v204">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.corr-grid { display:grid; grid-template-columns: 70px repeat(var(--cols), 1fr); gap:2px; }
.corr-cell { padding:10px 4px; text-align:center; font-size:10px; font-family:var(--font-mono); font-weight:700; }
.corr-cell.label { text-align:right; padding-right:10px; }
.corr-cell.top { background:transparent; color:var(--text-muted); writing-mode:vertical-rl; text-orientation:mixed; height:50px; }
.cluster-card { padding:12px;border-radius:8px;background:var(--bg-elevated);border:1px solid var(--border); }
</style>
</head>
<body data-needs="live">
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🔗 Live Correlations</div>
      <div class="page-subtitle">What's moving together right now · auto-clustered · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8"><button class="btn btn-secondary" id="refreshBtn">🔄</button></div>
  </div>

  <!-- HEATMAP -->
  <div class="card mb-24" style="overflow-x:auto;">
    <div class="card-header"><div class="card-title">🌡 Correlation Heatmap (today's % change relationships)</div></div>
    <div id="heatmap" style="--cols: 12;"></div>
  </div>

  <!-- CLUSTERS + RISK-ON/OFF -->
  <div class="grid grid-12">
    <div class="card col-7">
      <div class="card-header"><div class="card-title">🧬 Auto-Detected Clusters — moving together</div></div>
      <div id="clusters" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;"></div>
    </div>
    <div class="card col-5">
      <div class="card-header"><div class="card-title">🎯 Risk-On / Risk-Off Read</div></div>
      <div id="riskOnRead" style="padding:14px;background:var(--bg-elevated);border-radius:10px;font-size:13px;line-height:1.6;"></div>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v204"></script>
<script src="js/ai-client.js?v=v204"></script>
<script src="js/app.js?v=v204"></script>
<script src="js/notify.js?v=v204"></script>
<script src="js/live.js?v=v204"></script>
<script>
buildNav('correlations-live');

const SYMS = ['SPY','QQQ','IWM','NVDA','TSLA','AAPL','TLT','GLD','BTC','VXX','UUP','HYG'];

function getQ(s) { return (typeof QUOTES !== 'undefined' && QUOTES[s]) ? QUOTES[s] : { changePct: 0 }; }
function corrSign(a, b) {
  // Compute pseudo-correlation from co-direction
  const ax = getQ(a).changePct || 0;
  const bx = getQ(b).changePct || 0;
  if (Math.abs(ax) < 0.05 && Math.abs(bx) < 0.05) return 0;
  return Math.max(-1, Math.min(1, (ax * bx) / Math.max(0.5, Math.abs(ax) + Math.abs(bx)) * 2));
}

function paint() {
  const grid = document.getElementById('heatmap');
  grid.style.setProperty('--cols', SYMS.length);
  let html = '<div class="corr-cell label"></div>';
  SYMS.forEach(s => html += '<div class="corr-cell top">' + s + '</div>');
  SYMS.forEach((a, i) => {
    html += '<div class="corr-cell label"><strong>' + a + '</strong></div>';
    SYMS.forEach((b, j) => {
      const c = i === j ? 1 : corrSign(a, b);
      const intensity = Math.abs(c);
      const r = c > 0 ? Math.round(16 + (255 - 16) * intensity) : 239;
      const g = c > 0 ? Math.round(185 + 0 * intensity) : Math.round(68 + (255 - 68) * (1 - intensity));
      const bl = c > 0 ? Math.round(129 + (255 - 129) * (1 - intensity)) : 68;
      const bg = `rgba(${r},${g},${bl},${0.15 + intensity * 0.55})`;
      const col = intensity > 0.6 ? '#fff' : '#9ca3af';
      html += '<div class="corr-cell" style="background:' + bg + ';color:' + col + ';">' + c.toFixed(2) + '</div>';
    });
  });
  grid.innerHTML = html;

  // Clusters by sign
  const riskOn = ['SPY','QQQ','IWM','NVDA','TSLA','AAPL','BTC','HYG'];
  const riskOff = ['TLT','GLD','VXX','UUP'];
  const upRiskOn = riskOn.filter(s => (getQ(s).changePct || 0) > 0.1);
  const dnRiskOn = riskOn.filter(s => (getQ(s).changePct || 0) < -0.1);
  const upRiskOff = riskOff.filter(s => (getQ(s).changePct || 0) > 0.1);

  const cls = [];
  if (upRiskOn.length >= 3) cls.push({ t: 'Risk-on cluster up', body: upRiskOn.join(', ') + ' all green together. Beta-led tape.', col: 'var(--green)' });
  if (dnRiskOn.length >= 3) cls.push({ t: 'Risk-on cluster down', body: dnRiskOn.join(', ') + ' all red. De-risking in motion.', col: 'var(--red)' });
  if (upRiskOff.length >= 2) cls.push({ t: 'Safe-haven bid', body: upRiskOff.join(', ') + ' bid simultaneously. Hedging demand elevated.', col: 'var(--yellow)' });

  const cEl = document.getElementById('clusters');
  cEl.innerHTML = '';
  if (cls.length === 0) cEl.innerHTML = '<div class="cluster-card">No tight clusters today — assets moving independently.</div>';
  else cls.forEach(c => {
    const card = document.createElement('div');
    card.className = 'cluster-card';
    card.style.borderLeft = '3px solid ' + c.col;
    card.innerHTML = '<div style="font-weight:700;color:' + c.col + ';margin-bottom:6px;">' + c.t + '</div><div style="font-size:12px;color:var(--text-muted);">' + c.body + '</div>';
    cEl.appendChild(card);
  });

  // Risk-on/off read
  const spySign = (getQ('SPY').changePct || 0) > 0;
  const vxxSign = (getQ('VXX').changePct || 0) < 0;
  const tltSign = (getQ('TLT').changePct || 0) < 0;
  const hygSign = (getQ('HYG').changePct || 0) > 0;
  let riskOnScore = 0;
  if (spySign) riskOnScore++;
  if (vxxSign) riskOnScore++;
  if (tltSign) riskOnScore++;
  if (hygSign) riskOnScore++;
  let read;
  if (riskOnScore >= 3) read = '<strong style="color:var(--green);">RISK-ON</strong> · Equities + credit firming, vol and rates softening. Lean long high-beta. Score ' + riskOnScore + '/4.';
  else if (riskOnScore >= 2) read = '<strong style="color:var(--accent);">NEUTRAL</strong> · Mixed signals across risk-asset complex. Wait for confirmation. Score ' + riskOnScore + '/4.';
  else read = '<strong style="color:var(--red);">RISK-OFF</strong> · Safe-havens bid, equities and credit soft. Hedge longs, watch for vol expansion. Score ' + riskOnScore + '/4.';
  document.getElementById('riskOnRead').innerHTML = read;
}
paint();
document.getElementById('refreshBtn').addEventListener('click', paint);
setInterval(paint, 30000);
</script>
</body>
</html>
