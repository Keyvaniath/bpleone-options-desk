<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Coach — bpleone / trade</title>
<meta name="description" content="Type any ticker — get a complete trade plan: thesis, entry, stop, targets, R/R, sizing, and brain conviction.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v193">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.plan-section { padding:14px;background:var(--bg-elevated);border-radius:10px;border:1px solid var(--border);margin-bottom:12px; }
.plan-section .lbl { font-size:10px;color:var(--text-muted);font-weight:700;letter-spacing:0.5px;text-transform:uppercase; }
.plan-section .val { font-family:var(--font-mono);font-size:20px;font-weight:700;margin-top:4px; }
.plan-section .body { font-size:12px;color:var(--text-secondary);line-height:1.5;margin-top:6px; }
.input-shell { display:flex;gap:10px;margin-bottom:20px; }
.input-shell input { flex:1;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:14px 16px;color:var(--text-primary);font-size:16px;font-family:var(--font-mono);text-transform:uppercase; }
.checklist-item { padding:8px 0;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:start; }
.checklist-item .check { color:var(--accent);font-family:var(--font-mono); }
.dir-pill { display:inline-block;padding:5px 14px;border-radius:999px;font-size:13px;font-weight:700; }
.dir-bull { background:rgba(16,185,129,0.18);color:var(--green); }
.dir-bear { background:rgba(239,68,68,0.18);color:var(--red); }
.dir-neut { background:rgba(0,212,255,0.18);color:var(--accent); }
</style>
</head>
<body data-needs="live">
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🎓 Trade Coach</div>
      <div class="page-subtitle">Type any ticker · get a complete trade plan · brain-informed · <span id="market-clock">--</span></div>
    </div>
  </div>

  <!-- INPUT -->
  <div class="card mb-24">
    <div class="input-shell">
      <input type="text" id="symInput" placeholder="Enter ticker (e.g. NVDA, TSLA, SPY)..." autofocus>
      <button class="btn btn-primary" id="goBtn" style="padding:14px 28px;font-size:14px;">Generate Plan</button>
    </div>
    <div style="font-size:11px;color:var(--text-muted);">
      Quick try:
      <span class="qt" data-s="NVDA" style="color:var(--accent);cursor:pointer;margin:0 4px;">NVDA</span>
      <span class="qt" data-s="TSLA" style="color:var(--accent);cursor:pointer;margin:0 4px;">TSLA</span>
      <span class="qt" data-s="SPY" style="color:var(--accent);cursor:pointer;margin:0 4px;">SPY</span>
      <span class="qt" data-s="AAPL" style="color:var(--accent);cursor:pointer;margin:0 4px;">AAPL</span>
      <span class="qt" data-s="MSFT" style="color:var(--accent);cursor:pointer;margin:0 4px;">MSFT</span>
      <span class="qt" data-s="AMD" style="color:var(--accent);cursor:pointer;margin:0 4px;">AMD</span>
      <span class="qt" data-s="META" style="color:var(--accent);cursor:pointer;margin:0 4px;">META</span>
      <span class="qt" data-s="COIN" style="color:var(--accent);cursor:pointer;margin:0 4px;">COIN</span>
    </div>
  </div>

  <!-- PLAN OUTPUT -->
  <div id="planOutput"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v193"></script>
<script src="js/ai-client.js?v=v193"></script>
<script src="js/app.js?v=v193"></script>
<script src="js/notify.js?v=v193"></script>
<script src="js/live.js?v=v193"></script>
<script src="js/model.js?v=v193"></script>
<script>
buildNav('trade-coach');

function getQ(s) { return (typeof QUOTES !== 'undefined' && QUOTES[s]) ? QUOTES[s] : { last: 100, changePct: 0 }; }
function loadFindings() {
  try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch (e) { return []; }
}
function loadLearn() {
  try { return JSON.parse(localStorage.getItem('bpleone_learn_v1') || '{}'); } catch (e) { return {}; }
}

function generatePlan(sym) {
  const q = getQ(sym);
  if (!q.last) {
    return '<div class="card" style="padding:30px;text-align:center;color:var(--text-muted);">Symbol <strong>' + sym + '</strong> not in universe. Try a major US listing.</div>';
  }
  const last = q.last;
  const chg = q.changePct || 0;
  const atr = +(last * 0.025).toFixed(2); // synthetic ATR ~2.5%
  // Get brain findings for this symbol
  const findings = loadFindings().filter(f => f.meta && f.meta.sym === sym);
  const recent = findings.filter(f => (Date.now() - f.ts) < 8 * 60 * 60 * 1000);
  // Determine bias from findings
  let bullScore = 0, bearScore = 0;
  recent.forEach(f => {
    const b = (f.meta && f.meta.bias) || '';
    if (b === 'bull') bullScore += (f.severity || 1);
    else if (b === 'bear') bearScore += (f.severity || 1);
  });
  // Layer in price-action: trending up vs down
  bullScore += chg > 1 ? 2 : chg > 0 ? 1 : 0;
  bearScore += chg < -1 ? 2 : chg < 0 ? 1 : 0;
  const bias = bullScore > bearScore + 1 ? 'bull' : bearScore > bullScore + 1 ? 'bear' : 'neutral';
  const direction = bias === 'bull' ? 'LONG' : bias === 'bear' ? 'SHORT' : 'WAIT';
  const dirCls = bias === 'bull' ? 'dir-bull' : bias === 'bear' ? 'dir-bear' : 'dir-neut';
  // Symbol brain weight
  const learn = loadLearn();
  const w = (learn.symbols && learn.symbols[sym] && learn.symbols[sym].w) || 1.0;
  // Entry / stop / targets
  let entry, stop, t1, t2, t3;
  if (bias === 'bull') {
    entry = +(last * 0.998).toFixed(2);
    stop = +(entry - atr * 1.0).toFixed(2);
    t1 = +(entry + atr * 1.5).toFixed(2);
    t2 = +(entry + atr * 3.0).toFixed(2);
    t3 = +(entry + atr * 5.0).toFixed(2);
  } else if (bias === 'bear') {
    entry = +(last * 1.002).toFixed(2);
    stop = +(entry + atr * 1.0).toFixed(2);
    t1 = +(entry - atr * 1.5).toFixed(2);
    t2 = +(entry - atr * 3.0).toFixed(2);
    t3 = +(entry - atr * 5.0).toFixed(2);
  } else {
    entry = last;
    stop = +(last - atr).toFixed(2);
    t1 = +(last + atr).toFixed(2);
    t2 = +(last + atr * 2).toFixed(2);
    t3 = +(last + atr * 3).toFixed(2);
  }
  const risk = Math.abs(entry - stop);
  const reward = Math.abs(t2 - entry);
  const rr = (reward / risk).toFixed(2);
  // Position sizing — assume $50k account, 1% risk
  const acctSize = 50000;
  const riskBudget = acctSize * 0.01;
  const shares = Math.floor(riskBudget / risk);
  const positionVal = shares * entry;
  // Conviction (composite of brain weight × findings × bias strength)
  const conviction = Math.min(100, Math.round((bullScore + bearScore) * 8 * w + (Math.abs(chg) > 0.5 ? 15 : 0)));
  // Thesis
  let thesis;
  if (recent.length > 0) {
    thesis = sym + ' has ' + recent.length + ' active brain finding(s) in the last 8 hours. ' +
      (bias === 'bull' ? 'Bias is BULLISH — ' + bullScore + ' bull signal points vs ' + bearScore + ' bear. ' :
       bias === 'bear' ? 'Bias is BEARISH — ' + bearScore + ' bear signal points vs ' + bullScore + ' bull. ' :
       'Bias is MIXED — wait for resolution. ') +
      'Recent finding: "' + (recent[0].title || recent[0].type) + '". ' +
      'Brain learned weight for ' + sym + ' is ' + w.toFixed(2) + '× — ' +
      (w > 1.05 ? 'historically high signal-to-noise.' : w < 0.95 ? 'historically noisy — derate confidence.' : 'in-line track record.');
  } else {
    thesis = sym + ' has no recent brain signals. Plan is purely technical: ' +
      (chg > 0.5 ? 'momentum continuation, ride the day-trend if 9:30 open confirms.' :
       chg < -0.5 ? 'mean-revert / oversold bounce if 9:30 open shows reversal candle.' :
       'wait for break of either daily H/L with volume confirmation.');
  }

  // ML Model confidence for top finding
  let modelProb = null;
  let modelExplanation = '';
  if (recent.length > 0 && window.predictForFinding) {
    try {
      const pred = window.predictForFinding(recent[0]);
      if (pred) {
        modelProb = pred.prob;
        // Top 3 features
        const top = pred.contributions.slice().sort((a, b) => Math.abs(b.contrib) - Math.abs(a.contrib)).slice(0, 3);
        modelExplanation = top.map(c => (c.contrib >= 0 ? '+' : '') + c.feature.split('_')[0]).join(' / ');
      }
    } catch (e) {}
  }
  const modelCol = modelProb == null ? 'var(--text-muted)' : modelProb >= 0.6 ? 'var(--green)' : modelProb <= 0.4 ? 'var(--red)' : 'var(--accent)';
  const modelVerdict = modelProb == null ? '—' : modelProb >= 0.6 ? '✓ LIKELY WIN' : modelProb <= 0.4 ? '⚠ LIKELY LOSS' : '≈ COIN-FLIP';

  return `
    <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:18px;margin-bottom:20px;">
      <div>
        <div style="font-size:28px;font-weight:800;">${sym}</div>
        <div style="font-size:14px;color:var(--text-muted);">Last $${last.toFixed(2)} · <span style="color:${chg >= 0 ? 'var(--green)' : 'var(--red)'};">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:end;gap:8px;">
        <span class="dir-pill ${dirCls}">${direction}</span>
        <div style="font-size:11px;color:var(--text-muted);">Brain conviction: <strong style="color:var(--accent);">${conviction}/100</strong></div>
      </div>
    </div>

    ${modelProb != null ? `
    <div style="padding:18px;border-radius:12px;background:linear-gradient(135deg,rgba(124,58,237,0.06),transparent);border:1px solid rgba(124,58,237,0.2);margin-bottom:20px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;">
        <div>
          <div style="font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:0.5px;">🧬 ML MODEL CONFIDENCE</div>
          <div class="mono" style="font-size:36px;font-weight:800;color:${modelCol};margin-top:4px;">${(modelProb * 100).toFixed(1)}%</div>
          <div style="font-size:12px;color:${modelCol};font-weight:700;margin-top:2px;">${modelVerdict}</div>
        </div>
        <div style="flex:1;min-width:200px;max-width:400px;">
          <div style="font-size:11px;color:var(--text-muted);font-weight:700;letter-spacing:0.5px;margin-bottom:6px;">TOP DRIVERS</div>
          <div style="font-family:var(--font-mono);font-size:11px;color:var(--text-secondary);line-height:1.6;">${modelExplanation}</div>
          <div style="margin-top:8px;"><a href="model-explain.html" style="color:var(--accent);font-size:11px;">See full breakdown →</a></div>
        </div>
      </div>
    </div>
    ` : ''}

    <div class="card mb-24" style="background:linear-gradient(135deg,rgba(0,212,255,0.05),transparent);">
      <div class="card-header"><div class="card-title">📋 Thesis</div></div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">${thesis}</div>
    </div>

    <div class="grid grid-12">
      <div class="card col-7">
        <div class="card-header"><div class="card-title">🎯 Levels</div></div>
        <div class="grid grid-2" style="gap:10px;">
          <div class="plan-section"><div class="lbl">Entry</div><div class="val" style="color:var(--accent);">$${entry}</div><div class="body">Limit or stop-limit ${bias === 'bull' ? 'above the offer' : bias === 'bear' ? 'below the bid' : 'on confirmation break'}</div></div>
          <div class="plan-section"><div class="lbl">Stop Loss</div><div class="val" style="color:var(--red);">$${stop}</div><div class="body">${risk.toFixed(2)} pts risk (~1× ATR)</div></div>
          <div class="plan-section"><div class="lbl">Target 1 (1.5R)</div><div class="val" style="color:var(--green);">$${t1}</div><div class="body">Take 1/3 off here, raise stop to entry</div></div>
          <div class="plan-section"><div class="lbl">Target 2 (3R)</div><div class="val" style="color:var(--green);">$${t2}</div><div class="body">Take another 1/3 off, trail rest</div></div>
          <div class="plan-section"><div class="lbl">Target 3 (5R)</div><div class="val" style="color:var(--green);">$${t3}</div><div class="body">Trail with 1× ATR</div></div>
          <div class="plan-section"><div class="lbl">Risk / Reward</div><div class="val" style="color:${rr >= 2 ? 'var(--green)' : 'var(--yellow)'};">${rr}:1</div><div class="body">Calculated to T2 — minimum 2:1 ideal</div></div>
        </div>
      </div>
      <div class="card col-5">
        <div class="card-header"><div class="card-title">📐 Position Sizing</div></div>
        <div class="plan-section"><div class="lbl">Account assumption</div><div class="val">$${acctSize.toLocaleString()}</div><div class="body">Adjust below for your size</div></div>
        <div class="plan-section"><div class="lbl">Risk budget (1%)</div><div class="val">$${riskBudget.toLocaleString()}</div><div class="body">Per-trade risk cap</div></div>
        <div class="plan-section"><div class="lbl">Shares</div><div class="val" style="color:var(--accent);">${shares.toLocaleString()}</div><div class="body">$${positionVal.toFixed(0)} notional exposure</div></div>
      </div>
    </div>

    <div class="card mt-24">
      <div class="card-header"><div class="card-title">✅ Pre-trade Checklist</div></div>
      <div class="checklist-item"><span class="check">☐</span><span>Direction confirmed by ${bias === 'bull' ? 'rising VWAP or break of yesterday\'s high' : bias === 'bear' ? 'falling VWAP or break of yesterday\'s low' : 'volume breakout in either direction'}</span></div>
      <div class="checklist-item"><span class="check">☐</span><span>No earnings within next 3 trading days (check <a href="earnings-calendar.html" style="color:var(--accent);">earnings cal</a>)</span></div>
      <div class="checklist-item"><span class="check">☐</span><span>Macro alignment: regime supports ${bias === 'bull' ? 'long' : bias === 'bear' ? 'short' : 'either'} (check <a href="cross-asset-pulse.html" style="color:var(--accent);">pulse</a>)</span></div>
      <div class="checklist-item"><span class="check">☐</span><span>Sector aligned: ${sym}'s sector ${bias === 'bull' ? 'in Leading or Improving' : 'in Lagging or Weakening'} (check <a href="sector-flow.html" style="color:var(--accent);">sector flow</a>)</span></div>
      <div class="checklist-item"><span class="check">☐</span><span>Liquidity OK: spread &lt; 5bps, decent depth (check <a href="liquidity-health.html" style="color:var(--accent);">liquidity</a>)</span></div>
      <div class="checklist-item"><span class="check">☐</span><span>Stop is logical (not arbitrary $ — must be off a technical level or volatility threshold)</span></div>
      <div class="checklist-item"><span class="check">☐</span><span>Walk-away point set: max ${shares < 100 ? shares : 100} shares, max $${riskBudget} risk</span></div>
    </div>

    <div class="card mt-24" style="background:linear-gradient(135deg,rgba(124,58,237,0.04),transparent);">
      <div class="card-header"><div class="card-title">🔗 Drill into ${sym}</div></div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        <a class="btn btn-ghost" href="ticker.html?sym=${sym}">Ticker focus</a>
        <a class="btn btn-ghost" href="options-chain.html">Options chain</a>
        <a class="btn btn-ghost" href="technical-analysis.html">Technical</a>
        <a class="btn btn-ghost" href="kelly-sizer.html">Kelly sizer</a>
        <a class="btn btn-ghost" href="conviction-stack.html">Brain stack</a>
      </div>
    </div>
  `;
}

document.getElementById('goBtn').addEventListener('click', () => {
  const s = document.getElementById('symInput').value.toUpperCase().trim();
  if (s) document.getElementById('planOutput').innerHTML = generatePlan(s);
});
document.getElementById('symInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('goBtn').click();
});
document.querySelectorAll('.qt').forEach(el => el.addEventListener('click', () => {
  document.getElementById('symInput').value = el.dataset.s;
  document.getElementById('goBtn').click();
}));
// Auto from URL ?sym=
const params = new URLSearchParams(location.search);
const presym = params.get('sym');
if (presym) { document.getElementById('symInput').value = presym; document.getElementById('goBtn').click(); }
</script>
</body>
</html>
