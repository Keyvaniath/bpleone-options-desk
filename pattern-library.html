<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Library — bpleone / trade</title>
<meta name="description" content="Visual reference for every setup the brain tracks. Definition, example, key levels, edge.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v202">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.pattern-grid { display:grid;grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));gap:16px; }
.pattern-card { background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:all 0.15s; }
.pattern-card:hover { border-color:var(--accent);transform:translateY(-2px); }
.pattern-card h3 { font-size:16px;font-weight:700;margin-bottom:6px; }
.pattern-card .cat { display:inline-block;font-size:9px;padding:2px 8px;border-radius:10px;background:rgba(0,212,255,0.15);color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;font-weight:700; }
.pattern-card .desc { font-size:12px;color:var(--text-secondary);line-height:1.6;margin:10px 0; }
.pattern-card .stats { display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:10px;color:var(--text-muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--border); }
.pattern-card .stat-row .num { font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text-primary);display:block;margin-top:2px; }
.pattern-svg { width:100%;height:90px;margin:12px 0;background:var(--bg);border-radius:6px; }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">📚 Pattern Library</div>
      <div class="page-subtitle">Every setup the brain tracks · definition · live stats from your own trades · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <input type="text" id="search" placeholder="🔍 Search patterns..." style="padding:8px 14px;background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);border-radius:6px;font-size:12px;width:200px;">
      <select id="catFilter" class="btn btn-secondary" style="background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-primary);padding:8px 14px;">
        <option value="all">All categories</option>
        <option value="trend">Trend</option>
        <option value="reversal">Reversal</option>
        <option value="breakout">Breakout</option>
        <option value="vol">Volatility</option>
        <option value="flow">Order flow</option>
      </select>
    </div>
  </div>

  <div class="pattern-grid" id="patterns"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v202"></script>
<script src="js/ai-client.js?v=v202"></script>
<script src="js/app.js?v=v202"></script>
<script src="js/notify.js?v=v202"></script>
<script src="js/live.js?v=v202"></script>
<script>
buildNav('pattern-library');

const PATTERNS = [
  { id:'breakout', name:'Breakout above resistance', cat:'breakout', desc:'Price closes above a multi-day high with above-average volume. Bullish continuation signal.', svg:'<polyline points="0,80 20,75 40,80 60,70 80,72 100,40 120,30 140,20 160,15 180,10 200,8" fill="none" stroke="#10b981" stroke-width="2"/><line x1="0" y1="40" x2="200" y2="40" stroke="#666" stroke-dasharray="3,3"/>' },
  { id:'pullback', name:'Trend pullback to MA', cat:'trend', desc:'Strong uptrend pulls back to the 20-day or 50-day moving average. Entry on bounce.', svg:'<polyline points="0,80 30,40 60,20 80,30 100,40 120,50 140,40 160,20 180,15 200,10" fill="none" stroke="#00d4ff" stroke-width="2"/><line x1="0" y1="50" x2="200" y2="40" stroke="#a78bfa"/>' },
  { id:'rejection', name:'Resistance rejection', cat:'reversal', desc:'Multiple wicks rejecting at the same level. Watch for break of nearest support to confirm short.', svg:'<polyline points="0,60 40,30 80,28 120,30 160,40 200,60" fill="none" stroke="#ef4444" stroke-width="2"/><line x1="0" y1="30" x2="200" y2="30" stroke="#ef4444" stroke-dasharray="3,3"/>' },
  { id:'squeeze', name:'Volatility squeeze', cat:'vol', desc:'Bollinger Bands inside Keltner Channels — vol about to expand. Direction unknown until break.', svg:'<polyline points="0,30 50,40 100,45 150,40 200,30" fill="none" stroke="#a78bfa" stroke-width="1.5"/><polyline points="0,70 50,55 100,50 150,55 200,70" fill="none" stroke="#a78bfa" stroke-width="1.5"/><polyline points="0,50 200,50" fill="none" stroke="#00d4ff" stroke-width="2"/>' },
  { id:'gamma-wall', name:'Gamma wall pinning', cat:'flow', desc:'Heavy open interest at a strike causes price to magnetize near it through expiry.', svg:'<rect x="80" y="20" width="40" height="60" fill="rgba(245,158,11,0.3)"/><polyline points="0,80 30,40 60,30 90,40 120,45 150,35 180,30 200,40" fill="none" stroke="#f59e0b" stroke-width="2"/>' },
  { id:'sweep', name:'Aggressive sweep buy', cat:'flow', desc:'Multi-exchange large lot bought at offer. Smart money signaling conviction.', svg:'<line x1="0" y1="55" x2="200" y2="55" stroke="#666"/><circle cx="50" cy="55" r="4" fill="#10b981"/><circle cx="80" cy="50" r="5" fill="#10b981"/><circle cx="110" cy="45" r="7" fill="#10b981"/><circle cx="140" cy="38" r="8" fill="#10b981"/>' },
  { id:'gap-fill', name:'Gap fill', cat:'reversal', desc:'Stock gaps up/down then trades back into the prior day\'s range. High probability around 80%.', svg:'<polyline points="0,60 40,60 50,30 90,30 100,50 200,55" fill="none" stroke="#00d4ff" stroke-width="2"/><line x1="50" y1="60" x2="100" y2="60" stroke="#666" stroke-dasharray="3,3"/>' },
  { id:'opening-range', name:'Opening Range break', cat:'breakout', desc:'Break of the first 30-min high or low. Most profitable in the first hour of trading.', svg:'<rect x="0" y="40" width="40" height="20" fill="rgba(0,212,255,0.15)" stroke="#00d4ff"/><polyline points="40,50 60,40 80,30 120,25 200,20" fill="none" stroke="#10b981" stroke-width="2"/>' },
  { id:'flag', name:'Bull flag', cat:'trend', desc:'Sharp rally followed by tight sideways consolidation. Break of upper trend line continues the move.', svg:'<polyline points="0,80 40,30 80,40 120,35 160,40 200,15" fill="none" stroke="#10b981" stroke-width="2"/>' },
  { id:'h-s', name:'Head & Shoulders', cat:'reversal', desc:'Three peaks, middle highest. Neckline break confirms reversal. Target = head-neckline distance.', svg:'<polyline points="0,60 30,35 60,55 90,15 120,50 150,30 180,55 200,75" fill="none" stroke="#ef4444" stroke-width="2"/><line x1="0" y1="55" x2="200" y2="60" stroke="#ef4444" stroke-dasharray="3,3"/>' },
  { id:'double-bottom', name:'Double bottom', cat:'reversal', desc:'Two distinct lows at the same level. Break of intermediate high confirms bullish reversal.', svg:'<polyline points="0,30 40,75 80,40 120,75 160,30 200,15" fill="none" stroke="#10b981" stroke-width="2"/><line x1="40" y1="75" x2="120" y2="75" stroke="#666" stroke-dasharray="3,3"/>' },
  { id:'rsi-divergence', name:'RSI divergence', cat:'reversal', desc:'Price makes a higher high but RSI makes a lower high. Momentum is fading.', svg:'<polyline points="0,50 50,30 100,40 150,20 200,30" fill="none" stroke="#666" stroke-width="2"/><polyline points="0,70 50,40 100,55 150,50 200,60" fill="none" stroke="#ef4444" stroke-width="2"/>' },
  { id:'iv-crush', name:'IV crush short premium', cat:'vol', desc:'Sell premium pre-event (earnings, Fed) → buy back at lower IV post-event.', svg:'<polyline points="0,30 100,30 100,60 200,60" fill="none" stroke="#f59e0b" stroke-width="2"/><line x1="100" y1="0" x2="100" y2="90" stroke="#a78bfa" stroke-dasharray="3,3"/>' },
  { id:'vwap-reclaim', name:'VWAP reclaim', cat:'trend', desc:'Price falls below VWAP, retests from below, then closes back above. Trend resuming long.', svg:'<polyline points="0,40 40,30 80,55 100,55 120,45 200,25" fill="none" stroke="#00d4ff" stroke-width="2"/><line x1="0" y1="50" x2="200" y2="40" stroke="#a78bfa" stroke-width="1.5"/>' },
  { id:'dark-pool-print', name:'Dark pool block print', cat:'flow', desc:'A large dark pool print on the tape often signals institutional positioning.', svg:'<line x1="0" y1="55" x2="200" y2="55" stroke="#666"/><rect x="80" y="40" width="50" height="30" fill="rgba(0,212,255,0.3)" stroke="#00d4ff"/>' },
  { id:'mean-revert', name:'Mean reversion (2σ)', cat:'reversal', desc:'Price 2+ standard deviations below mean with no fundamental driver. Buy-the-dip candidate.', svg:'<polyline points="0,40 50,40 100,75 150,40 200,40" fill="none" stroke="#10b981" stroke-width="2"/><line x1="0" y1="40" x2="200" y2="40" stroke="#666" stroke-dasharray="3,3"/>' }
];

function loadTrain() { try { return JSON.parse(localStorage.getItem('bpleone_train_v1') || '[]'); } catch(e) { return []; } }

function statsFor(setupId) {
  const matches = loadTrain().filter(t => (t.meta?.setup || '').toLowerCase().includes(setupId.toLowerCase()));
  const n = matches.length;
  const w = matches.filter(t => t.y === 1).length;
  const r = matches.reduce((a, t) => a + (t.y === 1 ? (t.r || 1.5) : -1.0), 0);
  return { n, hitRate: n > 0 ? w/n : null, expectancy: n > 0 ? r/n : null };
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  let arr = PATTERNS.filter(p => cat === 'all' || p.cat === cat);
  if (q) arr = arr.filter(p => p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));

  document.getElementById('patterns').innerHTML = arr.map(p => {
    const s = statsFor(p.id);
    return '<div class="pattern-card" onclick="window.location.href=\'cohort-analysis.html\'">'
      + '<div class="cat">' + p.cat + '</div>'
      + '<h3>' + p.name + '</h3>'
      + '<svg class="pattern-svg" viewBox="0 0 200 90" preserveAspectRatio="none">' + p.svg + '</svg>'
      + '<div class="desc">' + p.desc + '</div>'
      + '<div class="stats">'
        + '<div class="stat-row">Trades<span class="num">' + s.n + '</span></div>'
        + '<div class="stat-row">Hit %<span class="num" style="color:' + (s.hitRate >= 0.55 ? 'var(--green)' : s.hitRate >= 0.45 ? 'var(--text-primary)' : s.hitRate != null ? 'var(--red)' : 'var(--text-muted)') + ';">' + (s.hitRate != null ? (s.hitRate*100).toFixed(0) + '%' : '—') + '</span></div>'
        + '<div class="stat-row">Exp R<span class="num" style="color:' + (s.expectancy > 0 ? 'var(--green)' : s.expectancy != null ? 'var(--red)' : 'var(--text-muted)') + ';">' + (s.expectancy != null ? (s.expectancy >= 0 ? '+' : '') + s.expectancy.toFixed(2) : '—') + '</span></div>'
      + '</div>'
    + '</div>';
  }).join('') || '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted);">No patterns match.</div>';
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('catFilter').addEventListener('change', render);
render();
</script>
</body>
</html>
