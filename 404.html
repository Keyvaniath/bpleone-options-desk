<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — bpleone / trade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v185">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.nf-wrap { min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.nf-card { max-width: 720px; width: 100%; text-align: center; padding: 50px 40px; background: var(--bg-elevated); border-radius: 16px; border: 1px solid var(--border); }
.nf-big { font-family: var(--font-mono); font-size: 120px; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--accent) 0%, var(--red) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 14px; }
.nf-quote { font-size: 14px; color: var(--text-muted); line-height: 1.7; margin: 20px 0 30px; padding: 14px 18px; background: var(--bg-secondary); border-radius: 10px; font-style: italic; }
.quick-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 24px; }
.quick-grid a { padding: 12px; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); text-decoration: none; transition: border-color 0.15s; }
.quick-grid a:hover { border-color: var(--accent); }
.quick-grid a .icon { font-size: 22px; }
.quick-grid a .name { font-size: 12px; margin-top: 4px; font-weight: 600; }
.search-box { display: flex; gap: 8px; max-width: 380px; margin: 24px auto 0; }
.search-box input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-primary); padding: 10px 14px; border-radius: 8px; font-family: inherit; font-size: 14px; }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="nf-wrap">
  <div class="nf-card">
    <div class="nf-big">404</div>
    <h1 style="margin:0 0 8px;font-size:24px;">This trade didn't fill</h1>
    <div style="color:var(--text-muted);font-size:14px;">The URL you hit doesn't exist on this desk.</div>

    <div class="nf-quote">"The market is a device for transferring money from the impatient to the patient." <span style="opacity:0.6;">— Warren Buffett</span></div>

    <div style="margin-top:30px;">
      <a href="dashboard.html" class="btn btn-primary btn-lg">← Back to Dashboard</a>
      <button onclick="if (window.CmdPalette) CmdPalette.open(); else alert('Type a page name below.')" class="btn btn-ghost btn-lg" style="margin-left:8px;">⌘K Search</button>
    </div>

    <div class="quick-grid">
      <a href="game-plan.html"><div class="icon">📋</div><div class="name">Game Plan</div></a>
      <a href="plays.html"><div class="icon">⭐</div><div class="name">Plays</div></a>
      <a href="trade-of-the-day.html"><div class="icon">🎯</div><div class="name">Trade of the Day</div></a>
      <a href="hot-movers.html"><div class="icon">🔥</div><div class="name">Hot Movers</div></a>
      <a href="ticker.html"><div class="icon">🔍</div><div class="name">Ticker Focus</div></a>
      <a href="settings.html"><div class="icon">⚙</div><div class="name">Settings</div></a>
    </div>

    <div class="search-box">
      <input id="nfSearch" placeholder="Or enter a symbol (e.g. NVDA) →" autocomplete="off" style="text-transform:uppercase;">
      <button class="btn btn-primary" onclick="const v=document.getElementById('nfSearch').value.trim().toUpperCase();if(v)location.href='ticker.html?sym='+v;">Go</button>
    </div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v185"></script>
<script src="js/ai-client.js?v=v185"></script>
<script src="js/app.js?v=v185"></script>
<script src="js/notify.js?v=v185"></script>
<script src="js/live.js?v=v185"></script>
<script>
buildNav('');
document.getElementById('nfSearch').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const v = e.target.value.trim().toUpperCase();
    if (v) location.href = 'ticker.html?sym=' + v;
  }
});
</script>
</body>
</html>
