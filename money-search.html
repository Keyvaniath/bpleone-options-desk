function render(query) {
  const q = (query || '').toLowerCase().trim();
  const filtered = q ? PAGES.filter(p => {
    const blob = (p.title + ' ' + p.desc + ' ' + p.tags + ' ' + p.cat).toLowerCase();
    return blob.indexOf(q) !== -1;
  }) : PAGES;
  const out = document.getElementById('results');
  if (filtered.length === 0) {
    out.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:32px;">No matches for "' + q + '".</div>';
    return;
  }
  // Group by category
  const byCat = {};
  filtered.forEach(p => { if (!byCat[p.cat]) byCat[p.cat] = []; byCat[p.cat].push(p); });
  const order = ['Money', 'Analysis', 'Risk', 'Data', 'Notifications', 'Tools'];
  let html = '';
  for (const cat of order) {
    if (!byCat[cat]) continue;
    html += '<div class="section-head">' + cat + '</div>';
    html += byCat[cat].map(p =>
      '<a href="' + p.url + '" class="result"><div class="left"><div class="title">' + p.title + '</div><div class="desc">' + p.desc + '</div></div><div class="right">' + p.url.replace('.html', '') + '</div></a>'
    ).join('');
  }
  out.innerHTML = html;
}

document.getElementById('search').addEventListener('input', e => render(e.target.value));
render('');
