<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Coach (Live) — bpleone / brain</title>
<meta name="description" content="Plain-English read of every brain module's current state. One paragraph you can act on.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v187">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.head-card { padding:48px;border-radius:20px;text-align:center;background:var(--bg-elevated);border:2px solid var(--border); }
.head-card .health { font-family:var(--font-mono);font-size:120px;font-weight:900;line-height:0.9; }
.head-card .headline { font-size:24px;font-weight:800;margin-top:18px;letter-spacing:1px; }
.head-card .counts { font-size:13px;color:var(--text-muted);margin-top:14px;font-family:var(--font-mono); }
.line { display:flex;gap:14px;align-items:flex-start;padding:14px;background:var(--bg-elevated);border-radius:10px;margin-bottom:8px; }
.line .icon { font-size:20px;line-height:1;width:24px;text-align:center; }
.line .text { flex:1;font-size:14px;line-height:1.6; }
.line.good { border-left:3px solid var(--green); }
.line.warn { border-left:3px solid var(--yellow); }
.line.alert { border-left:3px solid var(--red); }
.line.idle { border-left:3px solid var(--text-muted); }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🧑‍🏫 Brain Coach</div>
      <div class="page-subtitle">Plain-English read of every diagnostic · what's working · what's not · what to do</div>
    </div>
  </div>

  <div id="head-card" class="mb-24"></div>

  <div class="card mb-24">
    <div class="card-header"><div class="card-title">📋 Diagnosis (what the brain is doing right now)</div></div>
    <div id="diagnosis-list"></div>
  </div>

  <div class="card">
    <div class="card-header"><div class="card-title">💡 Advice (what to do)</div></div>
    <div id="advice-list"></div>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v187"></script>
<script src="js/ai-client.js?v=v187"></script>
<script src="js/app.js?v=v187"></script>
<script src="js/notify.js?v=v187"></script>
<script src="js/live.js?v=v187"></script>
<script src="js/brain-coach.js?v=v187"></script>
<script>
buildNav('brain-coach-live');

function render() {
  const s = BrainCoach.summary();

  document.getElementById('head-card').innerHTML = '<div class="head-card" style="background:linear-gradient(135deg,' + s.headlineColor + '22,' + s.headlineColor + '04);border-color:' + s.headlineColor + '99;">'
    + '<div class="health" style="color:' + s.headlineColor + ';">' + s.healthScore + '</div>'
    + '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:14px;">Brain health score</div>'
    + '<div class="headline" style="color:' + s.headlineColor + ';">' + s.headline + '</div>'
    + '<div class="counts">' + s.totalChecks + ' diagnostic checks · ' + s.warnCount + ' warnings · ' + s.alertCount + ' alerts</div>'
    + '</div>';

  const dx = document.getElementById('diagnosis-list');
  if (s.diagnosis.length === 0) {
    dx.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No diagnostic data yet. Brain warming up.</div>';
  } else {
    dx.innerHTML = s.diagnosis.map(d => '<div class="line ' + d.kind + '"><div class="icon">' + d.icon + '</div><div class="text">' + d.text + '</div></div>').join('');
  }

  const adv = document.getElementById('advice-list');
  if (s.advice.length === 0) {
    adv.innerHTML = '<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:13px;">No advice yet.</div>';
  } else {
    adv.innerHTML = s.advice.map(a => '<div class="line good"><div class="icon">' + a.icon + '</div><div class="text">' + a.text + '</div></div>').join('');
  }
}

render();
setInterval(render, 12000);
window.addEventListener('bpleone:continuous-cycle', render);
</script>
</body>
</html>
