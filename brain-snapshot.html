<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Snapshot — bpleone / trade</title>
<meta name="description" content="Print/save/share a single-page snapshot of the brain's current state. Grade, picks, stats, and analysis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=v239">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.snapshot { background:var(--bg-elevated);border-radius:14px;padding:38px;border:1px solid var(--border); }
.snap-header { display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:20px;border-bottom:2px solid var(--accent); }
.snap-header h1 { font-size:32px;font-weight:800;letter-spacing:-0.5px; }
.snap-header .meta { font-size:12px;color:var(--text-muted);font-family:var(--font-mono);text-align:right; }
.snap-grid { display:grid;grid-template-columns:repeat(4, 1fr);gap:18px;margin:24px 0; }
.snap-stat { padding:18px;background:var(--bg);border-radius:10px;text-align:center; }
.snap-stat .lbl { font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted); }
.snap-stat .val { font-family:var(--font-mono);font-size:28px;font-weight:800;margin-top:6px; }
.snap-section { margin-top:24px; }
.snap-section h3 { font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--accent);margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border); }
.snap-row { display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px; }
.snap-row:last-child { border:none; }
.grade-big { font-family:var(--font-mono);font-size:80px;font-weight:800;line-height:1; }
@media print {
  body * { visibility:hidden; }
  .snapshot, .snapshot * { visibility:visible; }
  .snapshot { position:absolute;top:0;left:0;padding:20px;background:white;color:#111;border:none; }
  .snapshot .snap-stat { background:#f3f4f6; }
}
</style>
  <link rel="canonical" href="https://options.bpleone.com/brain-snapshot.html">
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">📸 Brain Snapshot</div>
      <div class="page-subtitle">Single-page status capture · print-ready · shareable · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-ghost" id="printBtn">🖨 Print / PDF</button>
      <button class="btn btn-ghost" id="copyBtn">📋 Copy as text</button>
      <button class="btn btn-primary" id="saveBtn">💾 Save HTML</button>
    </div>
  </div>

  <div id="snap" class="snapshot"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v239"></script>
<script src="js/ai-client.js?v=v239"></script>
<script src="js/app.js?v=v239"></script>
<script src="js/notify.js?v=v239"></script>
<script src="js/live.js?v=v239"></script>
<script src="js/train-rows.js?v=v239"></script>
<script src="js/no-play-gate.js?v=v239" defer></script>
<script src="js/model.js?v=v239"></script>
<script>
buildNav('brain-snapshot');

function loadFindings() { try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch(e) { return []; } }
function loadTrain() { return window.TrainRows ? TrainRows.load() : []; }   // pass 344: graded calls (js/train-rows.js); 'bpleone_train_v1' was never written
function loadModel() { try { return JSON.parse(localStorage.getItem('bpleone_model_v1') || 'null'); } catch(e) { return null; } }

function render() {
  const findings = loadFindings();
  const train = loadTrain();
  const model = loadModel();
  const now = Date.now();
  // Pass 344: graded against the drift rate (pass 299), not A-F at 50/60/70%; no assumed +1.5R per win.
  const esc = TrainRows.esc;
  const etNow = new Date().toLocaleString('en-US', { timeZone: 'America/New_York' }) + ' ET';
  const g = TrainRows.grade(train);
  const grade = g.enough ? (g.skillPp >= 0 ? '+' : '') + g.skillPp.toFixed(1) + ' pp' : '—';
  const gradeCol = !g.enough ? 'var(--text-muted)' : g.skillPp > 0 ? '#10b981' : '#ef4444';
  const withPnl = train.filter(t => typeof t.pnl === 'number');
  const avgPnl = withPnl.length ? withPnl.reduce((a, t) => a + t.pnl, 0) / withPnl.length : null;
  const gradeLine = !g.n ? TrainRows.EMPTY_HTML
    : esc(g.text) + (avgPnl != null ? ' · avg ' + (avgPnl >= 0 ? '+' : '') + avgPnl.toFixed(2) + '% per call in the called direction' : '');

  // Top picks
  const today0 = new Date(); today0.setHours(0,0,0,0);
  const todayFind = findings.filter(f => f.ts >= today0.getTime() && f.meta && f.meta.sym);
  const ranked = todayFind.map(f => {
    let prob = null; try { if (window.predictForFinding) { const p = window.predictForFinding(f); prob = p ? p.prob : null; } } catch(e) {}
    return { ...f, prob };
  }).filter(f => f.prob != null).sort((a,b) => b.prob - a.prob).slice(0, 5);

  // Best symbols
  const bySym = {};
  train.forEach(t => {
    const s = t.meta?.sym; if (!s || typeof t.pnl !== 'number') return;
    if (!bySym[s]) bySym[s] = { sym:s, n:0, w:0, p:0 };
    bySym[s].n++; bySym[s].p += t.pnl;
    if (t.y === 1) bySym[s].w++;
  });
  const bestSyms = Object.values(bySym).filter(s => s.n >= 5 && s.p > 0).sort((a,b) => (b.p/b.n) - (a.p/a.n)).slice(0, 5);

  const html = '<div class="snap-header">'
    + '<div><h1>🧠 BPLEONE BRAIN</h1><div style="font-size:12px;color:var(--text-muted);margin-top:6px;">This browser\'s model, graded on its own 5-day calls</div></div>'
    + '<div class="meta">Generated<br>' + etNow + '<br>Model: ' + esc(model?.version || 'v1') + '</div>'
    + '</div>'
    + '<div style="text-align:center;margin:30px 0;">'
      + '<div style="font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">Skill vs market drift</div>'
      + '<div class="grade-big" style="color:' + gradeCol + ';">' + grade + '</div>'
      + '<div style="font-size:13px;color:var(--text-secondary);margin-top:8px;">' + gradeLine + '</div>'
    + '</div>'
    + '<div class="snap-grid">'
      + '<div class="snap-stat"><div class="lbl">Total signals</div><div class="val">' + findings.length + '</div></div>'
      + '<div class="snap-stat"><div class="lbl">Today signals</div><div class="val" style="color:var(--accent);">' + todayFind.length + '</div></div>'
      + '<div class="snap-stat"><div class="lbl">Graded calls</div><div class="val">' + train.length + '</div></div>'
      + '<div class="snap-stat"><div class="lbl">Browser model ≥70% (raw)</div><div class="val" style="color:' + (ranked.filter(r => r.prob >= 0.7).length > 0 ? 'var(--green)' : 'var(--text-muted)') + ';">' + ranked.filter(r => r.prob >= 0.7).length + '</div></div>'
    + '</div>'
    + '<div class="snap-section">'
      + '<h3>🎯 Top browser-model findings today (raw, not picks)</h3>'
      + (ranked.length === 0 ? '<div style="font-size:12px;color:var(--text-muted);padding:14px 0;">No symbol finding scored today in this browser.</div>' :
         ranked.map((r, i) => '<div class="snap-row"><div><strong>' + (i+1) + '. ' + esc(r.meta.sym) + '</strong> · <span style="color:var(--text-muted);">' + esc(r.meta.setup || 'signal') + '</span></div><div style="font-family:var(--font-mono);color:' + (r.prob >= 0.7 ? 'var(--green)' : 'var(--accent)') + ';font-weight:700;">' + (r.prob*100).toFixed(0) + '%</div></div>').join(''))
    + '</div>'
    + '<div class="snap-section">'
      + '<h3>🏆 Best symbols (5+ graded calls)</h3>'
      + (bestSyms.length === 0 ? '<div style="font-size:12px;color:var(--text-muted);padding:14px 0;">No symbol has 5+ graded calls with a positive average yet.</div>' :
         bestSyms.map((s, i) => '<div class="snap-row"><div><strong>' + (i+1) + '. ' + esc(s.sym) + '</strong> · <span style="color:var(--text-muted);">' + s.w + '/' + s.n + ' right</span></div><div style="font-family:var(--font-mono);color:var(--green);">+' + (s.p/s.n).toFixed(2) + '% per call</div></div>').join(''))
    + '</div>'
    + '<div class="snap-section">'
      + '<h3>📊 Health</h3>'
      + '<div class="snap-row"><div>Browser model</div><div style="font-family:var(--font-mono);">' + (model ? 'v' + esc(model.version || 1) + ' · ' + (model.n_trained || 0) + ' examples' : 'untrained') + '</div></div>'
      + '<div class="snap-row"><div>Desk\'s live record</div><div><a href="edge-scorecard.html" style="color:var(--accent);">Edge Scorecard</a></div></div>'
      + '<div class="snap-row"><div>Auto-seed</div><div style="font-family:var(--font-mono);color:' + (localStorage.getItem('bpleone_model_autoseeded_v1') ? 'var(--green)' : 'var(--text-muted)') + ';">' + (localStorage.getItem('bpleone_model_autoseeded_v1') ? '✓ Active' : '○ Not seeded') + '</div></div>'
      + '<div class="snap-row"><div>Notifications</div><div style="font-family:var(--font-mono);color:' + (('Notification' in window && Notification.permission === 'granted') ? 'var(--green)' : 'var(--text-muted)') + ';">' + (('Notification' in window && Notification.permission === 'granted') ? '✓ Enabled' : '○ Off') + '</div></div>'
    + '</div>'
    + '<div style="margin-top:30px;padding-top:20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-muted);text-align:center;">'
      + 'Snapshot of this browser\'s model on options.bpleone.com at ' + etNow + '. Not advice; the browser model has no proven edge over market drift.'
    + '</div>';

  document.getElementById('snap').innerHTML = html;
}
render();

document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('copyBtn').addEventListener('click', () => {
  const el = document.getElementById('snap');
  const text = el.innerText;
  navigator.clipboard.writeText(text).then(() => {
    document.getElementById('copyBtn').textContent = '✓ Copied!';
    setTimeout(() => { document.getElementById('copyBtn').textContent = '📋 Copy as text'; }, 1500);
  });
});
document.getElementById('saveBtn').addEventListener('click', () => {
  const html = document.documentElement.outerHTML;
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'brain-snapshot-' + new Date().toISOString().slice(0,10) + '.html';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
