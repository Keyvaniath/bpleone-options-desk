// ============================================================
// 8-factor TOTD scoring methodology — see methodology.html
// Every factor returns { score: 0-10, value: <raw>, band: <label> }
// Sum × tier mapping = final TOTD pick.
// ============================================================

const UNIVERSE = ['SPY','QQQ','IWM','DIA','AAPL','NVDA','TSLA','MSFT','META','AMZN','GOOGL','AMD','PLTR','SMCI','COIN','BABA','SHOP','CRM','UBER','XLE','GLD','SLV'];
const NAMES = {
  SPY:'S&P 500 ETF', QQQ:'Nasdaq 100 ETF', IWM:'Russell 2000 ETF', DIA:'Dow Jones ETF',
  AAPL:'Apple', NVDA:'NVIDIA', TSLA:'Tesla', MSFT:'Microsoft', META:'Meta Platforms',
  AMZN:'Amazon', GOOGL:'Alphabet', AMD:'AMD', PLTR:'Palantir', SMCI:'Super Micro',
  COIN:'Coinbase', BABA:'Alibaba', SHOP:'Shopify', CRM:'Salesforce', UBER:'Uber',
  XLE:'Energy Sector ETF', GLD:'Gold ETF', SLV:'Silver ETF'
};

// ---------- Vetoes (any one = skip) ----------
// CRITICAL: also vetoes any symbol whose price didn't come from a real source
// within the last 5 minutes. Stale seed values are never scored.
function vetoCheck(sym, q) {
  if (!q) return 'no-quote';
  if (window.BPLEONE_DATA_MODE !== 'live') return 'mock-data';
  // The real-data integrity check: priceSource must be a live provider AND
  // we must have received an update within the last 5 minutes.
  if (!q.priceSource || q.priceSource === 'stale-seed' || q.priceSource === 'mock') return 'stale-price';
  if (!q.liveAt || (Date.now() - q.liveAt) > 5 * 60 * 1000) return 'price-too-old';
  if (q.last < 5) return 'penny';
  if (Math.abs(q.changePct) > 5) return 'wild-gap';
  if ((q.volume || 0) < 1e6 && !sym.match(/^(SPY|QQQ|IWM|DIA|GLD|SLV|XLE)$/)) return 'low-liquidity';
  return null;
}

// ---------- Factor 1: Liquidity ----------
function scoreLiquidity(q) {
  const ratio = (q.volume || 0) / Math.max(1, q.avgVolume || q.volume / 1.1 || 1e7);
  let s = 0;
  if (ratio >= 1.5 && ratio <= 3.0) s = 10;
  else if (ratio >= 1.0 && ratio < 1.5) s = 7;
  else if (ratio >= 0.7 && ratio < 1.0) s = 4;
  else if (ratio > 3.0 && ratio <= 5.0) s = 6;
  return { score: s, value: ratio.toFixed(2) + 'x', band: ratio.toFixed(2) + 'x avg vol' };
}

// ---------- Factor 2: Trend strength ----------
// Without real bar history we approximate using prevClose + change as proxy MAs.
// Real Finnhub/Polygon plumbing would feed MA20/MA50.
function scoreTrend(q) {
  // Proxy: today's close vs prevClose * 1.0 (5-day) and prevClose * 0.95-1.05 (20-day)
  const ma5  = q.prevClose;
  const ma20 = q.prevClose * (1 + (q.changePct || 0) / 100 / 4);  // tiny lookback proxy
  const aboveMa5  = q.last >= ma5;
  const aboveMa20 = q.last >= ma20;
  const ma5GtMa20 = ma5 >= ma20;
  let s = 4;
  if (aboveMa5 && aboveMa20 && ma5GtMa20) s = 10;
  else if (!aboveMa5 && !aboveMa20 && !ma5GtMa20) s = 10;  // clean bear trend
  else if (aboveMa5 === aboveMa20) s = 7;
  return { score: s, value: (aboveMa5 ? '↑' : '↓') + ' vs MAs', band: 'price ' + (aboveMa5 ? 'above' : 'below') + ' short MA' };
}

// ---------- Factor 3: Momentum ----------
function scoreMomentum(q) {
  const pct = q.changePct || 0;
  // Without 5d history, score based on today's strength.
  // Real plumbing would compute 5d return.
  let s = 0;
  const absMove = Math.abs(pct);
  if (absMove >= 2.0 && absMove <= 4.5) s = 10;
  else if (absMove >= 1.0 && absMove < 2.0) s = 7;
  else if (absMove >= 0.5 && absMove < 1.0) s = 4;
  else if (absMove < 0.3) s = 2;
  else if (absMove > 4.5) s = 5;  // could be panic
  return { score: s, value: (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%', band: pct >= 0 ? 'bullish day' : 'bearish day' };
}

// ---------- Factor 4: Volatility quality ----------
function scoreVolatility(q) {
  // Approximate ATR% via day range or change magnitude
  const range = (q.dayHigh && q.dayLow) ? ((q.dayHigh - q.dayLow) / q.last * 100) : Math.abs(q.changePct || 0);
  let s = 0;
  if (range >= 1.5 && range <= 3.5) s = 10;
  else if ((range >= 1.0 && range < 1.5) || (range > 3.5 && range <= 5.0)) s = 7;
  else if ((range >= 0.5 && range < 1.0) || (range > 5.0 && range <= 7.0)) s = 4;
  return { score: s, value: range.toFixed(2) + '%', band: 'day range ' + range.toFixed(1) + '%' };
}

// ---------- Factor 5: Setup clarity ----------
function scoreSetupClarity(q) {
  // Distance from round numbers + prior close
  const last = q.last;
  const round100 = Math.round(last / 100) * 100;
  const round10  = Math.round(last / 10) * 10;
  const round5   = Math.round(last / 5) * 5;
  const distRound = Math.min(
    Math.abs(last - round100) / last,
    Math.abs(last - round10) / last,
    Math.abs(last - round5) / last
  );
  const pctFromPrev = Math.abs((last - q.prevClose) / q.prevClose);
  // Near a round number OR near prior close = clear level
  let s = 0;
  if (distRound < 0.005) s = 10;
  else if (distRound < 0.015) s = 7;
  else if (distRound < 0.03) s = 4;
  if (pctFromPrev < 0.005) s = Math.max(s, 7);  // near prior close — chop, but a level
  return { score: s, value: (distRound * 100).toFixed(2) + '% from level', band: distRound < 0.015 ? 'near key level' : 'mid-range' };
}

// ---------- Factor 6: Risk/Reward ----------
function scoreRR(q) {
  // Stop = 1.5% beyond entry direction; Target = next round number or 3% (whichever first)
  const last = q.last;
  const dir = (q.changePct || 0) >= 0 ? 1 : -1;
  const stop = last - dir * (last * 0.015);
  // Next round-number target
  const nextRound = dir > 0 ? Math.ceil(last / 10) * 10 : Math.floor(last / 10) * 10;
  const target = nextRound === last ? last + dir * last * 0.03 : nextRound;
  const risk = Math.abs(last - stop);
  const reward = Math.abs(target - last);
  const rr = reward / Math.max(0.01, risk);
  let s = 0;
  if (rr >= 2.5) s = 10;
  else if (rr >= 2.0) s = 7;
  else if (rr >= 1.5) s = 4;
  return { score: s, value: rr.toFixed(2) + ':1', band: 'R:R ' + rr.toFixed(2) + ':1', stop, target, risk, reward };
}

// ---------- Factor 7: Catalyst neutrality ----------
function scoreCatalyst(q) {
  // No earnings feed wired — default to neutral.
  // Would map to a real earnings-date check when Finnhub /earnings is connected.
  return { score: 7, value: 'no feed', band: 'neutral (no calendar feed)' };
}

// ---------- Factor 8: ML overlay ----------
function scoreML(sym, q) {
  let trainCount = 0, liveCount = 0;
  try {
    const train = JSON.parse(localStorage.getItem('bpleone_train_v1') || '[]');
    trainCount = train.length;
    liveCount = train.filter(t => (t.meta && t.meta.dataSource) === 'live' || t.dataSource === 'live').length;
  } catch(e) {}
  if (liveCount < 20) return { score: 5, value: 'untrained', band: 'neutral — needs ' + (20 - liveCount) + ' more live trades' };
  // Try to compute a model prediction
  try {
    if (window.predictForFinding) {
      const fakeFinding = { meta: { sym, setup: 'totd' }, x: [q.changePct/10, q.last/1000, q.volume/1e8] };
      const p = window.predictForFinding(fakeFinding);
      if (p && p.prob != null) {
        let s = 0;
        if (p.prob >= 0.7) s = 10;
        else if (p.prob >= 0.6) s = 7;
        else if (p.prob >= 0.5) s = 4;
        else s = 0;
        return { score: s, value: (p.prob * 100).toFixed(0) + '%', band: 'model conf ' + (p.prob * 100).toFixed(0) + '%' };
      }
    }
  } catch(e) {}
  return { score: 5, value: 'neutral', band: 'neutral — no prediction' };
}

// ---------- Compose final score ----------
function scoreSymbol(sym, q) {
  const veto = vetoCheck(sym, q);
  if (veto) return { sym, veto, total: 0 };
  const factors = {
    liquidity: scoreLiquidity(q),
    trend: scoreTrend(q),
    momentum: scoreMomentum(q),
    volatility: scoreVolatility(q),
    clarity: scoreSetupClarity(q),
    rr: scoreRR(q),
    catalyst: scoreCatalyst(q),
    ml: scoreML(sym, q)
  };
  const total = Object.values(factors).reduce((a, f) => a + f.score, 0);
  const tier = total >= 64 ? 'A' : total >= 56 ? 'B' : total >= 48 ? 'C' : 'F';
  return { sym, factors, total, tier };
}

function rankAll() {
  if (typeof QUOTES === 'undefined') return [];
  return UNIVERSE.map(sym => scoreSymbol(sym, QUOTES[sym]))
    .filter(s => !s.veto)
    .sort((a, b) => b.total - a.total);
}

// ---------- Rendering ----------
function render() {
  document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
  const wrap = document.getElementById('content');

  // How many symbols have we received real prices for?
  const liveSymCount = typeof QUOTES === 'undefined' ? 0 : Object.values(QUOTES).filter(q => q.priceSource && q.priceSource !== 'stale-seed' && q.priceSource !== 'mock' && q.liveAt && (Date.now() - q.liveAt) < 5*60*1000).length;

  // Refuse to render when in mock mode OR no symbol has fresh real data
  if (window.BPLEONE_DATA_MODE !== 'live' || liveSymCount === 0) {
    const stooqStatus = (typeof DataProvider !== 'undefined' && DataProvider.getStooqStatus) ? DataProvider.getStooqStatus() : null;
    const polling = stooqStatus && stooqStatus.polling;
    wrap.innerHTML = '<div class="no-pick">'
      + '<h2>🛑 No TOTD pick — waiting for real data</h2>'
      + '<p>The Trade of the Day refuses to publish a pick on stale or simulated prices. Right now <strong>' + liveSymCount + ' / ' + UNIVERSE.length + '</strong> symbols have fresh prices from a real source.</p>'
      + (polling
          ? '<p style="color:var(--accent);">Stooq fallback is polling every 12s. If your network can reach stooq.com (no CORS issues), prices should arrive within ~15 seconds. If the count stays at 0, Stooq is being blocked — wire Finnhub free instead.</p>'
          : '<p style="color:var(--red);">Stooq fallback is not running. Open Data Truth audit to check status.</p>')
      + '<div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">'
        + '<a href="data-truth.html" class="btn btn-primary">🔍 Data Truth audit</a>'
        + '<a href="live-data-setup.html" class="btn btn-ghost">📡 Setup Finnhub free (30s)</a>'
      + '</div>'
      + '<p style="margin-top:24px;font-size:11px;color:var(--text-muted);">Page auto-refreshes every 5 seconds. Once any real provider returns prices, this clears automatically.</p>'
      + '</div>';
    return;
  }

  // Rank everything
  const ranked = rankAll();
  if (!ranked.length) {
    wrap.innerHTML = '<div class="no-pick"><h2>No qualifying setup today</h2><p>Every symbol in the universe failed a hard veto or scored below 48/80. ' + liveSymCount + ' symbols had fresh real data but none crossed the 48-point threshold. Better to sit out than chase.</p></div>';
    return;
  }
  const top = ranked[0];
  if (top.total < 48) {
    wrap.innerHTML = '<div class="no-pick">'
      + '<h2>No qualifying setup today</h2>'
      + '<p>Top-scoring symbol is <strong>' + top.sym + '</strong> at <strong>' + top.total + '/80</strong> — below the 48-point threshold. The desk is sitting out today.</p>'
      + '<p style="margin-top:14px;font-size:12px;">Conditions can change intraday. This page refreshes every 5 seconds.</p>'
      + '</div>';
    return;
  }

  // Render the pick
  const q = QUOTES[top.sym];
  const tier = top.tier;
  const tierCls = tier === 'A' ? 'grade-a' : tier === 'B' ? 'grade-b' : 'grade-c';
  const changeCol = q.changePct >= 0 ? 'var(--green)' : 'var(--red)';
  const factorRow = (f, label) => {
    const cls = f.score >= 9 ? 'full' : f.score >= 6 ? 'high' : f.score >= 3 ? 'mid' : 'low';
    return '<div class="factor-tile ' + cls + '">'
      + '<div><div class="label">' + label + '</div><div class="detail">' + f.band + '</div></div>'
      + '<div class="pts" style="color:' + (f.score >= 7 ? 'var(--green)' : f.score >= 4 ? 'var(--yellow)' : 'var(--red)') + ';">' + f.score + '<span style="font-size:12px;color:var(--text-muted);font-weight:400;">/10</span></div>'
      + '</div>';
  };

  const freshSec = Math.floor((Date.now() - (q.liveAt || 0)) / 1000);
  const sourceLbl = q.priceSource || 'unknown';
  const sourceCol = freshSec < 30 ? 'var(--green)' : freshSec < 120 ? 'var(--accent)' : 'var(--yellow)';
  let html = '<div class="pick-hero">'
    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:24px;">'
      + '<div>'
        + '<div class="sym-big">' + top.sym + '</div>'
        + '<div class="name">' + (NAMES[top.sym] || top.sym) + '</div>'
        + '<div class="price">$' + q.last.toFixed(2) + '</div>'
        + '<div class="change" style="color:' + changeCol + ';">' + (q.change >= 0 ? '+' : '') + q.change.toFixed(2) + ' (' + (q.changePct >= 0 ? '+' : '') + q.changePct.toFixed(2) + '%)</div>'
        + '<div style="margin-top:8px;font-size:11px;color:' + sourceCol + ';font-family:var(--font-mono);">● source: ' + sourceLbl + ' · last update ' + freshSec + 's ago</div>'
      + '</div>'
      + '<div style="text-align:right;">'
        + '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">Tier ' + tier + ' setup</div>'
        + '<div class="grade-pill ' + tierCls + '">' + top.total + ' / 80</div>'
        + '<div style="margin-top:14px;font-size:11px;color:var(--text-muted);">' + ranked.length + ' symbols scored · #1 by methodology</div>'
      + '</div>'
    + '</div>'
    + '</div>';

  // 8 factors
  html += '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin-bottom:10px;">📊 The 8 factors (each scored against live data)</div>';
  html += '<div class="score-grid">'
    + factorRow(top.factors.liquidity, '1. Liquidity')
    + factorRow(top.factors.trend, '2. Trend strength')
    + factorRow(top.factors.momentum, '3. Momentum')
    + factorRow(top.factors.volatility, '4. Volatility quality')
    + factorRow(top.factors.clarity, '5. Setup clarity')
    + factorRow(top.factors.rr, '6. Risk/Reward')
    + factorRow(top.factors.catalyst, '7. Catalyst neutrality')
    + factorRow(top.factors.ml, '8. ML overlay')
    + '</div>';

  // Plan
  const rr = top.factors.rr;
  html += '<div class="plan-block">'
    + '<h4>📋 Plan (auto-computed)</h4>'
    + '<div class="levels">'
      + '<div class="level"><div class="lbl">Entry</div><div class="val">$' + q.last.toFixed(2) + '</div></div>'
      + '<div class="level"><div class="lbl">Stop</div><div class="val" style="color:var(--red);">$' + rr.stop.toFixed(2) + '</div></div>'
      + '<div class="level"><div class="lbl">Target</div><div class="val" style="color:var(--green);">$' + rr.target.toFixed(2) + '</div></div>'
    + '</div>'
    + '<div style="margin-top:14px;font-size:12px;color:var(--text-secondary);line-height:1.6;">'
      + 'Risk: $' + rr.risk.toFixed(2) + '/share · Reward: $' + rr.reward.toFixed(2) + '/share · R:R ' + (rr.reward/rr.risk).toFixed(2) + ':1.<br>'
      + 'Logic: Stop = 1.5% beyond entry. Target = next round number ' + (q.changePct >= 0 ? 'above' : 'below') + '. '
      + 'For position sizing, see <a href="trade-sizing-advisor.html" style="color:var(--accent);">Sizing Advisor</a>.'
    + '</div>'
    + '</div>';

  // Runners-up
  html += '<div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin:24px 0 10px;">🥈 Runners-up</div>';
  html += '<div class="card" style="padding:0;">'
    + ranked.slice(1, 8).map((s, i) => {
        const sq = QUOTES[s.sym];
        return '<div style="display:grid;grid-template-columns:40px 80px 1fr 80px 60px;gap:14px;padding:11px 14px;border-bottom:1px solid var(--border);align-items:center;font-size:12px;">'
          + '<div style="font-family:var(--font-mono);color:var(--text-muted);">#' + (i + 2) + '</div>'
          + '<div><strong style="font-family:var(--font-mono);">' + s.sym + '</strong></div>'
          + '<div style="color:var(--text-muted);">' + (NAMES[s.sym] || s.sym) + '</div>'
          + '<div style="font-family:var(--font-mono);color:' + (sq.changePct >= 0 ? 'var(--green)' : 'var(--red)') + ';">' + (sq.changePct >= 0 ? '+' : '') + sq.changePct.toFixed(2) + '%</div>'
          + '<div style="font-family:var(--font-mono);font-weight:700;text-align:right;color:' + (s.total >= 56 ? 'var(--green)' : s.total >= 48 ? 'var(--yellow)' : 'var(--text-muted)') + ';">' + s.total + '/80</div>'
          + '</div>';
      }).join('')
    + '</div>';

  // Footer notes
  html += '<div style="margin-top:24px;font-size:12px;color:var(--text-muted);line-height:1.7;">'
    + '<strong>How this pick was made:</strong> Every symbol in the universe of ' + UNIVERSE.length + ' tickers was scored against the live data feed using the 8-factor methodology. The top score was published above. No editorial, no override.<br>'
    + '<strong>Refresh:</strong> Page auto-refreshes every 5 seconds. Scores recompute every refresh.<br>'
    + '<strong>Disagree?</strong> The methodology is public. Verify by hand at <a href="methodology.html" style="color:var(--accent);">methodology.html</a>.'
    + '</div>';

  wrap.innerHTML = html;
}

render();
setInterval(render, 5000);
window.addEventListener('bpleone:data-mode', render);
</script>
