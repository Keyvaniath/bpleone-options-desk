<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Model Postmortem — bpleone / trade</title>
<meta name="description" content="Deep analysis of model wins/losses · what setups work · what doesn't · where to improve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v205">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.pm-bar { height:10px;background:var(--bg-elevated);border-radius:5px;overflow:hidden;position:relative; }
.pm-bar .fill { height:100%; }
.pm-row { display:grid; grid-template-columns: 1fr 70px 80px 90px 1fr 80px; gap:12px; padding:11px 14px; border-bottom:1px solid var(--border); font-size:12px; align-items:center; }
.pm-row.strong { border-left:3px solid var(--green); background:rgba(16,185,129,0.04); }
.pm-row.weak { border-left:3px solid var(--red); background:rgba(239,68,68,0.04); }
.pm-row.avg { border-left:3px solid var(--accent); }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🔬 Model Postmortem</div>
      <div class="page-subtitle">What the model is good at · what it's not · where to improve · <span id="market-clock">--</span></div>
    </div>
  </div>

  <!-- KEY INSIGHTS -->
  <div class="card mb-24" style="background:linear-gradient(135deg,rgba(0,212,255,0.05),transparent);">
    <div class="card-header"><div class="card-title">🎯 Key Insights</div></div>
    <div id="insights" style="font-size:14px;line-height:1.8;"></div>
  </div>

  <!-- BY SETUP -->
  <div class="card mb-24" style="padding:0;">
    <div class="card-header" style="padding:14px 16px;"><div class="card-title">📊 Performance by Setup Type</div></div>
    <div class="pm-row" style="background:var(--bg-elevated);font-size:9px;color:var(--text-muted);font-weight:800;letter-spacing:0.5px;">
      <div>SETUP</div><div>N</div><div>HIT %</div><div>AVG CONF</div><div>BAR</div><div>VERDICT</div>
    </div>
    <div id="setupBody"></div>
  </div>

  <!-- BY SYMBOL -->
  <div class="card mb-24" style="padding:0;">
    <div class="card-header" style="padding:14px 16px;"><div class="card-title">📋 Performance by Symbol (3+ trades)</div></div>
    <div class="pm-row" style="background:var(--bg-elevated);font-size:9px;color:var(--text-muted);font-weight:800;letter-spacing:0.5px;">
      <div>SYMBOL</div><div>N</div><div>HIT %</div><div>AVG CONF</div><div>BAR</div><div>VERDICT</div>
    </div>
    <div id="symBody"></div>
  </div>

  <!-- BY HOUR -->
  <div class="card mb-24">
    <div class="card-header"><div class="card-title">⏰ Performance by Hour of Day</div></div>
    <canvas id="hourChart" height="200"></canvas>
  </div>

  <!-- BY CONFIDENCE -->
  <div class="card">
    <div class="card-header"><div class="card-title">🎯 Performance by Confidence Bin</div></div>
    <canvas id="confChart" height="200"></canvas>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v205"></script>
<script src="js/ai-client.js?v=v205"></script>
<script src="js/app.js?v=v205"></script>
<script src="js/notify.js?v=v205"></script>
<script src="js/live.js?v=v205"></script>
<script src="js/model.js?v=v205"></script>
<script src="js/charts.js?v=v205"></script>
<script>
buildNav('model-postmortem');

let hourChart, confChart;

function paint() {
  const findings = (function () { try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch (e) { return []; } })();
  const resolved = findings.filter(f => typeof f.modelProb === 'number' && (f.outcome === 'hit' || f.outcome === 'miss'));

  if (resolved.length === 0) {
    document.getElementById('insights').innerHTML = 'No rated outcomes yet. Visit the brain pages and let it run.';
    return;
  }

  // Aggregate by setup
  const bySetup = {};
  resolved.forEach(f => {
    const setup = (f.meta && f.meta.setup) || f.type;
    if (!bySetup[setup]) bySetup[setup] = { setup, n: 0, hits: 0, confSum: 0 };
    bySetup[setup].n++;
    bySetup[setup].confSum += f.modelProb;
    if (f.outcome === 'hit') bySetup[setup].hits++;
  });
  const setupList = Object.values(bySetup).filter(s => s.n >= 2).map(s => ({ ...s, hr: s.hits / s.n, avgConf: s.confSum / s.n })).sort((a, b) => b.hr - a.hr);

  // By symbol
  const bySym = {};
  resolved.forEach(f => {
    const sym = f.meta && f.meta.sym;
    if (!sym) return;
    if (!bySym[sym]) bySym[sym] = { sym, n: 0, hits: 0, confSum: 0 };
    bySym[sym].n++;
    bySym[sym].confSum += f.modelProb;
    if (f.outcome === 'hit') bySym[sym].hits++;
  });
  const symList = Object.values(bySym).filter(s => s.n >= 3).map(s => ({ ...s, hr: s.hits / s.n, avgConf: s.confSum / s.n })).sort((a, b) => b.hr - a.hr);

  // Render setups
  const setupBody = document.getElementById('setupBody');
  setupBody.innerHTML = '';
  setupList.forEach(s => {
    const cls = s.hr >= 0.6 ? 'strong' : s.hr <= 0.4 ? 'weak' : 'avg';
    const col = s.hr >= 0.55 ? 'var(--green)' : s.hr >= 0.45 ? 'var(--accent)' : 'var(--red)';
    const verdict = s.n < 10 ? '⏳ Small sample (n=' + s.n + ') — too few to read' : s.hr >= 0.60 ? '✓ Strong hit-rate (small-sample caution)' : s.hr <= 0.40 ? '⚠ Weak — review' : 'Average';
    setupBody.innerHTML += '<div class="pm-row ' + cls + '">'
      + '<div><strong>' + s.setup + '</strong></div>'
      + '<div class="mono">' + s.n + '</div>'
      + '<div class="mono" style="color:' + col + ';font-weight:700;">' + (s.hr * 100).toFixed(0) + '%</div>'
      + '<div class="mono">' + (s.avgConf * 100).toFixed(0) + '%</div>'
      + '<div><div class="pm-bar"><div class="fill" style="width:' + (s.hr * 100) + '%;background:' + col + ';"></div></div></div>'
      + '<div style="font-family:Inter;color:' + col + ';font-size:10px;font-weight:700;">' + verdict + '</div></div>';
  });

  // Render symbols
  const symBody = document.getElementById('symBody');
  symBody.innerHTML = '';
  symList.forEach(s => {
    const cls = s.hr >= 0.6 ? 'strong' : s.hr <= 0.4 ? 'weak' : 'avg';
    const col = s.hr >= 0.55 ? 'var(--green)' : s.hr >= 0.45 ? 'var(--accent)' : 'var(--red)';
    const verdict = s.n < 10 ? '⏳ Small sample (n=' + s.n + ')' : s.hr >= 0.60 ? '✓ Strong hit-rate' : s.hr <= 0.40 ? '⚠ Weak' : 'Neutral';
    symBody.innerHTML += '<div class="pm-row ' + cls + '" style="cursor:pointer;" onclick="window.location.href=\'trade-coach.html?sym=' + s.sym + '\'">'
      + '<div><strong>' + s.sym + '</strong></div>'
      + '<div class="mono">' + s.n + '</div>'
      + '<div class="mono" style="color:' + col + ';font-weight:700;">' + (s.hr * 100).toFixed(0) + '%</div>'
      + '<div class="mono">' + (s.avgConf * 100).toFixed(0) + '%</div>'
      + '<div><div class="pm-bar"><div class="fill" style="width:' + (s.hr * 100) + '%;background:' + col + ';"></div></div></div>'
      + '<div style="font-family:Inter;color:' + col + ';font-size:10px;font-weight:700;">' + verdict + '</div></div>';
  });

  // By hour — Audit pass 170: ET clock to match the loop "for h=9 to 16" below
  // (market hours, not user local). Previously local getHours() bucketed
  // PT user's 9am ET trades into the 6am bucket which was excluded entirely.
  function _etH(ts) { try { return new Date(new Date(ts).toLocaleString('en-US', { timeZone: 'America/New_York' })).getHours(); } catch(e) { return new Date(ts).getHours(); } }
  const byHour = Array(24).fill(null).map(() => ({ n: 0, hits: 0 }));
  resolved.forEach(f => {
    const h = _etH(f.ts);
    byHour[h].n++;
    if (f.outcome === 'hit') byHour[h].hits++;
  });
  const hourLabels = [], hourRates = [];
  for (let h = 9; h <= 16; h++) {
    hourLabels.push(h + ':00');
    hourRates.push(byHour[h].n > 0 ? (byHour[h].hits / byHour[h].n) * 100 : null);
  }
  if (hourChart) hourChart.destroy();
  hourChart = new Chart(document.getElementById('hourChart').getContext('2d'), {
    type: 'bar',
    data: { labels: hourLabels, datasets: [{ data: hourRates, backgroundColor: hourRates.map(r => r == null ? 'rgba(100,116,139,0.3)' : r >= 55 ? 'rgba(16,185,129,0.7)' : r >= 45 ? 'rgba(0,212,255,0.7)' : 'rgba(239,68,68,0.7)') }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#9ca3af' } }, y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6b7280', callback: v => v + '%' } } } }
  });

  // By confidence bin
  const bins = [{lo:0.5,hi:0.6},{lo:0.6,hi:0.7},{lo:0.7,hi:0.8},{lo:0.8,hi:1.01}];
  const confResults = bins.map(b => {
    const items = resolved.filter(f => f.modelProb >= b.lo && f.modelProb < b.hi);
    return { ...b, n: items.length, hr: items.length > 0 ? items.filter(f => (f.modelProb >= 0.5 ? 'hit' : 'miss') === f.outcome).length / items.length : 0 };
  });
  if (confChart) confChart.destroy();
  confChart = new Chart(document.getElementById('confChart').getContext('2d'), {
    type: 'bar',
    data: { labels: bins.map(b => (b.lo * 100).toFixed(0) + '-' + (b.hi * 100).toFixed(0) + '%'), datasets: [{ label: 'Hit Rate', data: confResults.map(r => r.hr * 100), backgroundColor: confResults.map(r => r.hr >= 0.6 ? 'rgba(16,185,129,0.7)' : r.hr >= 0.5 ? 'rgba(0,212,255,0.7)' : 'rgba(239,68,68,0.7)') }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { grid: { display: false }, ticks: { color: '#9ca3af' } }, y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#6b7280', callback: v => v + '%' } } } }
  });

  // Insights
  const bestSetup = setupList[0], worstSetup = setupList[setupList.length - 1];
  const bestSym = symList[0], worstSym = symList[symList.length - 1];
  const bestHour = byHour.map((b, h) => ({ h, hr: b.n > 0 ? b.hits / b.n : 0, n: b.n })).filter(b => b.n >= 3 && b.h >= 9 && b.h <= 16).sort((a, b) => b.hr - a.hr)[0];

  let insights = '';
  if (bestSetup) insights += '<div>🏆 <strong>Best setup:</strong> ' + bestSetup.setup + ' (' + (bestSetup.hr * 100).toFixed(0) + '% on ' + bestSetup.n + ' trades). <strong>Press these.</strong></div>';
  if (worstSetup && worstSetup.hr < 0.45) insights += '<div>⚠ <strong>Avoid:</strong> ' + worstSetup.setup + ' (' + (worstSetup.hr * 100).toFixed(0) + '%). Model has no edge here.</div>';
  if (bestSym) insights += '<div>⭐ <strong>Best symbol:</strong> ' + bestSym.sym + ' (' + (bestSym.hr * 100).toFixed(0) + '% on ' + bestSym.n + ' trades).</div>';
  if (worstSym && worstSym.hr < 0.4) insights += '<div>🚫 <strong>Worst symbol:</strong> ' + worstSym.sym + ' (' + (worstSym.hr * 100).toFixed(0) + '%). Down-weight or remove.</div>';
  if (bestHour) insights += '<div>⏰ <strong>Best hour:</strong> ' + bestHour.h + ':00 (' + (bestHour.hr * 100).toFixed(0) + '% on ' + bestHour.n + ' trades). Focus your screen time here.</div>';
  document.getElementById('insights').innerHTML = insights || 'Insufficient data for insights. Let the brain run.';
}

paint();
window.addEventListener('bpleone:model-trained', paint);
setInterval(paint, 60000);
</script>
</body>
</html>
