<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain TL;DR — bpleone / trade</title>
<meta name="description" content="60-second daily summary auto-generated from your brain state. For when you have 30 seconds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=v239">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.tldr-card { padding:32px;background:linear-gradient(135deg,rgba(0,212,255,0.05),rgba(167,139,250,0.03));border:1px solid var(--border);border-radius:16px;margin-bottom:18px; }
.tldr-card h2 { font-size:22px;margin-bottom:14px;line-height:1.4; }
.tldr-card .lead { font-size:18px;color:var(--text-primary);line-height:1.7;margin-bottom:14px; }
.tldr-card .bullets { font-size:14px;color:var(--text-secondary);line-height:1.9; }
.tldr-card .bullets li { margin-bottom:6px; }
.tldr-card strong { color:var(--accent); }
.tldr-card .accent { background:rgba(0,212,255,0.15);padding:2px 8px;border-radius:4px;font-family:var(--font-mono);font-weight:700; }
.action-card { padding:18px;background:var(--bg-elevated);border-left:4px solid var(--accent);border-radius:10px;margin-bottom:10px; }
.action-card.good { border-left-color:var(--green); }
.action-card.bad { border-left-color:var(--red); }
.action-card.warn { border-left-color:var(--yellow); }
.action-card h4 { font-size:13px;font-weight:700;margin-bottom:6px; }
.action-card p { font-size:12px;color:var(--text-secondary);line-height:1.6; }
.read-time { font-size:11px;color:var(--text-muted);text-align:center;margin-top:24px;font-style:italic; }
</style>
  <link rel="canonical" href="https://options.bpleone.com/brain-tldr.html">
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">⚡ Brain TL;DR</div>
      <div class="page-subtitle">Auto-generated 60-second summary · for when you have 30 seconds · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <button class="btn btn-ghost" id="copyBtn">📋 Copy</button>
      <button class="btn btn-primary" id="refreshBtn">↻ Regenerate</button>
    </div>
  </div>

  <div id="tldr" class="tldr-card"></div>

  <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:700;margin-bottom:10px;">🎯 What to do right now</div>
  <div id="actions"></div>

  <div class="read-time" id="readTime">Generated · auto-refreshes every 30s</div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v239"></script>
<script src="js/ai-client.js?v=v239"></script>
<script src="js/app.js?v=v239"></script>
<script src="js/notify.js?v=v239"></script>
<script src="js/live.js?v=v239"></script>
<script src="js/train-rows.js?v=v239"></script>
<script src="js/no-play-gate.js?v=v239" defer></script>
<script src="js/model.js?v=v239"></script>
<script>
buildNav('brain-tldr');

function loadFindings() { try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch(e) { return []; } }
function loadTrain() { return window.TrainRows ? TrainRows.load() : []; }   // pass 344: graded calls (js/train-rows.js); 'bpleone_train_v1' was never written
function loadPos() { try { return JSON.parse(localStorage.getItem('bpleone_positions_live_v1') || '[]'); } catch(e) { return []; } }

function render() {
  const findings = loadFindings();
  const train = loadTrain();
  const positions = loadPos();
  const now = Date.now();
  const weekAgo = now - 7 * 86400000;
  const today0 = new Date(); today0.setHours(0,0,0,0);

  // Stats
  // Pass 344: graded calls (js/train-rows.js), graded against drift; no A-F letters or mood words.
  const esc = TrainRows.esc;
  const week = train.filter(t => t.ts >= weekAgo);
  const pnl = week.reduce((a, t) => a + TrainRows.ret(t), 0);
  const g = TrainRows.grade(train);

  // Top pick today
  const todayF = findings.filter(f => f.ts >= today0.getTime() && f.meta && f.meta.sym);
  const ranked = todayF.map(f => {
    let p = null; try { if (window.predictForFinding) { const r = window.predictForFinding(f); p = r ? r.prob : null; } } catch(e){}
    return { ...f, p };
  }).filter(f => f.p != null).sort((a,b) => b.p - a.p);
  const top = ranked[0];

  // Drift
  const recent3 = train.filter(t => t.ts >= now - 3*86400000);
  const recentHit = recent3.length >= 10 ? recent3.filter(t => t.y === 1).length / recent3.length : null;
  const lifeHit = train.length >= TrainRows.MIN_N ? train.filter(t => t.y === 1).length / train.length : null;
  const drift = (recentHit != null && lifeHit != null) ? recentHit - lifeHit : 0;

  // Compose narrative
  let lead = '';
  if (top) lead = 'The browser model\'s top-scored finding right now is <strong>' + esc(top.meta.sym) + '</strong> at <span class="accent">' + (top.p*100).toFixed(0) + '%</span> on a ' + esc(top.meta.setup || 'signal') + ' setup (raw output, not a pick).';
  else if (todayF.length > 0) lead = 'The browser model has ' + todayF.length + ' symbol findings today but none scored yet.';
  else lead = 'No symbol findings in this browser yet today.';

  const summary = !g.n ? 'No graded calls in this browser yet.'
    : !g.enough ? g.n + ' graded calls so far: too few to grade (needs ' + TrainRows.MIN_N + '+).'
    : 'Browser model: <span class="accent">' + (g.skillPp >= 0 ? '+' : '') + g.skillPp.toFixed(1) + ' pp</span> vs market drift (' + (g.hit*100).toFixed(0) + '% right vs ' + (g.bar*100).toFixed(0) + '% always-long, n=' + g.n + ')' + (week.length ? ', ' + (pnl >= 0 ? '+' : '') + pnl.toFixed(2) + '% summed move this week.' : '.');

  // Bullets
  const bullets = [];
  if (positions.length > 0) bullets.push('Currently holding <strong>' + positions.length + '</strong> open position' + (positions.length > 1 ? 's' : '') + '.');
  bullets.push('Last hour saw <strong>' + findings.filter(f => f.ts > now - 3600000).length + '</strong> brain findings.');
  if (ranked.length > 0) bullets.push('<strong>' + ranked.filter(f => f.p >= 0.7).length + '</strong> findings scored 70%+ by the browser model today (raw).');
  if (recentHit != null && lifeHit != null && Math.abs(drift) > 0.1) bullets.push('<strong style="color:var(--yellow);">Recent vs lifetime:</strong> the last 3 days\' hit rate is ' + (drift >= 0 ? '+' : '') + (drift*100).toFixed(0) + ' pp vs lifetime.');
  if (!g.n) bullets.push(TrainRows.EMPTY_HTML);

  const html = '<div class="lead">' + lead + '</div>'
    + '<h2>' + summary + '</h2>'
    + '<ul class="bullets">' + bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>';

  document.getElementById('tldr').innerHTML = html;

  // Action items
  const actions = [];
  if (g.enough && g.skillPp <= 0) actions.push({ tone:'bad', t:'No skill above drift', b:'The browser model\'s graded calls do no better than an always-long call. Treat its output as noise; the desk\'s live record is the <a href="edge-scorecard.html" style="color:var(--accent);">Edge Scorecard</a>.' });
  if (positions.length > 0) actions.push({ tone:'warn', t:'👀 Check positions', b:'You have ' + positions.length + ' open position(s). <a href="positions-live.html" style="color:var(--accent);">Live tracker →</a>' });
  if (!actions.length) actions.push({ tone:'good', t:'Nothing to act on', b:'No open positions and no graded result that needs attention.' });

  document.getElementById('actions').innerHTML = actions.map(a =>
    '<div class="action-card ' + a.tone + '"><h4>' + a.t + '</h4><p>' + a.b + '</p></div>'
  ).join('');

  document.getElementById('readTime').textContent = 'Generated ' + new Date().toLocaleTimeString('en-US', { timeZone: 'America/New_York' }) + ' ET · 60-second read · auto-refreshes';
}

document.getElementById('refreshBtn').addEventListener('click', render);
document.getElementById('copyBtn').addEventListener('click', () => {
  const txt = document.getElementById('tldr').innerText + '\n\nACTIONS:\n' + document.getElementById('actions').innerText;
  navigator.clipboard.writeText(txt).then(() => {
    document.getElementById('copyBtn').textContent = '✓ Copied';
    setTimeout(() => { document.getElementById('copyBtn').textContent = '📋 Copy'; }, 1500);
  });
});

render();
setInterval(render, 30000);
</script>
</body>
</html>
