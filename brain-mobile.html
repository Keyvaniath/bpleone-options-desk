<!DOCTYPE html>

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
  * { margin:0;padding:0;box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:#08111b;color:#e8eef5;font-size:14px;line-height:1.4;padding-bottom:80px; }
  .top { padding:14px 18px;display:flex;justify-content:space-between;align-items:center;background:rgba(10,16,24,0.95);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);border-bottom:1px solid #2a2d35; }
  .logo { font-weight:800;font-size:16px; }
  .logo span { color:#00d4ff; }
  .hub { font-size:11px;padding:6px 12px;background:#14151a;border:1px solid #2a2d35;border-radius:12px;color:#a8b3c1;text-decoration:none; }
  .hero { padding:32px 22px;text-align:center;background:linear-gradient(180deg,rgba(0,212,255,0.04),transparent 70%); }
  .hero .label { font-size:10px;font-weight:800;letter-spacing:1.5px;color:#a8b3c1;text-transform:uppercase; }
  .hero .score { font-family:'JetBrains Mono',monospace;font-size:96px;font-weight:900;line-height:0.9;margin-top:14px; }
  .hero .headline { font-size:18px;font-weight:800;margin-top:18px;letter-spacing:1px; }
  .hero .sub { font-size:12px;color:#a8b3c1;margin-top:8px;font-family:monospace; }
  .row { display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-top:12px; }
  .row.three { grid-template-columns:1fr 1fr 1fr; }
  .card { padding:14px;background:#14151a;border-radius:10px;border:1px solid #2a2d35; }
  .card .l { font-size:9px;font-weight:800;color:#a8b3c1;text-transform:uppercase;letter-spacing:0.5px; }
  .card .v { font-family:monospace;font-size:20px;font-weight:800;margin-top:4px;color:#00d4ff; }
  .card .s { font-size:10px;color:#a8b3c1;font-family:monospace;margin-top:2px; }
  .links { padding:18px 16px;display:flex;flex-direction:column;gap:6px; }
  .links a { display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#14151a;border:1px solid #2a2d35;border-radius:10px;color:#e8eef5;text-decoration:none;font-weight:600;font-size:14px; }
  .links a:active { background:#1a1d25; }
  .section-title { padding:18px 18px 8px;font-size:10px;font-weight:800;color:#a8b3c1;text-transform:uppercase;letter-spacing:1px; }
  .fab { position:fixed;bottom:18px;right:18px;width:54px;height:54px;border-radius:50%;background:#00d4ff;color:#000;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 6px 20px rgba(0,212,255,0.5);text-decoration:none;z-index:100; }
  .alerts-banner { padding:14px 18px;margin:12px 16px;background:rgba(239,68,68,0.10);border:1px solid rgba(239,68,68,0.4);border-radius:10px;display:none; }
  .alerts-banner.show { display:block; }
  .alerts-banner .t { font-size:11px;font-weight:800;color:#ef4444;text-transform:uppercase;letter-spacing:1px; }
  .alerts-banner .m { font-size:13px;color:#fff;margin-top:4px; }
</style>
</head>
<body>

<div class="top">
  <div class="logo">bpleone <span>/ brain</span></div>
  <a href="https://bpleone.com" class="hub">← Hub</a>
</div>

<div class="hero">
  <div class="label">Brain Health</div>
  <div class="score" id="health">—</div>
  <div class="headline" id="headline">Loading…</div>
  <div class="sub" id="sub"></div>
</div>

<div class="alerts-banner" id="alerts-banner">
  <div class="t">⚠ Alerts active</div>
  <div class="m" id="alerts-text"></div>
</div>

<div class="row three">
  <div class="card"><div class="l">BSS</div><div class="v" id="bss-val">—</div><div class="s" id="bss-sub"></div></div>
  <div class="card"><div class="l">Sharpe</div><div class="v" id="sh-val">—</div><div class="s">annualized</div></div>
  <div class="card"><div class="l">Trust</div><div class="v" id="trust-val">—</div><div class="s">/100</div></div>
</div>

<div class="row three">
  <div class="card"><div class="l">Streak</div><div class="v" id="streak-val">—</div><div class="s" id="streak-sub"></div></div>
  <div class="card"><div class="l">Drift</div><div class="v" id="drift-val">—</div><div class="s" id="drift-sub">PSI</div></div>
  <div class="card"><div class="l">Trades/hr</div><div class="v" id="vol-val">—</div><div class="s" id="vol-sub">last 60min</div></div>
</div>

<div class="section-title">Quick links</div>
<div class="links">
  <a href="brain-coach-live.html">🧑‍🏫 Full Brain Coach <span style="color:#00d4ff;">→</span></a>
  <a href="brain-truth.html">🧠 All 26 modules <span style="color:#00d4ff;">→</span></a>
  <a href="brain-bet.html">🎰 Brain Bet (today's pick) <span style="color:#00d4ff;">→</span></a>
  <a href="morning-brief.html">☀ Morning Brief <span style="color:#00d4ff;">→</span></a>
  <a href="dashboard.html">📊 Full dashboard <span style="color:#00d4ff;">→</span></a>
  <a href="site-diagnostics.html">🩺 Site diagnostics <span style="color:#00d4ff;">→</span></a>
</div>

<a href="brain-bet.html" class="fab" title="Today's bet">🎰</a>

<script src="js/data-provider.js?v=v185"></script>
<script src="js/ai-client.js?v=v185"></script>
<script src="js/app.js?v=v185"></script>
<script src="js/notify.js?v=v185"></script>
<script src="js/live.js?v=v185"></script>
<script>
function safe(fn, fb) { try { return fn(); } catch (e) { return fb; } }
function fmt(n, d) { return n != null ? n.toFixed(d != null ? d : 2) : '—'; }
function fmtPct(p) { return p != null ? (p * 100).toFixed(0) + '%' : '—'; }

function tick() {
  // Brain Coach
  const bc = safe(() => window.BrainCoach && window.BrainCoach.summary(), null);
  if (bc) {
    document.getElementById('health').textContent = bc.healthScore;
    document.getElementById('health').style.color = bc.headlineColor;
    document.getElementById('headline').textContent = bc.headline;
    document.getElementById('headline').style.color = bc.headlineColor;
    document.getElementById('sub').textContent = bc.totalChecks + ' checks · ' + bc.warnCount + ' warn · ' + bc.alertCount + ' alerts';
    // Alerts banner
    if (bc.alertCount > 0) {
      const banner = document.getElementById('alerts-banner');
      banner.classList.add('show');
      const alerts = bc.diagnosis.filter(d => d.kind === 'alert').slice(0, 2).map(d => d.text).join(' ');
      document.getElementById('alerts-text').textContent = alerts || 'See coach for details.';
    }
  }

  // BSS
  const bss = safe(() => window.BrierSkill && window.BrierSkill.score(), null);
  if (bss && bss.ready) {
    document.getElementById('bss-val').textContent = (bss.skill >= 0 ? '+' : '') + fmt(bss.skill);
    document.getElementById('bss-val').style.color = bss.skill > 0.10 ? '#10b981' : bss.skill > 0 ? '#f59e0b' : '#ef4444';
    document.getElementById('bss-sub').textContent = 'n=' + bss.n;
  }

  // Sharpe
  const sh = safe(() => window.SharpeTracker && window.SharpeTracker.score(), null);
  if (sh && sh.ready) {
    document.getElementById('sh-val').textContent = (sh.annSharpe >= 0 ? '+' : '') + fmt(sh.annSharpe);
    document.getElementById('sh-val').style.color = sh.annSharpe > 1.0 ? '#10b981' : sh.annSharpe > 0 ? '#f59e0b' : '#ef4444';
  }

  // Trust
  const tt = safe(() => window.TradeTrust && window.TradeTrust.score(), null);
  if (tt) {
    document.getElementById('trust-val').textContent = tt.score;
    document.getElementById('trust-val').style.color = tt.tierColor;
  }

  // Streak
  const dd = safe(() => window.DrawdownProtector && window.DrawdownProtector.stats(), null);
  if (dd) {
    document.getElementById('streak-val').textContent = (dd.currentStreak >= 0 ? '+' : '') + dd.currentStreak;
    document.getElementById('streak-val').style.color = dd.currentStreak <= -3 ? '#ef4444' : dd.currentStreak >= 4 ? '#f59e0b' : '#00d4ff';
    document.getElementById('streak-sub').textContent = 'mult ' + fmt(dd.sizeMultiplier);
  }

  // Drift
  const psi = safe(() => window.DriftPSI && window.DriftPSI.status(), null);
  if (psi && typeof psi.psi === 'number') {
    document.getElementById('drift-val').textContent = fmt(psi.psi);
    document.getElementById('drift-val').style.color = psi.psi > 0.25 ? '#ef4444' : psi.psi > 0.10 ? '#f59e0b' : '#10b981';
  }

  // Volume
  const vt = safe(() => window.VolumeTracker && window.VolumeTracker.stats(), null);
  if (vt) {
    document.getElementById('vol-val').textContent = vt.predictionsLastHour;
    document.getElementById('vol-val').style.color = vt.predictionsLastHour === 0 ? '#ef4444' : '#00d4ff';
  }
}

// Initial load attempt + retries to catch lazy-loaded modules
setTimeout(tick, 1500);
setTimeout(tick, 4000);
setInterval(tick, 15000);
// Tick on every heartbeat + cycle so the phone view visibly refreshes
window.addEventListener('bpleone:heartbeat', tick);
window.addEventListener('bpleone:continuous-cycle', tick);

// Add a pulsing live dot next to the logo
(function addLiveDot() {
  const logo = document.querySelector('.logo');
  if (!logo) return;
  const dot = document.createElement('span');
  dot.style.cssText = 'display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 6px #10b981;animation:bpleonePulse 1.5s ease-in-out infinite;margin-right:6px;vertical-align:middle;';
  logo.prepend(dot);
})();
</script>
</body>
</html>
