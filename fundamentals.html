<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fundamentals — bpleone / trade</title>
<meta name="description" content="Live per-symbol fundamentals pulled from Finnhub: profile, valuation, growth, margins, analyst recommendations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=v206">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.profile-card { padding: 20px 22px; background: var(--bg-elevated); border-radius: 12px; }
.profile-card .logo { width: 48px; height: 48px; border-radius: 8px; background: var(--bg-secondary); display: inline-flex; align-items: center; justify-content: center; font-size: 22px; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.metric-grid .k { color: var(--text-muted); font-size: 12px; padding: 4px 0; }
.metric-grid .v { color: var(--text-primary); font-family: var(--font-mono); font-size: 13px; font-weight: 600; text-align: right; padding: 4px 0; }
.section-h { font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.6px; padding: 12px 0 6px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
.rec-bar { display: flex; gap: 2px; height: 24px; border-radius: 4px; overflow: hidden; }
.rec-bar > div { display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: white; }
.sym-quick { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.sym-quick button { padding: 5px 11px; border-radius: 999px; background: var(--bg-elevated); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer; font-size: 12px; font-family: var(--font-mono); }
.sym-quick button:hover, .sym-quick button.active { border-color: var(--accent); color: var(--accent); }
.empty-card { padding: 50px 20px; text-align: center; color: var(--text-muted); }
.empty-card .icon { font-size: 40px; margin-bottom: 10px; }
</style>
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">Fundamentals · <span id="sym" class="mono">—</span> <span class="feat-badge feat-live">REAL</span></div>
      <div class="page-subtitle">Live from Finnhub /stock/profile2 + /stock/metric · analyst recs · <span id="market-clock">--</span></div>
    </div>
    <div class="flex gap-8">
      <input id="symInput" placeholder="Symbol…" value="NVDA" autocomplete="off" style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;padding:7px 12px;color:var(--text-primary);font-size:13px;font-family:var(--font-mono);width:120px;text-transform:uppercase;">
      <button class="btn btn-primary" id="loadBtn">Load</button>
    </div>
  </div>

  <div class="sym-quick" id="symQuick"></div>

  <div id="content">
    <div class="empty-card"><div class="icon">⏳</div><div>Loading fundamentals…</div></div>
  </div>

  <div class="related-bar mt-24">
    <span class="lbl">Related →</span>
    <a href="ticker.html" id="tickerLink">🔍 Ticker Focus</a>
    <a href="earnings-preview.html">🔬 Earnings Preview</a>
    <a href="smart-money.html">🏛 Insider Activity</a>
    <a href="news.html">📰 News</a>
    <a href="trade-plan.html">📋 Trade Plan</a>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v206"></script>
<script src="js/ai-client.js?v=v206"></script>
<script src="js/app.js?v=v206"></script>
<script src="js/notify.js?v=v206"></script>
<script src="js/live.js?v=v206"></script>
<script>
buildNav('fundamentals');
const $ = id => document.getElementById(id);
const POPULAR = ['NVDA','AAPL','MSFT','META','GOOGL','AMZN','TSLA','AMD','PLTR','COIN','SMCI','SHOP','CRM','UBER','BABA'];

function renderQuick(active) {
  $('symQuick').innerHTML = POPULAR.map(s => `<button class="${s === active ? 'active' : ''}" data-sym="${s}">${s}</button>`).join('');
  $('symQuick').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { $('symInput').value = b.dataset.sym; load(); }));
}

function fmt$(v) {
  if (v == null || !isFinite(v)) return '—';
  if (Math.abs(v) >= 1e12) return '$' + (v/1e12).toFixed(2) + 'T';
  if (Math.abs(v) >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if (Math.abs(v) >= 1e6) return '$' + (v/1e6).toFixed(0) + 'M';
  return '$' + Number(v).toFixed(2);
}
function fmtN(v, dp = 2) { return v == null || !isFinite(v) ? '—' : Number(v).toFixed(dp); }
function fmtPct(v, dp = 2) { return v == null || !isFinite(v) ? '—' : (v >= 0 ? '+' : '') + Number(v).toFixed(dp) + '%'; }

function showError(msg, hint) {
  $('content').innerHTML = `<div class="empty-card">
    <div class="icon">⚠</div>
    <div style="color:var(--red);font-weight:700;margin-bottom:6px;">${msg}</div>
    <div style="font-size:13px;">${hint || ''}</div>
    <a href="settings.html" class="btn btn-primary" style="margin-top:14px;">Open Settings</a>
  </div>`;
}

async function load() {
  const sym = ($('symInput').value || '').trim().toUpperCase();
  if (!sym) return;
  renderQuick(sym);
  $('sym').textContent = sym;
  $('tickerLink').href = 'ticker.html?sym=' + sym;
  document.title = sym + ' Fundamentals — bpleone';
  $('content').innerHTML = '<div class="empty-card"><div class="icon">⏳</div><div>Loading ' + sym + ' from Finnhub…</div></div>';

  // Pass 300: worker-first (server-side Finnhub key) so this page renders for EVERY
  // visitor with no browser key; fall back to a configured key, then to an honest
  // empty state. Never fabricates.
  const WORKER = (window.WorkerBridge && WorkerBridge.getUrl && WorkerBridge.getUrl()) || 'https://bpleone-brain-worker.brandonpleone.workers.dev';
  async function wj(pq) { try { const r = await fetch(WORKER + pq); if (!r.ok) return null; return await r.json(); } catch (e) { return null; } }

  let profile = null, metrics = null, recs = [], q = {};
  const [wp, wf, wr, wq] = await Promise.all([
    wj('/brain/profile?symbol=' + encodeURIComponent(sym)),
    wj('/brain/fundamentals?symbol=' + encodeURIComponent(sym)),
    wj('/brain/recommendations?symbol=' + encodeURIComponent(sym)),
    wj('/brain/quotes?syms=' + encodeURIComponent(sym))
  ]);
  if (wp && wp.ok && wp.profile) profile = wp.profile;
  if (wf && wf.ok && wf.metric) metrics = wf.metric;
  if (wr && wr.ok && Array.isArray(wr.trend)) recs = wr.trend;
  if (wq && wq.quotes && wq.quotes[sym]) { const x = wq.quotes[sym]; q = { c: x.last, pc: x.prevClose, h: x.dayHigh, l: x.dayLow }; }

  // Fall back to a configured browser key if the worker had nothing (e.g. pre-deploy).
  if ((!profile || !metrics) && typeof DataProvider !== 'undefined' && DataProvider.getConfig().provider === 'finnhub' && DataProvider.getConfig().apiKey) {
    const [bp, bm, br, bq] = await Promise.all([
      DataProvider.getStockProfile(sym).catch(e => null),
      DataProvider.getBasicFinancials(sym).catch(e => null),
      DataProvider.getRecommendations(sym).catch(e => []),
      DataProvider.getQuote(sym).catch(e => ({}))
    ]);
    if (!profile && bp) profile = bp;
    if (!metrics && bm) metrics = bm;
    if ((!recs || !recs.length) && br && br.length) recs = br;
    if (q.c == null && bq && bq.c != null) q = bq;
  }

  if (!profile && !metrics) {
    showError('Fundamentals unavailable for ' + sym, 'The data feed is unavailable right now — nothing fabricated. This populates once the worker is live; if you have your own Finnhub key, connect it in Settings to load it immediately.');
    return;
  }
  render(sym, profile || {}, metrics || {}, recs || [], q || {});
}

function render(sym, p, m, recs, q) {
  const logo = p.logo ? `<img src="${p.logo}" style="width:48px;height:48px;border-radius:8px;background:white;" alt="${sym}">` : `<div class="logo">${sym.charAt(0)}</div>`;
  const last = (q.c != null && q.c > 0) ? q.c : (typeof QUOTES !== 'undefined' && QUOTES[sym] ? QUOTES[sym].last : null);
  const pc = (q.pc != null && q.pc > 0) ? q.pc : (typeof QUOTES !== 'undefined' && QUOTES[sym] ? QUOTES[sym].prevClose : null);
  const chgPct = (last != null && pc != null && pc > 0) ? (last/pc - 1) * 100 : null;

  const sec = $('section-h');
  const html = `
    <div class="profile-card mb-24">
      <div style="display:flex;gap:16px;align-items:flex-start;">
        ${logo}
        <div style="flex:1;">
          <h2 style="margin:0;font-size:22px;">${escapeHtml(p.name || sym)}</h2>
          <div style="color:var(--text-muted);font-size:13px;margin-top:4px;">${escapeHtml(p.finnhubIndustry || '—')} · ${escapeHtml(p.exchange || '—')} · ${escapeHtml(p.country || '—')}</div>
          <div style="margin-top:8px;font-family:var(--font-mono);">
            <span style="font-size:24px;font-weight:700;">${fmt$(last)}</span>
            <span class="${chgPct >= 0 ? 'green-text' : 'red-text'}" style="margin-left:8px;font-size:14px;">${fmtPct(chgPct)}</span>
          </div>
        </div>
        <div style="text-align:right;">
          <a href="${p.weburl || '#'}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;">${p.weburl ? p.weburl.replace(/^https?:\/\//, '') : ''}</a>
          <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">IPO: ${p.ipo || '—'}</div>
        </div>
      </div>
    </div>

    <div class="grid grid-12 mb-24">
      <div class="card col-4">
        <div class="card-header"><div class="card-title">📏 Size & Valuation</div></div>
        <div class="section-h">Size</div>
        <div class="metric-grid">
          <div class="k">Market Cap</div><div class="v">${fmt$(m.marketCapitalization ? m.marketCapitalization * 1e6 : null)}</div>
          <div class="k">Enterprise Value</div><div class="v">${fmt$(m.enterpriseValue ? m.enterpriseValue * 1e6 : null)}</div>
          <div class="k">Shares Outstanding</div><div class="v">${(() => { const so = Number(p.shareOutstanding || m.shareOutstanding); return so > 0 ? (so >= 1000 ? (so / 1000).toFixed(2) + 'B' : so.toFixed(1) + 'M') : '—'; })()}</div>
        </div>
        <div class="section-h">Valuation</div>
        <div class="metric-grid">
          <div class="k">P/E (TTM)</div><div class="v">${fmtN(m.peTTM, 1)}</div>
          <div class="k">P/E (forward)</div><div class="v">${fmtN(m.forwardPE, 1)}</div>
          <div class="k">P/S (TTM)</div><div class="v">${fmtN(m.psTTM, 2)}</div>
          <div class="k">P/B (Q)</div><div class="v">${fmtN(m.pbQuarterly, 2)}</div>
          <div class="k">EV/EBITDA</div><div class="v">${fmtN(m.evEbitdaTTM, 2)}</div>
          <div class="k">EV/Sales</div><div class="v">${fmtN(m.evRevenueTTM, 2)}</div>
        </div>
      </div>

      <div class="card col-4">
        <div class="card-header"><div class="card-title">📈 Growth</div></div>
        <div class="section-h">Top-line</div>
        <div class="metric-grid">
          <div class="k">Revenue Growth (5y)</div><div class="v">${fmtPct(m.revenueGrowth5Y)}</div>
          <div class="k">Revenue Growth (3y)</div><div class="v">${fmtPct(m.revenueGrowth3Y)}</div>
          <div class="k">Revenue Growth (TTM)</div><div class="v">${fmtPct(m.revenueGrowthTTMYoy)}</div>
          <div class="k">Quarterly Rev YoY</div><div class="v">${fmtPct(m.revenueGrowthQuarterlyYoy)}</div>
        </div>
        <div class="section-h">EPS</div>
        <div class="metric-grid">
          <div class="k">EPS Growth (5y)</div><div class="v">${fmtPct(m.epsGrowth5Y)}</div>
          <div class="k">EPS Growth (3y)</div><div class="v">${fmtPct(m.epsGrowth3Y)}</div>
          <div class="k">EPS Growth (TTM)</div><div class="v">${fmtPct(m.epsGrowthTTMYoy)}</div>
          <div class="k">EPS Quarterly YoY</div><div class="v">${fmtPct(m.epsGrowthQuarterlyYoy)}</div>
        </div>
      </div>

      <div class="card col-4">
        <div class="card-header"><div class="card-title">💰 Profitability & Margins</div></div>
        <div class="section-h">Margins</div>
        <div class="metric-grid">
          <div class="k">Gross Margin</div><div class="v">${fmtPct(m.grossMarginTTM)}</div>
          <div class="k">Operating Margin</div><div class="v">${fmtPct(m.operatingMarginTTM)}</div>
          <div class="k">Net Margin</div><div class="v">${fmtPct(m.netProfitMarginTTM)}</div>
          <div class="k">ROE (TTM)</div><div class="v">${fmtPct(m.roeTTM)}</div>
          <div class="k">ROA (TTM)</div><div class="v">${fmtPct(m.roaTTM)}</div>
        </div>
        <div class="section-h">Cash & Debt</div>
        <div class="metric-grid">
          <div class="k">FCF Margin (TTM)</div><div class="v">${fmtPct(m.fcfMarginTTM)}</div>
          <div class="k">Debt/Equity</div><div class="v">${fmtN(m['totalDebt/totalEquityAnnual'], 2)}</div>
          <div class="k">Current Ratio</div><div class="v">${fmtN(m.currentRatioAnnual, 2)}</div>
          <div class="k">Dividend Yield</div><div class="v">${fmtPct(m.dividendYieldIndicatedAnnual)}</div>
        </div>
      </div>
    </div>

    <div class="grid grid-12 mb-24">
      <div class="card col-7">
        <div class="card-header"><div class="card-title">🎯 Analyst Recommendations</div></div>
        ${renderRecs(recs)}
      </div>

      <div class="card col-5">
        <div class="card-header"><div class="card-title">📊 52-week Range</div></div>
        <div class="metric-grid">
          <div class="k">52-Week High</div><div class="v green-text">${fmt$(m['52WeekHigh'])}</div>
          <div class="k">52-Week Low</div><div class="v red-text">${fmt$(m['52WeekLow'])}</div>
          <div class="k">Date of 52W High</div><div class="v">${m['52WeekHighDate'] || '—'}</div>
          <div class="k">Date of 52W Low</div><div class="v">${m['52WeekLowDate'] || '—'}</div>
          <div class="k">From 52W High</div><div class="v">${last && m['52WeekHigh'] ? fmtPct((last / m['52WeekHigh'] - 1) * 100) : '—'}</div>
          <div class="k">From 52W Low</div><div class="v">${last && m['52WeekLow'] ? fmtPct((last / m['52WeekLow'] - 1) * 100) : '—'}</div>
          <div class="k">10-Day Avg Volume</div><div class="v">${m['10DayAverageTradingVolume'] ? (m['10DayAverageTradingVolume']).toFixed(2) + 'M' : '—'}</div>
          <div class="k">Beta</div><div class="v">${fmtN(m.beta, 2)}</div>
        </div>
      </div>
    </div>
  `;
  $('content').innerHTML = html;
}

function renderRecs(recs) {
  if (!recs || !recs.length) return '<div class="empty-card" style="padding:30px;"><div style="color:var(--text-muted);">No analyst recommendations.</div></div>';
  recs.sort((a, b) => (b.period || '').localeCompare(a.period || ''));
  const latest = recs[0];
  const total = (latest.strongBuy || 0) + (latest.buy || 0) + (latest.hold || 0) + (latest.sell || 0) + (latest.strongSell || 0);
  if (!total) return '<div class="empty-card" style="padding:30px;color:var(--text-muted);">No recommendations.</div>';
  function pct(v) { return total ? (v/total*100) : 0; }
  return `<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">As of ${latest.period}</div>
    <div class="rec-bar">
      ${latest.strongBuy ? `<div style="flex:${pct(latest.strongBuy)};background:#059669;">${latest.strongBuy} SB</div>` : ''}
      ${latest.buy ? `<div style="flex:${pct(latest.buy)};background:#10b981;">${latest.buy} B</div>` : ''}
      ${latest.hold ? `<div style="flex:${pct(latest.hold)};background:#6b7280;">${latest.hold} H</div>` : ''}
      ${latest.sell ? `<div style="flex:${pct(latest.sell)};background:#f87171;">${latest.sell} S</div>` : ''}
      ${latest.strongSell ? `<div style="flex:${pct(latest.strongSell)};background:#dc2626;">${latest.strongSell} SS</div>` : ''}
    </div>
    <div style="margin-top:14px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center;font-size:11px;">
      <div><div class="mono" style="color:#059669;font-weight:700;">${latest.strongBuy || 0}</div><div style="color:var(--text-muted);">Strong Buy</div></div>
      <div><div class="mono" style="color:#10b981;font-weight:700;">${latest.buy || 0}</div><div style="color:var(--text-muted);">Buy</div></div>
      <div><div class="mono" style="color:#6b7280;font-weight:700;">${latest.hold || 0}</div><div style="color:var(--text-muted);">Hold</div></div>
      <div><div class="mono" style="color:#f87171;font-weight:700;">${latest.sell || 0}</div><div style="color:var(--text-muted);">Sell</div></div>
      <div><div class="mono" style="color:#dc2626;font-weight:700;">${latest.strongSell || 0}</div><div style="color:var(--text-muted);">Strong Sell</div></div>
    </div>
    ${recs.length > 1 ? '<div style="margin-top:14px;font-size:11px;color:var(--text-muted);">Trend (last 4 periods): ' + recs.slice(0, 4).reverse().map(r => r.period + ' ' + ((r.strongBuy||0)+(r.buy||0)) + 'B/' + ((r.sell||0)+(r.strongSell||0)) + 'S').join(' → ') + '</div>' : ''}
  `;
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

$('loadBtn').addEventListener('click', load);
$('symInput').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });

// Honor ?sym=XXX deep-links (e.g. from ticker.html) — fall back to the NVDA default.
const urlSym = (new URLSearchParams(location.search).get('sym') || '').trim().toUpperCase();
if (urlSym) $('symInput').value = urlSym;
renderQuick(($('symInput').value || 'NVDA').trim().toUpperCase());
load();
</script>
</body>
</html>
