<script>
function gatherInsights() {
  const insights = [];
  // From MoneyTracker
  if (window.MoneyTracker) {
    const s = window.MoneyTracker.summary();
    if (!s.empty && s.windows) {
      const d7 = s.windows.d7;
      const d30 = s.windows.d30;
      if (d7 && d7.totalPnL > 0) insights.push({ tier: 'win', icon: '💵', head: 'Brain is making money', body: '+$' + d7.totalPnL.toFixed(0) + ' over last 7 days. ' + d7.totalTrades + ' trades, ' + ((d7.winRate || 0) * 100).toFixed(0) + '% win rate. Keep doing what works.' });
      else if (d7 && d7.totalPnL < 0) insights.push({ tier: 'warn', icon: '⚠', head: 'Brain in drawdown', body: '$' + d7.totalPnL.toFixed(0) + ' over last 7 days. Review the high-conviction signals that lost — was the conviction calibrated or was it noise?' });
      if (d30 && d7 && d7.totalPnL > 0 && (d7.totalPnL / 7) > (d30.totalPnL / 30) * 1.5) insights.push({ tier: 'win', icon: '🚀', head: 'Acceleration', body: 'Last 7 days are running faster than the 30-day pace. Don\'t up-size out of excitement — let the math compound.' });
      if (d30 && d30.maxDrawdown > 0 && d30.totalPnL < d30.maxDrawdown) insights.push({ tier: 'warn', icon: '📉', head: 'Drawdown > profits', body: 'Max DD ($' + d30.maxDrawdown.toFixed(0) + ') exceeds month P&L ($' + d30.totalPnL.toFixed(0) + '). Consider tighter risk per trade.' });
    }
  }
  // From AutoTrade
  if (window.AutoTrade) {
    const st = window.AutoTrade.stats();
    if (st.totalTrades > 5) {
      if (st.winRate != null && st.winRate >= 0.6) insights.push({ tier: 'win', icon: '🎯', head: 'Auto-Trade is calibrated', body: 'Auto-Trade win rate ' + (st.winRate * 100).toFixed(0) + '% over ' + st.totalTrades + ' closed. Process is dialed in.' });
      if (st.winRate != null && st.winRate < 0.40) insights.push({ tier: 'danger', icon: '🔴', head: 'Auto-Trade win rate is low', body: 'Only ' + (st.winRate * 100).toFixed(0) + '% wins. Raise minConviction or tighten stops.' });
    }
  }
  // Mental game
  if (window.StreakTracker) {
    const snap = window.StreakTracker.snapshot();
    if (!snap.empty) {
      const m = window.StreakTracker.mentalState(snap);
      if (snap.currentStreak <= -3) insights.push({ tier: 'danger', icon: '🧊', head: 'Loss streak active', body: m.message });
      else if (snap.currentStreak >= 5) insights.push({ tier: 'warn', icon: '🔥', head: 'Hot streak', body: 'You\'re ' + snap.currentStreak + ' wins in a row. Statistically, mean reversion is coming. Don\'t up-size.' });
    }
  }
  // Calibration
  if (window.CalibrationView) {
    const ece = window.CalibrationView.ece();
    if (ece != null && ece > 0.10) insights.push({ tier: 'warn', icon: '📐', head: 'Calibration is off', body: 'ECE ' + (ece * 100).toFixed(1) + '%. When brain says X% it\'s not winning X% of the time. Either filter higher or retrain.' });
    else if (ece != null && ece < 0.05) insights.push({ tier: 'win', icon: '✓', head: 'Brain is well-calibrated', body: 'ECE only ' + (ece * 100).toFixed(1) + '%. When brain says 70% it actually wins ~70% — trust the numbers.' });
  }
  // Position correlation
  if (window.PositionCorrelation) {
    const c = window.PositionCorrelation.snapshot();
    if (c.positions.length >= 3 && c.score != null && c.score < 0.5) {
      insights.push({ tier: 'warn', icon: '🔗', head: 'Positions too correlated', body: c.positions.length + ' positions but only N_eff=' + c.n_eff + ' independent. You\'re betting on fewer themes than you think.' });
    }
  }
  // Equity protector
  if (window.EquityProtector) {
    const ep = window.EquityProtector.status();
    if (ep.triggered) insights.push({ tier: 'danger', icon: '🛑', head: 'Equity protector triggered', body: 'Auto-Trade paused after ' + (ep.drawdownPct * 100).toFixed(1) + '% drawdown. Wait for recovery before re-enabling.' });
  }
  // Trade Quality
  if (window.TradeQuality) {
    const tq = window.TradeQuality.summary();
    if (!tq.empty && tq.avgStars < 3) insights.push({ tier: 'warn', icon: '⭐', head: 'Trade quality is low', body: 'Avg ' + tq.avgStars + '/5 stars. Sloppy entries. Review pre-trade checklist before each entry.' });
    else if (!tq.empty && tq.avgStars >= 4) insights.push({ tier: 'win', icon: '⭐', head: 'Process is sharp', body: 'Avg ' + tq.avgStars + '/5 stars on quality. Trust the process even when individual outcomes hurt.' });
  }
  // Hot symbols
  if (window.HighConvictionAlerts) {
    const feed = window.HighConvictionAlerts.feed(50);
    if (feed.length >= 20) insights.push({ tier: 'info', icon: '🔔', head: 'High alert volume', body: feed.length + ' alerts in feed. Brain is finding lots of setups — but also more noise. Consider raising minConviction to filter.' });
  }
  if (insights.length === 0) {
    insights.push({ tier: 'info', icon: '⏳', head: 'Need more data', body: 'Insights generate as the brain collects trades. Check back after 10+ resolved trades.' });
  }
  return insights;
}

function render() {
  const insights = gatherInsights();
  const list = document.getElementById('insights-list');
  list.innerHTML = insights.map(i =>
    '<div class="insight ' + i.tier + '"><div class="icon">' + i.icon + '</div><div class="head">' + i.head + '</div><div class="body">' + i.body + '</div></div>'
  ).join('');
}
setTimeout(render, 600);
setInterval(render, 15000);
</script>
