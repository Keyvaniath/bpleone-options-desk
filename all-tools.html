  'short-interest.html','squeeze-radar.html','squeeze-radar-pro.html','squeeze-composite.html','short-squeeze-alerts.html','volume-profile.html',
  'moc-imbalance.html','etf-flows.html','liquidity-health.html','pair-scanner.html','symbol-diff.html',
  'heat-clock.html','earnings-reactor.html','sentiment-vs-model.html','anomalies.html','market-internals.html','macro.html','insider-congress-flow.html','seasonality.html'
]);

function paint() {
  const cat = document.getElementById('catalog');
  cat.innerHTML = '';
  let totalCount = 0, hidden = 0;
  CATALOG.forEach(c => {
    const tools = c.tools.filter(t => { if (SAMPLE_FILES.has(t.file)) { hidden++; return false; } return true; });
    if (!tools.length) return;
    totalCount += tools.length;
    const section = document.createElement('div');
    section.className = 'cat-section';
    section.innerHTML = '<div class="cat-title">' + c.cat + ' <span style="color:var(--text-muted);font-weight:500;font-size:11px;margin-left:6px;">(' + tools.length + ')</span></div>';
    const grid = document.createElement('div');
    grid.className = 'tile-grid';
    tools.forEach(t => {
      const tile = document.createElement('a');
      tile.className = 'tool-tile';
      tile.href = t.file;
      tile.dataset.name = (t.name + ' ' + t.desc).toLowerCase();
      tile.innerHTML = '<div class="icon">' + t.icon + '</div><div class="body"><div class="name">' + t.name + '</div><div class="desc">' + t.desc + '</div></div>';
      grid.appendChild(tile);
    });
    section.appendChild(grid);
    cat.appendChild(section);
  });
  document.title = 'All Tools (' + totalCount + ') — bpleone / trade';
  if (hidden > 0) {
    const note = document.createElement('div');
    note.style.cssText = 'margin-top:18px;padding:12px 14px;border:1px dashed var(--border);border-radius:8px;font-size:11px;color:var(--text-muted);line-height:1.6;';
    note.innerHTML = '<strong>' + hidden + '</strong> paid-feed tools (options flow, dark pool, L2 tape/order-book, short-interest / squeeze, MOC, ETF flows) are hidden from this catalog because they need a paid market-data feed to show live numbers. The desk lists only real-data tools. <a href="data-truth.html" style="color:var(--accent);">How the data works →</a>';
    cat.appendChild(note);
  }
}
paint();

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('.tool-tile').forEach(t => {
    t.style.display = !q || t.dataset.name.includes(q) ? '' : 'none';
  });
  // Hide empty sections
  document.querySelectorAll('.cat-section').forEach(s => {
    const visible = Array.from(s.querySelectorAll('.tool-tile')).filter(t => t.style.display !== 'none').length;
    s.style.display = visible === 0 ? 'none' : '';
  });
});
</script>
