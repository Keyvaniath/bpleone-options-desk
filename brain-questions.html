<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brain Questions — bpleone / trade</title>
<meta name="description" content="Pre-built questions you can ask the brain. One-click answers from your own data, no LLM required.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css?v=v239">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#00d4ff">
<style>
.q-card { padding:18px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all 0.15s; }
.q-card:hover { border-color:var(--accent);transform:translateY(-2px); }
.q-card h4 { font-size:14px;font-weight:700;margin-bottom:8px; }
.q-card .cat { display:inline-block;font-size:9px;padding:2px 8px;border-radius:10px;background:rgba(0,212,255,0.15);color:var(--accent);text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-bottom:8px; }
.answer-card { padding:24px;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.25);border-radius:12px;margin-bottom:24px; }
.answer-card .q { font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--border); }
.answer-card .a { font-size:15px;line-height:1.85;color:var(--text-primary); }
.answer-card .a strong { color:var(--accent); }
</style>
  <link rel="canonical" href="https://options.bpleone.com/brain-questions.html">
</head>
<body>
<div id="site-nav"></div>

<div class="container">
  <div class="page-header">
    <div>
      <div class="page-title">🤔 Brain Questions</div>
      <div class="page-subtitle">Pre-built questions · one-click answers from YOUR data · no LLM needed · <span id="market-clock">--</span></div>
    </div>
  </div>

  <div id="answer"></div>

  <div class="grid grid-3" id="qGrid" style="gap:14px;"></div>
</div>

<div id="site-footer"></div>

<script src="js/data-provider.js?v=v239"></script>
<script src="js/ai-client.js?v=v239"></script>
<script src="js/app.js?v=v239"></script>
<script src="js/notify.js?v=v239"></script>
<script src="js/live.js?v=v239"></script>
<script src="js/train-rows.js?v=v239"></script>
<script src="js/model.js?v=v239"></script>
<script>
buildNav('brain-questions');

function loadTrain() { return window.TrainRows ? TrainRows.load() : []; }   // pass 344: graded calls (js/train-rows.js); 'bpleone_train_v1' was never written
function loadFindings() { try { return JSON.parse(localStorage.getItem('bpleone_brain_findings_v1') || '{"items":[]}').items; } catch(e) { return []; } }
function loadJournal() { try { return JSON.parse(localStorage.getItem('bpleone_journal_pro_v1') || '[]'); } catch(e) { return []; } }

// Pass 344: answers come from the browser model's GRADED calls (js/train-rows.js; the old key was never written), in
// realized % per call (no assumed +1.5R per win), graded against market drift, with no "trade it more" advice.
const esc = TrainRows.esc;
const pct = v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%';
const NONE = () => TrainRows.EMPTY_HTML;
function groupAvg(train, keyOf, minN) {
  const by = {};
  train.forEach(t => { if (typeof t.pnl !== 'number') return; const k = keyOf(t); if (k == null) return; if (!by[k]) by[k] = { n:0, r:0, w:0 }; by[k].n++; by[k].r += t.pnl; if (t.y === 1) by[k].w++; });
  return Object.entries(by).filter(([,v]) => v.n >= minN);
}
const QUESTIONS = [
  { cat:'performance', q:'How is the browser model doing this week?', a:() => {
    const all = loadTrain();
    if (!all.length) return NONE();
    const train = all.filter(t => t.ts >= Date.now() - 7*86400000);
    if (train.length === 0) return 'No calls captured in the last 7 days have been graded yet (calls grade after 5 days).';
    const g = TrainRows.grade(train);
    const r = train.reduce((a, t) => a + TrainRows.ret(t), 0);
    return '<strong>' + train.length + '</strong> graded calls captured this week: ' + esc(g.text) + ' Summed move in the called direction: <strong>' + pct(r) + '</strong>.';
  }},
  { cat:'performance', q:'Which symbol has the best record?', a:() => {
    const train = loadTrain();
    if (!train.length) return NONE();
    const arr = groupAvg(train, t => t.meta?.sym || null, 5).sort((a,b) => b[1].r/b[1].n - a[1].r/a[1].n);
    if (arr.length === 0) return 'No symbol has 5+ graded calls yet.';
    const [sym, v] = arr[0];
    return '<strong>' + esc(sym) + '</strong>: <strong>' + pct(v.r/v.n) + ' per call</strong> in the called direction, ' + v.w + '/' + v.n + ' right. A small per-symbol sample is mostly noise, not an edge.';
  }},
  { cat:'performance', q:'Which symbol has the worst record?', a:() => {
    const train = loadTrain();
    if (!train.length) return NONE();
    const arr = groupAvg(train, t => t.meta?.sym || null, 5).sort((a,b) => a[1].r/a[1].n - b[1].r/b[1].n);
    if (arr.length === 0) return 'No symbol has 5+ graded calls yet.';
    const [sym, v] = arr[0];
    return '<strong>' + esc(sym) + '</strong>: <strong>' + pct(v.r/v.n) + ' per call</strong>, ' + v.w + '/' + v.n + ' right.';
  }},
  { cat:'patterns', q:'Which setup has the best record?', a:() => {
    const train = loadTrain();
    if (!train.length) return NONE();
    const arr = groupAvg(train, t => t.meta?.setup || null, 5).sort((a,b) => b[1].r/b[1].n - a[1].r/a[1].n);
    if (arr.length === 0) return 'No setup has 5+ graded calls yet.';
    const [k, v] = arr[0];
    return '<strong>' + esc(k) + '</strong>: <strong>' + pct(v.r/v.n) + ' per call</strong> over ' + v.n + ' graded calls (' + v.w + ' right). Not tested against drift; treat it as a lead, not an edge.';
  }},
  // Audit pass 170: bucket by ET clock so hour/dow stats reflect the
  // market-attribution calendar, not the user's local timezone.
  { cat:'timing', q:'Which capture hour has the best record?', a:() => {
    function etHourOf(ts) { try { return new Date(new Date(ts).toLocaleString('en-US', { timeZone: 'America/New_York' })).getHours(); } catch(e) { return new Date(ts).getHours(); } }
    const train = loadTrain();
    if (!train.length) return NONE();
    const arr = groupAvg(train, t => etHourOf(t.ts), 5).sort((a,b) => b[1].r/b[1].n - a[1].r/a[1].n);
    if (arr.length === 0) return 'No hour has 5+ graded calls yet.';
    const [h, v] = arr[0];
    return 'Calls captured at <strong>' + h + ':00 ET</strong>: <strong>' + pct(v.r/v.n) + ' per call</strong> across ' + v.n + ' graded calls.';
  }},
  { cat:'timing', q:'Which weekday has the worst record?', a:() => {
    function etDowOf(ts) { try { return new Date(new Date(ts).toLocaleString('en-US', { timeZone: 'America/New_York' })).getDay(); } catch(e) { return new Date(ts).getDay(); } }
    const train = loadTrain();
    if (!train.length) return NONE();
    const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const arr = groupAvg(train, t => etDowOf(t.ts), 5).sort((a,b) => a[1].r/a[1].n - b[1].r/b[1].n);
    if (arr.length === 0) return 'No weekday has 5+ graded calls yet.';
    const [d, v] = arr[0];
    return '<strong>' + dayNames[d] + '</strong>: <strong>' + pct(v.r/v.n) + ' per call</strong> across ' + v.n + ' graded calls.';
  }},
  { cat:'risk', q:'Is the browser model overconfident?', a:() => {
    const train = loadTrain();
    if (!train.length) return NONE();
    // Confidence AT CAPTURE in the direction called (re-scoring old calls with today's weights tests a different model).
    const probs = train.filter(t => typeof t.predProb === 'number').map(t => ({ c: Math.max(t.predProb, 1 - t.predProb), y: t.y }));
    const high = probs.filter(x => x.c >= 0.7);
    if (high.length < TrainRows.MIN_N) return 'Only ' + high.length + ' graded calls were made at 70%+ confidence; needs ' + TrainRows.MIN_N + '+ to judge.';
    const hitHigh = high.filter(x => x.y === 1).length / high.length;
    const avgC = high.reduce((a, x) => a + x.c, 0) / high.length;
    if (avgC - hitHigh > 0.1) return '<strong style="color:var(--red);">Yes</strong>: calls made at ' + (avgC*100).toFixed(0) + '% average confidence were right ' + (hitHigh*100).toFixed(0) + '% of the time (n=' + high.length + ').';
    return '<strong>Not by this test</strong>: calls made at ' + (avgC*100).toFixed(0) + '% average confidence were right ' + (hitHigh*100).toFixed(0) + '% of the time (n=' + high.length + ').';
  }},
  { cat:'risk', q:'How concentrated are the graded calls?', a:() => {
    const train = loadTrain();
    if (train.length === 0) return NONE();
    const bySym = {};
    train.forEach(t => { const s = t.meta?.sym || '—'; bySym[s] = (bySym[s] || 0) + 1; });
    const arr = Object.entries(bySym).sort((a,b) => b[1] - a[1]);
    const top3Pct = (arr.slice(0, 3).reduce((a, x) => a + x[1], 0) / train.length * 100).toFixed(0);
    return 'The top 3 symbols (' + arr.slice(0, 3).map(x => esc(x[0])).join(', ') + ') account for <strong>' + top3Pct + '%</strong> of graded calls.';
  }},
  { cat:'signals', q:'Anything scored in the last hour?', a:() => {
    const findings = loadFindings().filter(f => Date.now() - f.ts < 3600 * 1000 && f.meta && f.meta.sym);
    if (findings.length === 0) return 'No symbol findings in the last hour.';
    const ranked = findings.map(f => { let p = null; try { if (window.predictForFinding) { const r = window.predictForFinding(f); p = r ? r.prob : null; } } catch(e) {} return { ...f, p }; }).filter(f => f.p != null).sort((a,b) => b.p - a.p);
    if (ranked.length === 0) return findings.length + ' finding(s) in the last hour, but no model probabilities yet.';
    const top = ranked[0];
    return '<strong>' + esc(top.meta.sym) + '</strong>: the browser model scores its <strong>' + esc(top.meta.setup || 'signal') + '</strong> finding at <strong>' + (top.p*100).toFixed(0) + '%</strong> (raw output, no proven edge over drift; the desk\'s own pick is on <a href="pick-of-day.html" style="color:var(--accent);">Pick of the Day</a>).';
  }},
  { cat:'discipline', q:'Did I follow my plan last 10 trades?', a:() => {
    const journal = loadJournal().filter(t => t.exit != null).slice(0, 10);
    if (journal.length === 0) return 'No closed trades in Journal PRO yet.';
    return 'Check <a href="trade-vs-plan.html" style="color:var(--accent);">Trade vs Plan</a> for a full breakdown. Quick: of your last ' + journal.length + ' closed trades, the adherence grade is computed there.';
  }},
  { cat:'discipline', q:'Am I revenge-trading?', a:() => {
    const journal = loadJournal().slice(0, 20);
    let revenges = 0;
    for (let i = 1; i < journal.length; i++) {
      const cur = journal[i-1], prev = journal[i];
      if (prev.pnl < 0 && cur.ts - prev.ts < 15 * 60 * 1000) revenges++;
    }
    if (revenges === 0) return '<strong style="color:var(--green);">No</strong> — no trades within 15 min of a losing trade. Good discipline.';
    return '<strong style="color:var(--red);">Maybe</strong> — ' + revenges + ' of your last 20 trades came within 15 min of a previous loss. That\'s the tilt zone.';
  }},
  { cat:'meta', q:'How many calls has the browser model graded?', a:() => {
    const train = loadTrain();
    if (!train.length) return NONE();
    return '<strong>' + train.length + '</strong> graded calls in this browser. ' + esc(TrainRows.grade(train).text) + ' The desk\'s live record is the <a href="edge-scorecard.html" style="color:var(--accent);">Edge Scorecard</a>.';
  }}
];

function answer(q) {
  const ans = q.a();
  document.getElementById('answer').innerHTML = '<div class="answer-card">'
    + '<div class="q">🤔 ' + q.q + '</div>'
    + '<div class="a">' + ans + '</div>'
    + '</div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('qGrid').innerHTML = QUESTIONS.map((q, i) =>
  '<div class="q-card" data-i="' + i + '">'
  + '<div class="cat">' + q.cat + '</div>'
  + '<h4>' + q.q + '</h4>'
  + '<div style="font-size:11px;color:var(--text-muted);">Click for instant answer →</div>'
  + '</div>'
).join('');

document.querySelectorAll('.q-card').forEach(c => c.addEventListener('click', () => {
  answer(QUESTIONS[+c.dataset.i]);
}));
</script>
</body>
</html>
